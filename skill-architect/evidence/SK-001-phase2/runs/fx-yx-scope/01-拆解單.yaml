case: 〔店家A〕 9 月上旬營運與採購彙整(測試案例 1)
status: READY
goal: 彙整 2026-09-01 至 2026-09-09 的營運資料。產出每日營收、訂單數、客單價;已入帳採購支出合計(含稅實付);未入帳單據積壓(張數、金額、單據編號);資料品質異常清單。
definition_of_done: >
  (1) 9/1 至 9/9 每天各有一列營收、訂單數、客單價。來源沒有的日期標「無資料」,不補值。
  (2) 已入帳採購實付合計有明確數字,並附排除或存疑列的清單。
  (3) 積壓單據有張數、金額合計和單據編號全清單。測試單據、已作廢單據已排除,並列出被排除的編號。
  (4) 異常清單的每筆都有檔案、列號、問題類型。
  (5) 所有數字都能追溯到來源檔案與列號。
tasks:
  - id: T1
    title: 每日營收、訂單數、客單價
    brief: >
      讀 cases/yx/data/工作表1.csv,表頭為 日期,營收,訂單數,退款金額。日期與數字可能是全形字元,例如「２０２６／０９／０３」「５９９４２」,需先轉成半形與 YYYY-MM-DD。
      只保留 2026-09-01 至 2026-09-09。對每個日期輸出:營收、訂單數、退款金額,客單價 = 營收 ÷ 訂單數,四捨五入到整數元。
      同一日期有多列時不要自行合併,逐列列出並標註重複。訂單數為 0 或空白時,客單價填 null。
      缺少的日期輸出「無資料」,不得推測。
      營收是否已扣退款,來源沒有說明。請同時回報原始營收和「營收 − 退款金額」兩種數字,並註明口徑不明。客單價以原始營收計算。
      我們看到的前幾列只有 9/3 一筆資料,請讀完整檔案後確認實際列數。
    inputs: [cases/yx/data/工作表1.csv]
    output_schema: {日期: string, 營收: number, 訂單數: number, 退款金額: number, 客單價: number|null, 淨營收: number, 來源列號: number, 備註: string}
    depends_on: []
    parallel_group: A
    acceptance:
      - 9/1 至 9/9 每天都有一列,缺資料的日期標「無資料」
      - 營收欄加總 = 來源檔在區間內各列營收之和,並列出參與加總的列號
      - 每個客單價 = 營收 ÷ 訂單數,四捨五入到整數
      - 列出全形轉換過的列號,以及重複日期、非數字值、負數值所在的列號
      - 明確說明來源檔共幾列、涵蓋哪些日期
    suggested_agent: sk-worker
  - id: T2
    title: 已入帳採購支出合計
    brief: >
      讀 cases/yx/data/小購_採購主表_V02.csv,表頭為 日期,廠商,品類,品名,數量,單位,單價,總價,稅金,實付金額,備註。
      只計 2026-09-01 至 2026-09-09 的列。計算「實付金額」合計,這是含稅實付口徑。
      同時分別回報總價合計和稅金合計,供對照。
      注意:實付金額為空的列(例如 9/2 〔供應商S1〕 客家切片豬油蔥 1 桶,總價 4619,稅金與實付皆空)不要用總價或稅金自行補值。
      這類列單獨列出列號,並說明對合計的影響(未計入)。
      另外檢查是否有疑似重複列(同日期、廠商、品名、數量重複)、實付金額 ≠ 總價 + 稅金 的列,以及日期在區間外的列。只列出,不修正。
      9/2 該廠商在多列之間可能是同張發票拆列,實付金額可能只記在其中一列。不要自行判斷,只列出並標註。
    inputs: [cases/yx/data/小購_採購主表_V02.csv]
    output_schema: {實付金額合計: number, 總價合計: number, 稅金合計: number, 納入列數: number, 實付為空列: "[{列號, 日期, 廠商, 總價}]", 疑似重複列: "[列號]", 金額不平列: "[{列號, 總價, 稅金, 實付}]", 區間外列: "[列號]"}
    depends_on: []
    parallel_group: A
    acceptance:
      - 實付金額合計 = 區間內各列實付金額(空值視為不計入)之和,並列出納入的列數
      - 列出所有實付金額為空的列號與其總價
      - 列出所有 實付 ≠ 總價 + 稅金 的列號
      - 列出所有日期不在 9/1 至 9/9 的列號及處理方式(不計入)
      - 另列依廠商分組的實付小計,各廠商小計加總 = 實付金額合計
    suggested_agent: sk-worker
  - id: T3
    title: 未入帳單據積壓
    brief: >
      讀 cases/yx/data/小購_暫存單據_V01.csv,表頭為 單據編號,門市,店員,圖片位置,辨識結果,狀態,建立時間。
      「辨識結果」欄是 JSON,而且有兩種結構。舊格式是 供應商/日期/品項/數量/單價/金額。新格式是 supplier/date/items[]/total_amount/warnings/metadata。解析時兩種都要處理。
      未入帳積壓定義:狀態為「待確認」(以及檔內其他非「已確認」「已作廢」的狀態,請列出檔內所有狀態值與各自張數)。
      排除:單據編號含 TEST 或店員為 U_test_clerk 的測試單據,以及狀態為「已作廢」的單據。被排除的編號要列出並註明原因。
      對每張積壓單據輸出:單據編號、供應商、日期、金額(新格式取 total_amount,舊格式取 金額)、狀態、建立時間。
      輸出張數、金額合計和編號全清單。JSON 無法解析、金額缺漏或 warnings 非空的單據不要略過,列出並標註,金額視為 null,不計入合計但要說明。
      「已確認」單據是否已進採購主表,無法確定。不要與 V02 做比對推斷,只回報狀態。
    inputs: [cases/yx/data/小購_暫存單據_V01.csv]
    output_schema: {積壓張數: number, 積壓金額合計: number, 積壓明細: "[{單據編號, 供應商, 日期, 金額, 狀態, 建立時間, 備註}]", 狀態分布: "{狀態: 張數}", 排除單據: "[{單據編號, 原因}]", 無法解析單據: "[單據編號]"}
    depends_on: []
    parallel_group: A
    acceptance:
      - 狀態分布各張數加總 = 檔案資料列總數
      - 積壓張數 = 明細列數,且明細不含任何測試單據或已作廢單據
      - 積壓金額合計 = 明細中金額非 null 者之和,並列出金額為 null 的編號
      - 列出所有被排除的編號與原因
      - 列出 JSON 解析失敗或兩種格式都不符的列號
    suggested_agent: sk-worker
  - id: T4
    title: 資料品質稽核
    brief: >
      稽核四個檔案,只列出問題,不修正,也不做營收、採購、積壓的合計(這些由 T1 到 T3 負責)。
      檔案為 cases/yx/data/ 下的 工作表1.csv、小購_暫存單據_V01.csv、小購_採購主表_V02.csv、小購_測試資料_V01.csv。
      檢查項目:
      (a) 格式:全形數字或日期、日期格式不一致、數字欄含非數字、稅金或實付為空、品類為空;
      (b) 重複:完全重複列,以及同單據編號出現多次;
      (c) 缺漏:必填欄為空,例如 9/1 至 9/9 缺少的營收日期;
      (d) 測試資料:單據編號含 TEST、店員 U_test_clerk、gs://test 圖片位置、供應商含「測試」,以及 小購_測試資料_V01.csv 的內容,是否也出現在暫存單據中;
      (e) 口徑不一致:暫存單據 JSON 新舊兩種欄位結構、營收是否含退款不明、採購主表 單價 × 數量 ≠ 總價 的列、總價 + 稅金 ≠ 實付的列;
      (f) 跨檔案:暫存單據的日期或供應商是否落在區間外。
      每筆異常輸出:檔案、列號(以資料列計,表頭為第 1 列)、類型、描述、建議處理。
      不要把「已確認單據是否已入帳」當成異常去推測。
    inputs: [cases/yx/data/工作表1.csv, cases/yx/data/小購_暫存單據_V01.csv, cases/yx/data/小購_採購主表_V02.csv, cases/yx/data/小購_測試資料_V01.csv]
    output_schema: {異常清單: "[{檔案, 列號, 類型, 描述, 建議處理}]", 各類型計數: "{類型: 數量}", 各檔案列數: "{檔案: 列數}"}
    depends_on: []
    parallel_group: A
    acceptance:
      - 四個檔案各有列數,並至少各有一行檢查結果(含「未發現問題」)
      - 每筆異常都有檔案與列號
      - 各類型計數加總 = 異常清單筆數
      - 列出小購_測試資料_V01.csv 的每一列,並註明該單據編號是否也出現在暫存單據中
      - 明確列出 9/1 至 9/9 之間營收檔缺少的日期
    suggested_agent: sk-worker
key_figures: [9/1 至 9/9 營收合計, 9/1 至 9/9 訂單數合計, 各日客單價, 已入帳採購實付合計(含稅), 實付金額為空的列數, 積壓單據張數, 積壓金額合計, 積壓單據編號清單, 被排除的測試與作廢單據數, 營收缺資料日期, 資料品質異常總筆數]
risks:
  - 工作表1.csv 預覽只見表頭加 9/3 一筆資料(9/3 營收 59942、訂單數 220)。9/1 至 9/9 可能大部分日期缺資料,每日營收的完整性有風險。
  - 營收是否已扣除退款金額,來源沒有說明。需同時呈現兩種口徑。
  - 採購主表有實付金額為空的列,合計可能低估。9/2 〔供應商S1〕有疑似同張發票拆列,實付 14550 可能與總價 + 稅金不對應。
  - 暫存單據 JSON 有新舊兩種結構,解析時要處理兩種。
  - 暫存單據含測試單據(R-TEST-*、U_test_clerk)。R-001-〔單據#1〕 的供應商是「測試食品行」,卻是真實店員與真實圖片連結,屬於測試與否的模糊案例。是否計入積壓待確認,預設計入但標註。
  - 「已確認」單據與採購主表之間沒有對應鍵,不能推斷是否已入帳。
  - 四個檔案都存在,但上述各檔只讀了前幾列,實際列數與全部異常要等各卡完整讀取後才知道。
open_questions:
  - 營收欄是否已扣除退款金額?
  - 供應商為「測試食品行」但店員與圖片連結看似真實的單據(如 R-001-〔單據#1〕),是否算測試資料而排除?
  - 採購主表實付金額為空的列,業主希望補值還是只標註?本案預設只標註。
  - 「積壓」是否僅指狀態「待確認」,還是包含其他非「已確認」「已作廢」的狀態?預設為前者加上其他非終結狀態,並列出狀態分布。
