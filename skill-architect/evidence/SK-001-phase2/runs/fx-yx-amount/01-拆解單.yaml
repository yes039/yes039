case: 〔店家A〕 9 月上旬營運與採購彙整（測試案例 1）
status: READY
goal: 彙整 2026-09-01 至 2026-09-09 的營運資料。要產出四項成果：每日營收、訂單數、客單價；已入帳採購支出合計（含稅實付）；未入帳單據積壓（張數、金額、單據編號）；資料品質異常清單。只使用 4 個唯讀 CSV 快照，不推測未提供的資料。
definition_of_done: |
  1. 9/1 到 9/9 每天都有一列營收、訂單數、客單價。客單價 = (營收 − 退款金額) ÷ 訂單數。如果實際採用其他口徑，要註明。缺資料的日期要明列，不可補值。
  2. 已入帳採購支出合計 = 採購主表在期間內「實付金額」的加總。實付金額為空的列已列出，並寫明處理方式。
  3. 未入帳積壓以暫存單據的狀態判定，排除測試單據與已作廢單據。列出張數、金額合計與單據編號清單。
  4. 異常清單的每一項都有檔名、列號、問題類型和說明。
  5. 所有關鍵數字都能追溯到來源檔案與列號。
tasks:
  - id: T1
    title: 每日營收、訂單數、客單價
    brief: |
      讀取 cases/yx/data/工作表1.csv，表頭為 日期,營收,訂單數,退款金額。
      日期和數字是全形字元，例如「２０２６／０９／０３」和「５９９４２」。請先轉成半形，再轉成 YYYY-MM-DD 與數值。
      只取 2026-09-01 至 2026-09-09。
      每日算出：營收、訂單數、退款金額、客單價 = (營收 − 退款金額) ÷ 訂單數，四捨五入到整數元。同時另列「未扣退款」的客單價 = 營收 ÷ 訂單數，供對照。
      異常處理：
      - 日期重複、缺日、訂單數為 0 或空白、營收為負、無法解析的列，都不要修正或補值。
      - 每一項都列入 anomalies，附列號。
      - 重複日期的列都要列出，不可擅自挑一列。
      - 期間外的列不計入，但要列出筆數。
      最後給出期間合計營收、合計訂單數、合計退款。
    inputs: [cases/yx/data/工作表1.csv]
    output_schema: {daily: "list[{日期:str, 營收:int, 訂單數:int, 退款金額:int, 客單價:int, 客單價_未扣退款:int, 來源列號:int}]", totals: "{營收:int, 訂單數:int, 退款:int}", missing_dates: "list[str]", anomalies: "list[{列號:int, 類型:str, 說明:str}]"}
    depends_on: []
    parallel_group: A
    acceptance:
      - daily 各日營收加總 = totals.營收，並寫出算式
      - 9/1 到 9/9 每天不是出現在 daily，就是出現在 missing_dates，合計 9 天
      - 每筆 daily 都有來源列號
      - 全形轉半形的轉換規則已寫明
      - 日期重複的列與無法解析的列都已列出列號，沒有的話明確寫「無」
    suggested_agent: sk-worker
  - id: T2
    title: 已入帳採購支出合計（含稅實付）
    brief: |
      讀取 cases/yx/data/小購_採購主表_V02.csv，表頭為 日期,廠商,品類,品名,數量,單位,單價,總價,稅金,實付金額,備註。
      只取日期在 2026-09-01 至 2026-09-09 的列，加總「實付金額」。
      另外分別給出：總價合計、稅金合計，以及依廠商分組的實付小計。
      異常處理：
      - 實付金額為空但總價有值的列，例如第 4 列，不要自行推算。這類列要單獨列出列號、總價與稅金，實付合計只計有值的列。
      - 另外報告「若以總價+稅金補算」的差額，僅供參考，標明為假設。
      - 檢查：實付金額是否等於總價+稅金、數量×單價是否約等於總價、疑似重複列（同日期、廠商、品名、總價相同）、品類空白、日期格式異常、日期落在期間外。
      - 每一項都列出列號。
      - 備註中的數字，例如效期日，不當作金額。
    inputs: [cases/yx/data/小購_採購主表_V02.csv]
    output_schema: {total_paid:int, total_price:int, total_tax:int, by_vendor:"list[{廠商:str, 實付:int}]", blank_paid_rows:"list[{列號:int, 總價:int, 稅金:int|null}]", in_range_rows:int, out_of_range_rows:int, anomalies:"list[{列號:int, 類型:str, 說明:str}]"}
    depends_on: []
    parallel_group: A
    acceptance:
      - by_vendor 實付加總 = total_paid
      - 實付金額為空的列已全部列出列號，沒有的話寫「無」
      - 納入列數 + 期間外列數 = 檔案資料總列數（不含表頭）
      - 疑似重複列已列出列號組，沒有的話寫「無」
      - 實付 ≠ 總價+稅金的列已列出列號與差額
    suggested_agent: sk-worker
  - id: T3
    title: 未入帳單據積壓盤點
    brief: |
      讀取 cases/yx/data/小購_暫存單據_V01.csv，表頭為 單據編號,門市,店員,圖片位置,辨識結果,狀態,建立時間。
      「辨識結果」欄是 JSON，且有兩種格式：
      - 舊格式：供應商、日期、品項、數量、單價、金額
      - 新格式：supplier、date、items[]、total_amount、warnings[]、metadata
      先列出「狀態」欄所有不同的值和筆數。
      判定規則：
      - 狀態為「待確認」的單據，視為未入帳積壓。
      - 狀態為「已確認」，視為已確認。這個檔案無法證明已寫入採購主表，只能在 T5 之外另行說明，不可在此推測。
      - 狀態為「已作廢」，排除。
      - 其他值，例如退回或處理中，單獨列出並說明歸類假設。
      - 單據編號含「TEST」，或店員為 U_test_clerk、供應商含「測試」的單據，是測試資料，要排除並另列。注意 R-001-〔單據#1〕 的供應商是「測試食品行」，但店員是真實 ID。請單獨標記為「疑似測試」，不要自行決定排除與否，並在兩種口徑下各算一次。
      金額：新格式取 total_amount，舊格式取「金額」。無法解析 JSON 的列，金額記為 null，並列出列號。
      輸出：積壓張數、金額合計、單據編號清單（含供應商、日期、金額、建立時間）。
      異常：單據編號重複、日期落在期間外、items 金額加總 ≠ total_amount、warnings 非空、JSON 解析失敗、建立時間與單據日期不一致。
    inputs: [cases/yx/data/小購_暫存單據_V01.csv]
    output_schema: {status_counts:"dict[str,int]", backlog:"{張數:int, 金額:int, 單據編號:list[str]}", backlog_excluding_suspect:"{張數:int, 金額:int}", test_rows:"list[{列號:int, 單據編號:str}]", suspect_test_rows:"list[str]", parse_failures:"list[int]", anomalies:"list[{列號:int, 單據編號:str, 類型:str, 說明:str}]"}
    depends_on: []
    parallel_group: A
    acceptance:
      - status_counts 各值加總 = 檔案資料總列數（不含表頭）
      - 積壓張數 = backlog.單據編號 的元素數
      - 積壓金額 = 清單中各單據金額的加總，並寫出算式
      - 測試單據與作廢單據都不在 backlog 內
      - 疑似測試單據在含與不含兩種口徑下的張數和金額都已給出
      - JSON 解析失敗的列已列出列號，沒有的話寫「無」
    suggested_agent: sk-worker
  - id: T4
    title: 測試資料檔稽核與測試資料外洩檢查
    brief: |
      讀取 cases/yx/data/小購_測試資料_V01.csv，表頭為 單據編號,門市,供應商,日期,品項,數量,單價,金額,確認人,確認時間。
      逐列列出單據編號、供應商、金額、確認人。
      判定哪些列是測試資料：單據編號含「TEST」、確認人為 U_test_clerk、供應商含「測試」。
      再核對這些單據編號是否出現在 cases/yx/data/小購_暫存單據_V01.csv 的「單據編號」欄。有出現的，記下該單據在暫存檔的狀態，這代表測試資料混進正式檔。
      同時檢查：這個檔案的供應商、日期、金額是否出現在 cases/yx/data/小購_採購主表_V02.csv（比對 日期＋廠商＋總價）。有的話列出，表示測試資料可能混入已入帳資料。
      只做比對，不修改任何檔案。這張卡不要重新計算積壓或採購合計。
    inputs: [cases/yx/data/小購_測試資料_V01.csv, cases/yx/data/小購_暫存單據_V01.csv, cases/yx/data/小購_採購主表_V02.csv]
    output_schema: {rows:"list[{列號:int, 單據編號:str, 是否測試:bool, 判定依據:str}]", leaked_into_staging:"list[{單據編號:str, 暫存檔列號:int, 狀態:str}]", leaked_into_main:"list[{測試檔列號:int, 主表列號:int}]", test_amount_total:int}
    depends_on: []
    parallel_group: A
    acceptance:
      - rows 的數量 = 檔案資料總列數（不含表頭）
      - 每一列都有判定依據，且寫明命中的條件
      - leaked_into_staging 與 leaked_into_main 都已逐筆列出，沒有的話寫「無」
      - test_amount_total = rows 中是否測試為 true 的金額加總，並寫出算式
    suggested_agent: sk-worker
  - id: T5
    title: 跨檔資料品質與口徑稽核
    brief: |
      這張卡以 T1 到 T4 的輸出為輸入，只整理跨檔問題，不重算各檔的數字。
      彙整四項：
      (1) 各卡 anomalies 的去重總表，欄位為 檔名、列號、問題類型、說明、嚴重度（高、中、低）。
      (2) 口徑不一致，例如營收檔只有 營收、訂單數、退款金額，沒有門市欄，而單據檔有門市欄；日期格式有全形、半形、斜線等不同形式；實付與總價+稅金不一致；單據新舊兩種 JSON 格式。
      (3) 時間範圍覆蓋：營收、採購主表、暫存單據各自實際涵蓋的日期範圍，與需求期間 9/1 到 9/9 相比，哪些日期缺哪份資料。
      (4) 暫存單據中「已確認」的單據能否在採購主表找到對應（供應商＋日期＋金額）。列出找得到與找不到的數量。找不到的不要推論原因，只標「無法比對」。
      不得推測未提供的資料。
    inputs: [cases/yx/data/工作表1.csv, cases/yx/data/小購_暫存單據_V01.csv, cases/yx/data/小購_採購主表_V02.csv, cases/yx/data/小購_測試資料_V01.csv]
    output_schema: {anomaly_table:"list[{檔名:str, 列號:int, 類型:str, 說明:str, 嚴重度:str}]", coverage:"list[{來源:str, 最早日:str, 最晚日:str, 缺少日期:list[str]}]", confirmed_match:"{找到:int, 找不到:int, 找不到單據編號:list[str]}", definition_conflicts:"list[str]"}
    depends_on: [T1, T2, T3, T4]
    parallel_group: B
    acceptance:
      - anomaly_table 每一列都有檔名和列號
      - 同檔名、列號、類型相同的項目只出現一次
      - coverage 對三個來源各有一列，缺少日期以 9/1 到 9/9 為基準逐日列出
      - 找到 + 找不到 = 暫存檔狀態為「已確認」的單據數（排除測試單據）
    suggested_agent: sk-worker
key_figures:
  - 9/1 到 9/9 每日營收、訂單數、客單價
  - 期間合計營收、合計訂單數、合計退款
  - 缺資料的日期清單
  - 已入帳採購實付合計（含稅）
  - 採購主表實付金額為空的列數與其總價合計
  - 未入帳積壓張數、金額合計、單據編號（含與不含疑似測試兩種口徑）
  - 暫存單據各狀態筆數
  - 測試資料筆數及是否混入正式檔
  - 資料品質異常總數，依嚴重度分類
risks:
  - 營收檔的日期與數字是全形字元，必須先轉半形再計算，否則會算錯或漏列。
  - 營收檔的第 2 列是 9/3，檔案可能缺 9/1、9/2 及 9/4 之後的日期，目前只看了表頭和前幾列，未確認。
  - 客單價的口徑（是否扣退款）需求未明說，T1 同時給兩種數值，由調度官在成果單註明採用哪種。
  - 採購主表有實付金額為空的列（至少第 4 列），直接加總會低估已入帳支出。該列的總價與稅金都已有資料，但稅金也為空，不能推算。
  - 採購主表第 2、3 列疑似有口徑問題：第 3 列的實付 14550 不等於總價 9238 加稅 693，第 4 列與第 3 列的品名相同、單價相同，疑似重複。這些需 T2 確認。
  - 暫存單據的辨識結果有新舊兩種 JSON 格式，解析時容易遺漏。
  - R-001-〔單據#1〕 供應商是「測試食品行」，店員卻是真實 ID，無法確定是否為測試資料。
  - 暫存單據中「已確認」是否等於「已入帳」，檔案本身沒有說明，不可假設。
  - 「已入帳」的定義只能以採購主表為準，暫存單據只用來判定「未入帳」。
  - 資料只是試算表快照，不代表任何儀表板，也不代表即時狀態。
open_questions:
  - 客單價要不要扣除退款金額？預設用 (營收 − 退款) ÷ 訂單數，同時提供未扣退款的值。
  - 暫存單據狀態「已確認」是否代表已寫入採購主表？T5 只做比對，不做推論。
  - 疑似測試單據 R-001-〔單據#1〕 要不要計入積壓？目前兩種口徑並列。
  - 營收檔沒有門市欄，是單店還是多店合計？目前不分店，需求也沒有要求分店。
