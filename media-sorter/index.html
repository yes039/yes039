<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材整理機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ea; --card: #fffdf8; --ink: #1d1b16; --muted: #7a7466; --line: #e2dccd;
    --accent: #1f2a44; --accent-ink: #fff; --warn: #b4541f; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17161a; --card: #211f25; --ink: #ece8df; --muted: #a39d90; --line: #36333b;
      --accent: #c9b98a; --accent-ink: #17161a; --warn: #e48a55; --ok: #6cc28f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans TC", system-ui, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 80px; }
  header h1 { font-family: "Noto Serif TC", serif; font-size: clamp(26px, 5vw, 38px); margin: 4px 0 6px; }
  header h1 em { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 1.1em; padding: 0 4px; }
  header p { color: var(--muted); margin: 0; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin: 20px 0; }
  .stats div { background: var(--card); padding: 12px 16px; }
  .stats small { color: var(--muted); font-size: 12px; }
  .stats b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  .drop { border: 2px dashed var(--line); border-radius: 18px; background: var(--card); padding: 34px 16px; text-align: center; transition: .15s; }
  .drop.over { border-color: var(--accent); transform: scale(1.01); }
  .drop h2 { font-family: "Noto Serif TC", serif; font-size: 20px; margin: 0 0 12px; }
  .drop p { color: var(--muted); font-size: 13px; margin: 12px 0 0; }
  button, .btn { font: inherit; font-size: 14px; border-radius: 999px; padding: 8px 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn.primary, button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }

  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 18px 0 10px; }
  .status { font-size: 14px; color: var(--muted); }
  .progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 6px 0 0; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .cat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-height: 120px; }
  .cat.dragover { outline: 2px solid var(--accent); }
  .cat h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
  .cat h3 span { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .cat.unsorted { border-color: var(--warn); }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; }
  .thumb { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); cursor: pointer; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .v { position: absolute; right: 2px; bottom: 2px; font-size: 9px; background: #000a; color: #fff; padding: 0 3px; border-radius: 3px; }
  .thumb .low { position: absolute; left: 2px; top: 2px; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }

  details.settings { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin: 16px 0; }
  details.settings summary { cursor: pointer; font-weight: 500; }
  .catrow { display: grid; grid-template-columns: 140px 1fr 32px; gap: 6px; margin: 6px 0; }
  .catrow input, .settings input[type=text] { font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 100%; }
  .catrow button { padding: 0; justify-content: center; }
  .hint { color: var(--muted); font-size: 12px; }
  @media (max-width: 560px) { .catrow { grid-template-columns: 1fr 32px; } .catrow input:nth-child(2) { grid-column: 1 / -1; grid-row: 2; } }

  #menu { position: fixed; z-index: 10; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px #0003; padding: 6px; display: none; max-height: 70vh; overflow: auto; width: 240px; }
  #menu .pv { width: 100%; border-radius: 8px; margin-bottom: 4px; max-height: 180px; object-fit: contain; background: #000; }
  #menu .nm { font-size: 12px; color: var(--muted); word-break: break-all; padding: 2px 4px 6px; }
  #menu button { display: block; width: 100%; text-align: left; border: 0; border-radius: 8px; padding: 6px 8px; }
  #menu button:hover { background: var(--bg); }
  #menu button.cur { font-weight: 700; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p>素材整理機 · 照片／影片 AI 自動分類（全程在你的瀏覽器內，不上傳）</p>
    <h1>整理我的<em>Downloads</em>資料夾</h1>
  </header>

  <div class="stats">
    <div><small>總檔案</small><b id="sTotal">0</b></div>
    <div><small>● 影片</small><b id="sVideo">0</b></div>
    <div><small>● 照片</small><b id="sPhoto">0</b></div>
    <div><small>未分類</small><b id="sUnsorted">0</b></div>
  </div>

  <div class="drop" id="drop">
    <h2>把照片和影片拖到這裡</h2>
    <div class="row">
      <label class="btn primary">選擇資料夾<input id="pickDir" type="file" webkitdirectory multiple hidden></label>
      <label class="btn">選擇檔案<input id="pickFiles" type="file" accept="image/*,video/*" multiple hidden></label>
    </div>
    <p>支援 JPG／PNG／WEBP／GIF、MP4／MOV／WEBM。第一次使用會下載約 90MB 的 AI 模型（之後瀏覽器會快取）。</p>
  </div>

  <details class="settings">
    <summary>分類設定（可自訂類別）</summary>
    <p class="hint">左邊是資料夾名稱，右邊是給 AI 看的英文描述（可用「;」寫多句，越具體越準）。修改後會自動套用到下一次整理。</p>
    <div id="catEditor"></div>
    <div class="row" style="justify-content:flex-start;margin-top:8px">
      <button id="addCat">＋ 新增類別</button>
      <button id="resetCat">恢復預設</button>
      <label class="hint" style="margin-left:auto">信心門檻 <input id="thresh" type="range" min="0" max="0.8" step="0.05" value="0.3"> <span id="threshV">0.30</span>（低於門檻放「未分類」）</label>
    </div>
  </details>

  <div class="bar">
    <div style="flex:1;min-width:220px">
      <div class="status" id="status">尚未載入檔案</div>
      <div class="progress"><i id="prog"></i></div>
    </div>
    <div class="row">
      <button class="primary" id="run" disabled>開始整理</button>
      <button id="zip" disabled>下載整理好的 ZIP</button>
      <button id="csv" disabled>下載分類清單 CSV</button>
      <button id="clear" disabled>清空</button>
    </div>
  </div>
  <p class="hint">點縮圖可預覽並手動改分類；也可以把縮圖拖到其他類別。橘點＝AI 沒把握。</p>

  <div class="grid" id="grid"></div>
</div>
<div id="menu"></div>

<script type="module">
const TRANSFORMERS = 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js';
const JSZIP = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
const MODEL_ID = 'Xenova/clip-vit-base-patch32';
const UNSORTED = '未分類';

const DEFAULT_CATS = [
  { name: '自拍口播', prompt: 'a selfie of a person talking to the camera; a person vlogging facing the camera; a close-up portrait of a face' },
  { name: '穿搭', prompt: 'a full body photo of a person showing their outfit; a fashion outfit photo; clothes and shoes' },
  { name: '美食咖啡', prompt: 'a photo of food on a plate; a cup of coffee or a drink; a dessert or cake' },
  { name: '旅行風景', prompt: 'a landscape photo of nature or travel scenery; a city street or famous landmark; the sky, sea or mountains' },
  { name: '生活空間', prompt: 'a photo of a room interior; a home with furniture; a shop or cafe interior' },
  { name: '工作日常', prompt: 'a person working at a desk or computer; a meeting or a classroom; an office or workshop' },
  { name: '圖卡文字', prompt: 'a graphic design with large text; a poster or a slide with words; an infographic' },
  { name: '螢幕截圖與錄影', prompt: 'a screenshot of a phone app; a screenshot of a website or computer screen; a chat conversation screenshot' },
];
const SCREEN_RE = /(screenshot|screen ?shot|screen ?recording|螢幕截圖|截圖|螢幕錄影|屏幕截图|录屏)/i;

/* ---------- state ---------- */
let cats = loadCats();
let threshold = 0.3;
const items = []; // {id, file, kind, thumb, cat, score, done, error}
let textCache = null; // {key, embeds: Float32Array[] per cat (list of prompt embeds)}
let model = null;

const $ = (id) => document.getElementById(id);

function loadCats() {
  try { const c = JSON.parse(localStorage.getItem('mediaSorterCats')); if (Array.isArray(c) && c.length) return c; } catch {}
  return structuredClone(DEFAULT_CATS);
}
function saveCats() { try { localStorage.setItem('mediaSorterCats', JSON.stringify(cats)); } catch {} }

/* ---------- category editor ---------- */
function renderEditor() {
  const box = $('catEditor'); box.innerHTML = '';
  cats.forEach((c, i) => {
    const r = document.createElement('div'); r.className = 'catrow';
    const n = Object.assign(document.createElement('input'), { value: c.name, placeholder: '資料夾名稱' });
    const p = Object.assign(document.createElement('input'), { value: c.prompt, placeholder: 'English description for AI' });
    const d = Object.assign(document.createElement('button'), { textContent: '×', title: '刪除' });
    n.oninput = () => { const old = c.name; c.name = n.value.trim() || old; items.forEach(it => { if (it.cat === old) it.cat = c.name; }); saveCats(); render(); };
    p.oninput = () => { c.prompt = p.value; textCache = null; saveCats(); };
    d.onclick = () => { if (cats.length <= 1) return; items.forEach(it => { if (it.cat === c.name) it.cat = UNSORTED; }); cats.splice(i, 1); textCache = null; saveCats(); renderEditor(); render(); };
    r.append(n, p, d); box.append(r);
  });
}
$('addCat').onclick = () => { cats.push({ name: '新類別' + (cats.length + 1), prompt: 'a photo of ...' }); textCache = null; saveCats(); renderEditor(); render(); };
$('resetCat').onclick = () => { cats = structuredClone(DEFAULT_CATS); textCache = null; saveCats(); renderEditor(); render(); };
$('thresh').oninput = (e) => { threshold = +e.target.value; $('threshV').textContent = threshold.toFixed(2); };

/* ---------- file intake ---------- */
const isMedia = (f) => /^(image|video)\//.test(f.type) || /\.(jpe?g|png|webp|gif|bmp|heic|heif|mp4|mov|m4v|webm)$/i.test(f.name);
const kindOf = (f) => (f.type.startsWith('video/') || /\.(mp4|mov|m4v|webm)$/i.test(f.name)) ? 'video' : 'photo';

function addFiles(files) {
  let n = 0;
  for (const f of files) {
    if (!isMedia(f) || f.name.startsWith('.')) continue;
    const path = f.webkitRelativePath || f._path || f.name;
    if (items.some(it => it.path === path && it.file.size === f.size)) continue;
    items.push({ id: crypto.randomUUID(), file: f, path, kind: kindOf(f), thumb: null, cat: null, score: 0, done: false, error: null });
    n++;
  }
  setStatus(n ? `已加入 ${n} 個檔案，按「開始整理」` : '沒有找到照片或影片');
  render();
  makeThumbs();
}
$('pickDir').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };
$('pickFiles').onchange = (e) => { addFiles(e.target.files); e.target.value = ''; };

const drop = $('drop');
drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('over'));
drop.addEventListener('drop', async (e) => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return addFiles(e.dataTransfer.files);
  const out = [];
  for (const en of entries) await walk(en, out);
  addFiles(out);
});
async function walk(entry, out) {
  if (entry.isFile) {
    const f = await new Promise((res, rej) => entry.file(res, rej)).catch(() => null);
    if (f) { f._path = entry.fullPath.replace(/^\//, ''); out.push(f); }
  } else if (entry.isDirectory) {
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res) => reader.readEntries(res, () => res([])));
      if (!batch.length) break;
      for (const b of batch) await walk(b, out);
    }
  }
}

/* ---------- image decoding ---------- */
// returns a canvas with the image/video frame scaled so its long side <= max
async function toCanvas(it, max) {
  if (it.kind === 'photo') {
    const bmp = await createImageBitmap(it.file);
    const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height); bmp.close?.();
    it.w = bmp.width; it.h = bmp.height;
    return c;
  }
  const url = URL.createObjectURL(it.file);
  try {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.src = url;
    await waitFor(v, 'loadeddata', 15000);
    v.currentTime = Math.min(1, (v.duration || 2) / 2);
    await waitFor(v, 'seeked', 15000);
    const s = Math.min(1, max / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement('canvas'); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
    it.w = v.videoWidth; it.h = v.videoHeight;
    return c;
  } finally { URL.revokeObjectURL(url); }
}
function waitFor(el, ev, ms) {
  return new Promise((res, rej) => {
    const t = setTimeout(() => rej(new Error('timeout')), ms);
    el.addEventListener(ev, () => { clearTimeout(t); res(); }, { once: true });
    el.addEventListener('error', () => { clearTimeout(t); rej(new Error('無法解碼')); }, { once: true });
  });
}

let thumbing = false;
async function makeThumbs() {
  if (thumbing) return; thumbing = true;
  try {
    for (const it of items) {
      if (it.thumb || it.error) continue;
      try { const c = await toCanvas(it, 336); it.frame = c; it.thumb = c.toDataURL('image/jpeg', 0.7); }
      catch (err) { it.error = (it.file.name.match(/\.hei[cf]$/i) ? '此瀏覽器無法讀 HEIC（可用 Safari）' : (err.message || '無法讀取')); }
      renderSoon();
    }
  } finally { thumbing = false; }
}

/* ---------- AI model (CLIP, runs locally) ---------- */
async function loadModel() {
  if (model) return model;
  setStatus('下載 AI 模型中（第一次約 1 分鐘）…');
  const T = await import(TRANSFORMERS);
  const device = ('gpu' in navigator) ? 'webgpu' : 'wasm';
  const opts = { device, progress_callback: (p) => { if (p.status === 'progress' && p.total) setProgress(p.loaded / p.total, `下載模型 ${p.file} ${Math.round(p.loaded / p.total * 100)}%`); } };
  const load = async (o) => ({
    tokenizer: await T.AutoTokenizer.from_pretrained(MODEL_ID),
    processor: await T.AutoProcessor.from_pretrained(MODEL_ID),
    text: await T.CLIPTextModelWithProjection.from_pretrained(MODEL_ID, o),
    vision: await T.CLIPVisionModelWithProjection.from_pretrained(MODEL_ID, o),
    RawImage: T.RawImage,
  });
  try { model = await load(opts); }
  catch (e) { if (device !== 'webgpu') throw e; console.warn('WebGPU 失敗，改用 WASM', e); model = await load({ ...opts, device: 'wasm' }); }
  return model;
}
function rows(tensor) {
  const [n, d] = tensor.dims; const data = tensor.data; const out = [];
  for (let i = 0; i < n; i++) {
    const v = Float32Array.from(data.subarray ? data.subarray(i * d, (i + 1) * d) : data.slice(i * d, (i + 1) * d));
    let s = 0; for (const x of v) s += x * x; s = Math.sqrt(s) || 1;
    for (let j = 0; j < d; j++) v[j] /= s;
    out.push(v);
  }
  return out;
}
async function textEmbeds() {
  const key = JSON.stringify(cats.map(c => c.prompt));
  if (textCache && textCache.key === key) return textCache.embeds;
  const prompts = [], owner = [];
  cats.forEach((c, i) => c.prompt.split(/[;；\n]/).map(s => s.trim()).filter(Boolean).forEach(p => { prompts.push(p); owner.push(i); }));
  const inputs = model.tokenizer(prompts, { padding: true, truncation: true });
  const { text_embeds } = await model.text(inputs);
  const vecs = rows(text_embeds);
  const embeds = cats.map(() => []);
  vecs.forEach((v, k) => embeds[owner[k]].push(v));
  textCache = { key, embeds };
  return embeds;
}
async function classify(it, tEmb) {
  const img = await model.RawImage.read(it.thumb);
  const inputs = await model.processor(img);
  const { image_embeds } = await model.vision(inputs);
  const v = rows(image_embeds)[0];
  const sims = tEmb.map(list => list.length ? Math.max(...list.map(t => t.reduce((a, x, j) => a + x * v[j], 0))) : -1);
  const logits = sims.map(s => s * 100); const m = Math.max(...logits);
  const ex = logits.map(l => Math.exp(l - m)); const z = ex.reduce((a, b) => a + b, 0);
  const probs = ex.map(e => e / z);
  let best = 0; probs.forEach((p, i) => { if (p > probs[best]) best = i; });
  return { cat: cats[best].name, score: probs[best] };
}

$('run').onclick = async () => {
  const todo = items.filter(it => !it.done);
  if (!todo.length) return;
  $('run').disabled = true;
  try {
    await loadModel();
    const tEmb = await textEmbeds();
    const screenCat = cats.find(c => c.name.includes('截圖') || c.name.includes('螢幕'));
    let i = 0;
    for (const it of todo) {
      i++; setProgress(i / todo.length, `整理中 ${i} / ${todo.length}：${it.file.name}`);
      while (!it.thumb && !it.error) await new Promise(r => setTimeout(r, 100));
      if (it.error) { it.cat = UNSORTED; it.done = true; continue; }
      if (screenCat && SCREEN_RE.test(it.path)) { it.cat = screenCat.name; it.score = 1; it.done = true; renderSoon(); continue; }
      try { const r = await classify(it, tEmb); it.cat = r.score >= threshold ? r.cat : UNSORTED; it.guess = r.cat; it.score = r.score; }
      catch (e) { console.error(e); it.cat = UNSORTED; it.error = 'AI 判讀失敗'; }
      it.done = true; renderSoon();
    }
    const un = items.filter(it => it.cat === UNSORTED).length;
    setProgress(1, `已套用 ${items.length - un} 個，還有 ${un} 個未分類`);
  } catch (e) {
    console.error(e); setStatus('模型載入失敗：' + (e.message || e) + '（請確認網路可連到 huggingface.co 與 cdn.jsdelivr.net）');
  } finally { render(); }
};

/* ---------- export ---------- */
function safe(s) { return s.replace(/[\\/:*?"<>|]/g, '_'); }
$('zip').onclick = async () => {
  $('zip').disabled = true;
  try {
    if (!window.JSZip) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = JSZIP; s.onload = res; s.onerror = () => rej(new Error('JSZip 載入失敗')); document.head.append(s); });
    const zip = new window.JSZip(); const used = new Set();
    for (const it of items) {
      const dir = safe(it.cat || UNSORTED);
      let name = it.file.name, k = 1;
      while (used.has(dir + '/' + name)) name = it.file.name.replace(/(\.[^.]*)?$/, `_${k++}$1`);
      used.add(dir + '/' + name);
      zip.file(dir + '/' + name, it.file, { date: new Date(it.file.lastModified || Date.now()) });
    }
    const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' }, (m) => setProgress(m.percent / 100, `打包中 ${Math.round(m.percent)}%`));
    download(blob, `整理好的素材_${new Date().toISOString().slice(0, 10)}.zip`);
    setStatus('ZIP 已下載');
  } catch (e) { setStatus('打包失敗：' + e.message); }
  finally { render(); }
};
$('csv').onclick = () => {
  const q = (s) => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const lines = [['原始路徑', '類型', '分類', 'AI 猜測', '信心', '備註'].map(q).join(',')];
  for (const it of items) lines.push([it.path, it.kind === 'video' ? '影片' : '照片', it.cat || UNSORTED, it.guess || '', it.score ? it.score.toFixed(2) : '', it.error || (it.manual ? '手動調整' : '')].map(q).join(','));
  download(new Blob(['﻿' + lines.join('\n')], { type: 'text/csv' }), '分類清單.csv');
};
function download(blob, name) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
$('clear').onclick = () => { items.length = 0; setProgress(0, '尚未載入檔案'); render(); };

/* ---------- render ---------- */
function setStatus(t) { $('status').textContent = t; }
function setProgress(p, t) { $('prog').style.width = Math.round(p * 100) + '%'; if (t) setStatus(t); }
let pending = false;
function renderSoon() { if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; render(); }); } }

function render() {
  $('sTotal').textContent = items.length;
  $('sVideo').textContent = items.filter(i => i.kind === 'video').length;
  $('sPhoto').textContent = items.filter(i => i.kind === 'photo').length;
  $('sUnsorted').textContent = items.filter(i => i.done && i.cat === UNSORTED).length;
  const busy = $('status').textContent.startsWith('整理中') || $('status').textContent.startsWith('下載');
  $('run').disabled = busy || !items.some(i => !i.done);
  $('zip').disabled = $('csv').disabled = !items.some(i => i.done);
  $('clear').disabled = !items.length;

  const groups = [...cats.map(c => c.name), UNSORTED, '__pending'];
  const grid = $('grid'); grid.innerHTML = '';
  for (const g of groups) {
    const list = items.filter(it => g === '__pending' ? !it.done : it.done && it.cat === g);
    if (g === '__pending' && !list.length) continue;
    if (g === UNSORTED && !list.length) continue;
    const box = document.createElement('div');
    box.className = 'cat' + (g === UNSORTED ? ' unsorted' : '');
    box.innerHTML = `<h3>${g === '__pending' ? '待整理' : esc(g)}<span>${list.length}</span></h3><div class="thumbs"></div>`;
    const th = box.querySelector('.thumbs');
    for (const it of list.slice(0, 300)) {
      const t = document.createElement('div'); t.className = 'thumb'; t.draggable = it.done; t.title = it.path + (it.error ? `\n${it.error}` : '');
      t.innerHTML = (it.thumb ? `<img src="${it.thumb}" alt="">` : '') + (it.kind === 'video' ? '<span class="v">▶</span>' : '') + (it.done && !it.manual && it.score < threshold + 0.15 && !it.error ? '<span class="low"></span>' : '');
      t.onclick = (e) => openMenu(it, e);
      t.ondragstart = (e) => e.dataTransfer.setData('text/x-item', it.id);
      th.append(t);
    }
    if (list.length > 300) th.insertAdjacentHTML('beforeend', `<div class="hint">…還有 ${list.length - 300} 個</div>`);
    if (g !== '__pending') {
      box.ondragover = (e) => { if (e.dataTransfer.types.includes('text/x-item')) { e.preventDefault(); box.classList.add('dragover'); } };
      box.ondragleave = () => box.classList.remove('dragover');
      box.ondrop = (e) => { e.preventDefault(); const it = items.find(x => x.id === e.dataTransfer.getData('text/x-item')); if (it) { it.cat = g; it.manual = true; render(); } };
    }
    grid.append(box);
  }
}
const esc = (s) => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const menu = $('menu');
function openMenu(it, e) {
  e.stopPropagation();
  menu.innerHTML = '';
  if (it.thumb) menu.insertAdjacentHTML('beforeend', `<img class="pv" src="${it.thumb}" alt="">`);
  menu.insertAdjacentHTML('beforeend', `<div class="nm">${esc(it.path)}${it.done && it.guess ? `<br>AI：${esc(it.guess)}（${Math.round(it.score * 100)}%）` : ''}${it.error ? '<br>' + esc(it.error) : ''}</div>`);
  if (it.done) for (const name of [...cats.map(c => c.name), UNSORTED]) {
    const b = document.createElement('button'); b.textContent = name; if (name === it.cat) b.className = 'cur';
    b.onclick = () => { it.cat = name; it.manual = true; menu.style.display = 'none'; render(); };
    menu.append(b);
  }
  menu.style.display = 'block';
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(8, Math.min(e.clientX, innerWidth - r.width - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(e.clientY, innerHeight - r.height - 8)) + 'px';
}
document.addEventListener('click', (e) => { if (!menu.contains(e.target)) menu.style.display = 'none'; });

renderEditor(); render();
</script>
</body>
</html>
