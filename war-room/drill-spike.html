<title>V3 下鑽演練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="core/war-room.css">
<style>
/* V3 DRILL-DOWN UI SPIKE：戰役層看全局，點委派節點看部隊，再回到戰役。
   畫面由 V2 core mount；狀態來自 spike/v3/engine.js 的 HQ；spike/v3/view.js 只讀、只畫。 */
:root{--bg:#0f080a;--fg:#efdfe0;--muted:#8c6a6f;--line:#3a1c21;--accent:#ff4f45;--wait:#e8b04a;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{padding-inline:16px;padding-block:12px 16px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.bar,.dev{max-width:980px;margin:0 auto 10px;font-size:11px;letter-spacing:.06em}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:30px}
.crumb{color:var(--muted)}.crumb b{color:var(--fg);font-weight:600}.crumb i{font-style:normal;color:var(--accent)}
.bar button,.dev button{font:inherit;font-size:11px;color:var(--fg);background:#1a0d10;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.bar button:hover,.dev button:hover{border-color:var(--accent)}
.bar button:focus-visible,.dev button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dev{border:1px dashed var(--line);padding:10px;color:var(--muted)}
.dev .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.dev output{display:block;margin-top:8px;color:var(--fg);overflow-wrap:anywhere}
/* 委派摘要與交貨點標記（畫在 V2 core 的 SVG 上） */
.wr svg .v3-note{font:600 9.5px var(--wr-mono),var(--wr-cjk);fill:var(--wr-fg)}
.wr svg .v3-note.muted{fill:var(--wr-muted)}
.wr svg .v3-note.ACTIVE{fill:var(--wr-accent)}
.wr svg .v3-note.WAITING{fill:var(--wr-waiting)}
.wr svg .v3-note.FAILED{fill:var(--wr-failed)}
.wr svg .v3-note.done{fill:var(--wr-warm)}
.wr svg .v3-note.deliver{fill:var(--wr-waiting)}
.wr svg g.wr-n.v3-del{cursor:pointer}
.wr svg g.wr-n.v3-del:focus{outline:none}
.wr svg g.wr-n.v3-del:focus .box,.wr svg g.wr-n.v3-del:hover .box{stroke-width:2.2}
</style>

<nav class="bar" aria-label="位置">
  <span class="crumb" id="crumb"></span>
  <button type="button" id="back" hidden>← 返回戰役</button>
</nav>
<details class="dev" open>
  <summary>DRILL SCRIPT · DEV（依序送出 C001 → M003 事件）</summary>
  <div class="row">
    <button type="button" id="next">下一步 ▶</button>
    <button type="button" data-jump="A">A 剛出兵</button>
    <button type="button" data-jump="B">B 海豹受阻</button>
    <button type="button" data-jump="C">C 恢復作戰</button>
    <button type="button" data-jump="D">D 交貨</button>
    <button type="button" data-jump="END">跑完全程</button>
  </div>
  <output id="say" aria-live="polite">尚未送出事件。</output>
</details>
<div id="campRoot"></div>
<div id="misRoot"></div>

<script src="core/war-room.js"></script>
<script src="configs/campaign-enroll.js"></script>
<script src="configs/seal-team.js"></script>
<script src="spike/v3/engine.js"></script>
<script src="spike/v3/view.js"></script>
<script>
(function () {
  const campCfg = WarRoom.get("campaign-enroll"), sealCfg = WarRoom.get("seal-team");
  const campRoot = document.getElementById("campRoot"), misRoot = document.getElementById("misRoot");
  // 兩層畫面各 mount 一次（只用來排版）；下鑽／返回只切換顯示，不重新 mount
  WarRoom.mount(campRoot, campCfg);
  WarRoom.mount(misRoot, sealCfg);
  misRoot.hidden = true;

  const P = ids => ids.flatMap(n => [[null, "STARTED", n], [null, "DONE", n]]);
  const M = (type, node, note) => ["M003", type, node, note];
  const SCRIPT = [
    [null, "TASK_CREATED", null, "司令部開戰"], ...P(["goal", "aud", "strat", "plan", "route", "mat"]),
    ["HQ", "MISSION_OPENED", "prod", "司令部下令：製片委派海豹小隊，建立 M003", "A"],
    M("STARTED", "src"), M("DONE", "src"), M("STARTED", "worth"), M("DONE", "worth"), M("STARTED", "plan"), M("DONE", "plan"),
    M("STARTED", "h2"), M("WAITING", "h2", "作戰令等隊長核可"), M("APPROVED", "h2", "隊長核可作戰令"),
    M("STARTED", "tool"), M("DONE", "tool"), M("STARTED", "make"),
    [...M("WAITING", "make", "素材不足，等補件"), "B"],
    [...M("RESUMED", "make", "補件完成，恢復作戰"), "C"],
    M("DONE", "make"), M("STARTED", "rend"), M("DONE", "rend"), M("STARTED", "h4"), M("WAITING", "h4", "成片送隊長 H4 核可"),
    [...M("APPROVED", "h4", "H4 核可＝交貨"), "D"],
    [null, "STARTED", "rev"], [null, "WAITING", "rev", "司令部審核：成片＋報名資訊"], [null, "APPROVED", "rev", "司令部核可"],
    M("STARTED", "post"), M("DONE", "post"), ...P(["pub", "lead", "result", "lib"]), [null, "END"],
  ];
  const T = (cfg, id) => (cfg.nodes.find(n => n.id === id) || {}).title || id;
  let hq, step, times, view = "campaign";
  const clock = () => { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":"); };

  function reset() { hq = WarRoomV3.createHQ({campaign: campCfg, units: {"seal-team": sealCfg}}); step = 0; times = {}; }
  function logs(layer) { // 戰役層：C001／HQ 事件＋委派節點被 Mission 推算的變化；部隊層：該 Mission 的事件
    return hq.timeline.slice().reverse().flatMap(x => {
      const time = times[x.seq] || "--:--:--";
      if (layer === "campaign") {
        if (!x.ev.mission) return [{time, ok: x.ok, text: x.ok ? (x.ev.type === "MISSION_OPENED" ? `出兵 ${x.ev.mission} · ${T(campCfg, x.ev.node)}` : `${x.ev.type} · ${x.ev.node ? T(campCfg, x.ev.node) : "開戰"}`) : `✕ ${x.ev.type} · ${x.reason}`}];
        const c = x.campaignChanges.find(c => campCfg.nodes.find(n => n.id === c[0] && n.execution === "delegated"));
        return c ? [{time, ok: true, text: `${x.ev.mission} → ${T(campCfg, c[0])} ${c[2]}`}] : [];
      }
      return x.ev.mission === layer ? [{time, ok: x.ok, text: x.ok ? `${x.ev.type} · ${T(sealCfg, x.ev.node)}${x.ev.note ? " · " + x.ev.note : ""}` : `✕ ${x.ev.type} · ${x.reason}`}] : [];
    });
  }
  function paint() {
    WarRoomV3View.paintCampaign(campRoot, hq, logs("campaign"));
    campRoot.querySelectorAll("svg g.wr-n").forEach((g, i) => { if (campCfg.nodes[i].execution === "delegated") g.classList.add("v3-del"); });   // 狀態 class 改寫後補回可點標記
    if (hq.missions.M003) WarRoomV3View.paintMission(misRoot, hq, "M003", logs("M003"));
    bindDelegated();
    const crumb = document.getElementById("crumb");
    if (view === "campaign") crumb.innerHTML = `<b>C001 招生戰役</b>　<i>點「製片」查看承接部隊</i>`;
    else crumb.innerHTML = `C001 招生戰役 › 製片 › <b>海豹小隊 M003</b>`;
  }
  function bindDelegated() {
    const gs = campRoot.querySelectorAll("svg g.wr-n");
    campCfg.nodes.forEach((n, i) => {
      if (n.execution !== "delegated" || gs[i].__v3) return;
      const g = gs[i]; g.__v3 = true;
      g.classList.add("v3-del"); g.setAttribute("tabindex", "0"); g.setAttribute("role", "button");
      g.setAttribute("aria-label", `${n.title}：查看承接部隊`);
      const open = () => {
        const m = Object.values(hq.missions).find(x => x.node === n.id);
        if (!m) { say(`${n.title} 尚未出兵，沒有可下鑽的部隊。`); return; }
        show("mission");
      };
      g.addEventListener("click", open);
      g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }
  function show(v) {
    view = v;
    campRoot.hidden = v !== "campaign"; misRoot.hidden = v !== "mission";
    document.getElementById("back").hidden = v !== "mission";
    dispatchEvent(new Event("resize"));   // 讓 V2 core 依目前可見寬度重算縮放
    paint();
  }
  function say(t) { document.getElementById("say").textContent = t; }
  function next() {
    const s = SCRIPT[step];
    if (!s || s[1] === "END") { say("全程已跑完。"); return null; }
    const [mission, type, node, note] = s;
    const ev = mission === "HQ" ? {type, node, mission: "M003", note} : mission ? {mission, type, node, note} : {type, node, note};
    const r = hq.emit(ev); times[r.seq] = clock(); step++;
    const where = mission === "HQ" ? "HQ" : mission || "C001";
    say(`${step}/${SCRIPT.length - 1}　[${where}] ${type}${node ? " " + T(mission && mission !== "HQ" ? sealCfg : campCfg, node) : ""}${note ? "　" + note : ""}　${r.ok ? "✓" : "✕ " + r.reason}`);
    paint();
    return s;
  }
  function jump(mark) { // 從頭重跑到指定時刻（狀態來自引擎，不是畫面）
    reset();
    let s;
    do { s = next(); } while (s && (mark === "END" ? s[1] !== "END" : s[4] !== mark));
  }
  document.getElementById("next").addEventListener("click", next);
  document.querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => jump(b.dataset.jump)));
  document.getElementById("back").addEventListener("click", () => show("campaign"));
  reset(); paint();
  window.__drill = {get hq() { return hq; }, jump, show, next, get view() { return view; }};   // 給驗收腳本讀取
})();
</script>
