<title>AI 部隊作戰室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="core/war-room.css">
<style>
/* 裝填架：只負責列出 Config、切換、記住選擇（#網址）。不放任何部隊內容。 */
:root{--bg:#0f080a;--fg:#efdfe0;--muted:#8c6a6f;--line:#3a1c21;--accent:#ff4f45;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{padding-inline:16px;padding-block:12px 16px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.load{max-width:980px;margin:0 auto 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.load label{color:var(--fg)}
.load button{font:inherit;font-size:11px;letter-spacing:.06em;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.load button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.load button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="load" role="group" aria-labelledby="loadlab"><label id="loadlab">裝填 CONFIG</label><span id="btns"></span></div>
<div id="room"></div>

<script src="core/war-room.js"></script>
<!-- 新部隊：在 configs/ 放一份 Config，並在下面加一行 script -->
<script src="configs/empty.js"></script>
<script src="configs/seal-team.js"></script>
<script>
(function () {
  const room = document.getElementById("room"), btns = document.getElementById("btns");
  const list = WarRoom.configs;
  function load(id) {
    const cfg = WarRoom.get(id) || list[0];
    WarRoom.mount(room, cfg);
    btns.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === cfg.id)));
    if (location.hash.slice(1) !== cfg.id) history.replaceState(null, "", "#" + cfg.id);
  }
  list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = c.id; b.textContent = c.name || c.id;
    b.addEventListener("click", () => load(c.id));
    btns.appendChild(b);
  });
  addEventListener("hashchange", () => load(location.hash.slice(1)));
  load(location.hash.slice(1));  // 沒指定就裝第一份 Config
})();
</script>
