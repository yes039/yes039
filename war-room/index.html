<title>AI 部隊作戰室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+TC:wght@500;700&display=swap">
<link rel="stylesheet" href="core/war-room.css">
<style>
/* 裝填架：只負責列出 Config、切換、記住選擇（#網址）。不放任何部隊內容。 */
:root{--bg:#0f080a;--fg:#efdfe0;--muted:#8c6a6f;--line:#3a1c21;--accent:#ff4f45;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{padding-inline:16px;padding-block:12px 16px;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.load{max-width:980px;margin:0 auto 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.load label{color:var(--fg)}
.load button{font:inherit;font-size:11px;letter-spacing:.06em;color:var(--fg);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.load button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.load button:focus-visible,.tc button:focus-visible,.tc select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* TEST CONSOLE：開發模式工具，只呼叫 WarRoom.emit()，不碰主畫面程式 */
.tc{max-width:980px;margin:0 auto 10px;border:1px dashed var(--line);padding:10px;font-size:11px;color:var(--muted)}
.tc summary{cursor:pointer;color:var(--fg);letter-spacing:.08em}
.tc .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.tc button{font:inherit;font-size:10.5px;color:var(--fg);background:#1a0d10;border:1px solid var(--line);padding:6px 8px;cursor:pointer}
.tc button:hover{border-color:var(--accent)}
.tc button.fail{color:#ff6b6b}
.tc select{font:inherit;font-size:11px;color:var(--fg);background:#1a0d10;border:1px solid var(--line);padding:5px}
.tc output{display:block;margin-top:10px;color:var(--fg);min-height:1.4em;overflow-wrap:anywhere}
.tc output.no{color:#ff6b6b}
</style>

<div class="load" role="group" aria-labelledby="loadlab"><label id="loadlab">裝填 CONFIG</label><span id="btns"></span></div>
<details class="tc" open>
  <summary>TEST CONSOLE · DEV（人工送事件）</summary>
  <div class="row" id="evbtns"></div>
  <div class="row"><label for="evnode">目標節點</label><select id="evnode"></select></div>
  <output id="evout" aria-live="polite">尚未送出事件。流程靜止中。</output>
</details>
<div id="room"></div>

<script src="core/war-room.js"></script>
<!-- 新部隊：在 configs/ 放一份 Config，並在下面加一行 script -->
<script src="configs/empty.js"></script>
<script src="configs/seal-team.js"></script>
<script src="configs/campaign-enroll.js"></script>
<script>
(function () {
  const room = document.getElementById("room"), btns = document.getElementById("btns");
  const list = WarRoom.configs;
  function load(id) {
    const cfg = WarRoom.get(id) || list[0];
    WarRoom.mount(room, cfg);
    if (typeof fillNodes === "function") fillNodes(cfg);
    btns.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === cfg.id)));
    if (location.hash.slice(1) !== cfg.id) history.replaceState(null, "", "#" + cfg.id);
  }
  list.forEach(c => {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.id = c.id; b.textContent = c.name || c.id;
    b.addEventListener("click", () => load(c.id));
    btns.appendChild(b);
  });
  addEventListener("hashchange", () => load(location.hash.slice(1)));

  // TEST CONSOLE
  const evbtns = document.getElementById("evbtns"), evnode = document.getElementById("evnode"), evout = document.getElementById("evout");
  WarRoom.EVENT_TYPES.forEach(type => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = type; b.dataset.ev = type;
    if (type === "FAILED") b.className = "fail";
    b.addEventListener("click", () => {
      const ev = {type};
      if (evnode.value) ev.node = evnode.value;
      const r = WarRoom.emit(ev);
      evout.className = r.ok ? "" : "no";
      evout.textContent = r.ok
        ? `✓ ${type} → ${r.node}　階段：${r.phase}${r.edges.length ? "　光流：" + r.edges.map(e => e.join("→")).join("、") : ""}`
        : `✕ ${type} 被拒絕：${r.reason}`;
    });
    evbtns.appendChild(b);
  });
  function fillNodes(cfg) {
    evnode.innerHTML = `<option value="">自動（依 Config eventMap）</option>` +
      (cfg.nodes || []).map(n => `<option value="${n.id}">${n.stage} · ${n.title}</option>`).join("");
    evout.className = ""; evout.textContent = "已裝填 " + (cfg.name || cfg.id) + "。尚未送出事件，流程靜止中。";
  }
  load(location.hash.slice(1));  // 沒指定就裝第一份 Config
})();
</script>
