<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:"PingFang TC","Heiti TC",sans-serif}
#tag{position:absolute;left:30px;top:60px;padding:8px 22px;border-radius:26px;background:rgba(0,0,0,.45);color:#fff;font-size:32px}
#bar{position:absolute;left:0;top:0;height:10px;background:linear-gradient(90deg,#ffd400,#ff8a00)}
#cap{position:absolute;left:0;right:0;top:1440px;text-align:center}
#bigwrap{position:relative;display:inline-block;padding:6px 34px}
#hl{position:absolute;left:0;top:18%;height:70%;background:#ffd400;border-radius:14px;transform:skewX(-8deg);transform-origin:left}
#big{position:relative;font-size:112px;font-weight:900;color:#fff;letter-spacing:4px;
 -webkit-text-stroke:5px #102a5c;paint-order:stroke fill;text-shadow:0 8px 24px rgba(0,0,0,.45)}
#small{display:inline-block;margin-top:26px;padding:12px 34px;border-radius:40px;background:rgba(16,42,92,.85);color:#fff;font-size:54px;font-weight:700}
#end{font-size:46px;color:#fff;font-weight:700;margin-bottom:14px;text-shadow:0 3px 10px rgba(0,0,0,.6)}
#cta{display:none;margin-top:30px}
#cta span{display:inline-block;padding:18px 60px;border-radius:60px;background:linear-gradient(180deg,#ff5a36,#e0262b);color:#fff;font-size:64px;font-weight:900;box-shadow:0 10px 30px rgba(224,38,43,.5)}
</style></head><body>
<div id="bar"></div><div id="tag">AI 生成</div>
<div id="cap"><div id="end"></div><div id="bigwrap"><div id="hl"></div><div id="big"></div></div><br><div id="small"></div><div id="cta"><span>趕快去買！</span></div></div>
<script>
let TL=null;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOutBack=x=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const easeOut=x=>1-Math.pow(1-x,3);
function render(t){
  const S=TL.shots, $=id=>document.getElementById(id);
  if(TL.tag) $('tag').textContent=TL.tag; if(TL.cta) $('cta').firstElementChild.textContent=TL.cta;
  $('bar').style.width=(1080*clamp(t/TL.total))+'px';
  let i=S.length-1; for(let k=0;k<S.length;k++){ if(t < S[k].t1-0.175){i=k;break} }
  const s=S[i], lt=t-s.t0, rem=(s.t1-0.175)-t, last=i===S.length-1;
  const vis=last?1:clamp(rem/0.25);
  // 大字：彈出
  const p=clamp((lt-0.1)/0.45); const sc=p<=0?0.6:0.6+0.4*easeOutBack(p);
  let big=s.big;
  if(big.includes('25')){ const n=Math.round(25*easeOut(clamp((lt-0.1)/0.9))); big=big.replace('25',n); }
  $('big').textContent=big;
  let shake=0; if(last){ shake=Math.sin(lt*22)*3*clamp(1-(lt-0.5)/1.2) }
  $('bigwrap').style.transform=`scale(${sc}) rotate(${shake}deg)`; $('bigwrap').style.opacity=clamp(p*2)*vis;
  // 黃色螢光筆刷過
  const h=easeOut(clamp((lt-0.35)/0.35)); $('hl').style.width=($('bigwrap').offsetWidth*h)+'px';
  // 小字：滑上來
  const q=easeOut(clamp((lt-0.45)/0.4));
  $('small').textContent=last?'':s.small; $('small').style.display=(last||!s.small)?'none':'inline-block';
  $('small').style.transform=`translateY(${(1-q)*60}px)`; $('small').style.opacity=q*vis;
  // 收尾：品牌名＋脈動按鈕
  $('end').textContent=s.end||''; $('end').style.opacity=clamp((lt-0.2)/0.4);
  $('cta').style.display=last?'block':'none';
  if(last){ const c=easeOutBack(clamp((lt-0.6)/0.45)); const pulse=1+0.06*Math.sin(Math.max(0,lt-1.1)*7);
    $('cta').style.transform=`scale(${c*pulse})`; $('cta').style.opacity=clamp((lt-0.6)/0.2); }
}
</script></body></html>
