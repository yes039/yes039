}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:960px;margin:0 auto}

main .wrap{padding-block:16px 96px;display:flex;flex-direction:column;gap:20px}

.item .main{min-width:0}

.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--bad-soft);color:var(--bad);font-size:13.5px}

button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--coffee);background:var(--surface);color:var(--coffee);padding:5px 10px;font-size:13px}
button.primary{background:var(--coffee);color:var(--surface)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
select{font:inherit;font-size:13px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center}
.day{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;min-height:62px;display:flex;flex-direction:column;gap:3px;cursor:pointer;text-align:left;color:var(--fg)}
.day.off{visibility:hidden}
.day.today{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.day.sel{background:var(--gold-soft)}
.day .d{font-size:12px;font-weight:700}
.dots{display:flex;gap:2px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%}
.dot.ME{background:var(--me)}.dot.PG{background:var(--pg)}.dot.GR{background:var(--gr)}.dot.EX{background:var(--ex)}
.ev{font-size:10px;line-height:1.2;color:var(--bad);font-weight:700}
/* kanban */
.kan{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.col{flex:0 0 min(78vw,260px);scroll-snap-align:start;background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.col h3{display:flex;justify-content:space-between;font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.card .code{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .hold{font-size:12px;color:var(--warn)}
/* tables */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:500}
td.r,th.r{text-align:right}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border-color:var(--line);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--coffee);color:var(--surface);border-color:var(--coffee)}
.note{font-size:12.5px;color:var(--muted)}
ol.reco{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px;font-size:14px}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
nav .tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:600px;margin:0 auto}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:12px;position:relative}
nav a svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
nav a[aria-current="page"]{color:var(--coffee);font-weight:700}
nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:var(--gold)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;line-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--coffee);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:9;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.item{transition:background .2s}}
</style>

function d(day,time){const [h,m]=time.split(":").map(Number);return new Date(2026,10,day,h,m)}

posts.forEach(p=>{

posts.find(p=>p.code==="FB11-ME-W3-01").status="待審核";

const STAGES=["名單","報名","出席","成交"];

// ---------- 計算 ----------
function curWeek(){for(const [w,[a,b]] of Object.entries(WEEK_RANGE)) if(TODAY.getDate()>=a&&TODAY.getDate()<=b) return w; return "W4"}
function actuals(){
  const reach = posts.reduce((s,p)=>s+(p.metric?p.metric.reach:0),0);
  const live = leads.filter(l=>l.stage!=="流失");
  const reached = s=>leads.filter(l=>STAGES.indexOf(l.stage)>=STAGES.indexOf(s)).length;
  return {reach,leads:leads.length,signups:reached("報名"),attended:reached("出席"),deals:reached("成交"),live:live.length};
}
const fmt = n=>n.toLocaleString("zh-TW");
const md = dt=>`${dt.getMonth()+1}/${dt.getDate()}`;
const hm = dt=>`${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
const DOW="日一二三四五六";
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pchip = p=>`<span class="chip p-${p}">${PILLAR[p]}</span>`;
function schip(s){
  const cls = {"待審核":"s-warn","已核准":"s-gold","已排程":"s-gold","已發布":"s-ok","已回收":"s-ok","已優化":"s-ok"}[s]||"";
  return `<span class="chip ${cls}">${s}</span>`;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2400)}

// 狀態推進規則（含關卡）
function nextAction(p){
  const i = STATES.indexOf(p.status);
  if(i===STATES.length-1) return null;
  const next = STATES[i+1];
  const pending = approvals.find(a=>a.target===p.code);
  if(p.status==="待選題") return {label:"送 G1 選題核准",gate:"G1",next};
  if(p.status==="待審核") return pending?{label:"等待總指揮 G2",wait:true}:{label:"送 G2 內容核准",gate:"G2",next};
  if(p.status==="已核准"){
    if(p.needsConfirm) return {label:"課程資訊待確認",wait:true,hold:"含【待確認】課程資料，確認前不可排程"};
    return pending?{label:"等待總指揮 G3",wait:true}:{label:"送 G3 發布授權",gate:"G3",next};
  }
  if(p.status==="已排程") return {label:"標記已發布",next};
  if(p.status==="已發布"){
    const due = TODAY - p.at >= H72;
    return due?{label:"填 72h 數據",next}:{label:`72h 回收：${md(new Date(p.at.getTime()+H72))}`,wait:true};
  }
  return {label:"推進到「"+next+"」",next};
}
function advance(code){
  const p = posts.find(x=>x.code===code); const a = nextAction(p);
  if(!a||a.wait) return;
  if(a.gate){
    approvals.push({id:"A-"+pad(approvals.length+7),gate:a.gate,label:{G1:"選題核准",G2:"內容核准",G3:"發布授權"}[a.gate],target:p.code,text:`${p.week}-${p.slot} ${p.topic}`});
    toast(`已送出 ${a.gate}，等總指揮在「總覽」核准`);
  } else { p.status=a.next; toast(`${p.code} → ${a.next}`); }
  render();
}
function decide(id,ok){
  const i = approvals.findIndex(a=>a.id===id); const a = approvals[i]; approvals.splice(i,1);
  const p = posts.find(x=>x.code===a.target);
  if(p){
    if(ok){
      if(a.gate==="G1"&&p.status==="待選題") p.status="待製作";
      else if(a.gate==="G2"&&p.status==="待審核") p.status="已核准";
      else if(a.gate==="G3"&&p.status==="已核准"&&!p.needsConfirm) p.status="已排程";
    } else if(a.gate==="G2") p.status="待製作";
  }
  let msg = ok?`已核准 ${a.id}（模擬）`:`已退回 ${a.id}（模擬）`;
  if(ok&&a.gate==="G3"&&p&&p.needsConfirm) msg="已記錄核准，但課程資訊仍待確認，暫不排程";
  if(ok&&a.gate==="G4") msg="已記錄私訊授權（模擬，本系統不會實際發送）";
  toast(msg); render();
}

  document.querySelectorAll("nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.tab===t?"page":"false"));
  const b = document.getElementById("apprBadge"); b.textContent=approvals.length; b.hidden=!approvals.length;
  document.getElementById("todayLbl").textContent = `模擬今天 ${md(TODAY)}（${DOW[TODAY.getDay()]}）・${curWeek()}`;
}
document.getElementById("view").addEventListener("click",e=>{
  const el = e.target.closest("button"); if(!el) return;
  if(el.dataset.ok) decide(el.dataset.ok,true);
  else if(el.dataset.no) decide(el.dataset.no,false);
  else if(el.dataset.adv) advance(el.dataset.adv);
  else if(el.dataset.day){selDay=+el.dataset.day;render()}
  else if(el.dataset.lf){leadFilter=el.dataset.lf;render()}
  else if(el.dataset.pw){perfWeek=el.dataset.pw;render()}
});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0)});
render();
})();
</script>
