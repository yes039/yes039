<style>
/* Layout: home with two big entries; industry page = sticky section bar, company panel, nine-grid, scenarios, assistant, simulator, next steps; details open in a drawer / bottom sheet */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f5f7f9; --ink:#1c2632; --muted:#5a6776; --line:#d6dde5;
  --vest:#f4b400; --vest-soft:#fff3cc; --vest-ink:#1c2632;
  --blue:#1d5ea6; --blue-soft:#e3eefb; --violet:#5b4bb7; --violet-soft:#ece9fb;
  --red:#c0352b; --red-soft:#fbe4e2; --amber:#a86200; --amber-soft:#fcefd6; --green:#2b7a4b; --green-soft:#e1f2e8; --grey:#8b96a3; --grey-soft:#eceff2;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e5eaf0; --muted:#98a5b3; --line:#2a3440;
  --vest:#f4b400; --vest-soft:#3a3010; --vest-ink:#1c2632; --blue:#82b3ec; --blue-soft:#1d2d42; --violet:#a99cf0; --violet-soft:#27223f;
  --red:#f07b72; --red-soft:#3a1c1a; --amber:#e6a94f; --amber-soft:#352812; --green:#6cc290; --green-soft:#183025; --grey:#7d8a98; --grey-soft:#222b35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e5eaf0; --muted:#98a5b3; --line:#2a3440;
  --vest:#f4b400; --vest-soft:#3a3010; --vest-ink:#1c2632; --blue:#82b3ec; --blue-soft:#1d2d42; --violet:#a99cf0; --violet-soft:#27223f;
  --red:#f07b72; --red-soft:#3a1c1a; --amber:#e6a94f; --amber-soft:#352812; --green:#6cc290; --green-soft:#183025; --grey:#7d8a98; --grey-soft:#222b35; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px}
h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;white-space:nowrap}
h1 .tape{background:var(--vest);color:var(--vest-ink);padding:0 .25em;border-radius:4px}
.demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:2px 10px}
.hdr-r{margin-left:auto;display:flex;gap:6px;align-items:center}
main .wrap{padding-block:16px 72px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-wrap:balance}
h3{font-size:13px;letter-spacing:.05em;color:var(--muted);margin:0;font-weight:700}
.lede{color:var(--muted);font-size:14px;margin:0;max-width:66ch}
.small{font-size:13px} .muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--vest);color:var(--vest-ink);white-space:nowrap;min-height:40px}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.sm{padding:5px 12px;font-size:13px;min-height:34px}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=text],textarea,select{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;width:100%;min-width:0}
input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--blue)}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)} .pill.green{background:var(--green-soft);color:var(--green)} .pill.grey{background:var(--grey-soft);color:var(--grey)} .pill.blue{background:var(--blue-soft);color:var(--blue)}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h2{font-size:28px}
.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

.entry{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--vest)}
.entry:hover{border-color:var(--ink)}

.secbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.secbar button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;min-height:34px}
.secbar button.back{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* company panel */
.cfg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}

.nine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.tile.ai{border-top-color:var(--violet)}
.t-h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.t-big{font-family:var(--display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}

.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)}

 .nine{aspect-ratio:9/16;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}

 .t-big{font-size:22px} .t-big small{display:block;font-size:10px;margin:1px 0 0}
 .t-lines{font-size:10.5px}

}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}

/* scenarios */
.scens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.scens{grid-template-columns:1fr}}
.scen{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--ink);border-left:5px solid var(--red)}

.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--grey-soft);color:var(--muted)}
.step.on{background:var(--ink);color:var(--surface)} .step.ok{background:var(--green-soft);color:var(--green)}
.flowbox{display:flex;flex-direction:column;gap:10px}
.opt{border:1.5px solid var(--line);background:var(--sunk);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:2px}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}

.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.msg{background:var(--sunk);border-radius:10px;padding:8px 12px;font-size:14px}
.msg .who{font-size:12px;color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cmp div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.cmp span{display:block;font-size:12px;color:var(--muted)}
.cmp b{font-size:20px;font-variant-numeric:tabular-nums}

/* assistant */
.issue{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .no{font-family:var(--display);font-size:22px;line-height:1}
.issue .t{font-weight:700}
.issue .m{font-size:13px;color:var(--muted)}
.tasks{display:flex;flex-direction:column;gap:6px}
.task{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:14px}

/* simulator */
.simgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.simgrid{grid-template-columns:1fr}}
.res{display:flex;flex-direction:column;gap:8px}
.resrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:6px}
.resrow b{font-variant-numeric:tabular-nums;font-size:18px}
.asm{font-size:12px;color:var(--muted)}
.asm-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:520px){.asm-edit{grid-template-columns:1fr}}
.asm-edit label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}

/* conversion */
.convs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.convs{grid-template-columns:1fr}}
.conv{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink)}
.conv b{font-size:15px}
.conv span{font-size:13px;color:var(--muted)}

/* consent + dev */
.consent{background:var(--blue-soft);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.ev{display:grid;grid-template-columns:64px 1fr auto;gap:8px;font-size:12px;background:var(--sunk);border-radius:8px;padding:6px 8px;align-items:center}
.ev code{font-family:ui-monospace,Menlo,Consolas,monospace}
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:90%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:env(safe-area-inset-left,0px)}}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-b{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--sunk);color:var(--ink);width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1;flex:0 0 auto}
.tb{overflow-x:auto} table{border-collapse:collapse;width:100%;font-size:13px;min-width:420px}
th{text-align:left;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap} td.r,th.r{text-align:right}
.bar{height:6px;background:var(--grey-soft);border-radius:3px;position:relative;min-width:60px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--blue)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:640px){ h1{font-size:18px} .hdr-r .btn{padding:4px 10px} }
</style>

<header class="top"><div class="wrap">
  <h1>工程 AI <span class="tape">管理團隊體驗</span></h1>

<script>
/* =================== 共用：格式、狀態、事件與歸因 =================== */
const F={n:x=>Math.round(x).toLocaleString("zh-TW"),d1:x=>(Math.round(x*10)/10).toLocaleString("zh-TW"),pct:x=>Math.round(x*100)+"%",
 wan:x=>(Math.abs(x)>=10000?(Math.round(x/1000)/10).toLocaleString("zh-TW")+" 億":(Math.round(x*10)/10).toLocaleString("zh-TW")+" 萬"),nt:x=>"NT$"+Math.round(x).toLocaleString("zh-TW")};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const $=s=>document.querySelector(s);
const SRC={direct:{label:"直接進入（無推薦）"},P001:{label:"推薦夥伴 P001 阿明（水電材料行）",ind:"water"},P002:{label:"推薦夥伴 P002 小華（水電師傅）",ind:"water"},P101:{label:"推薦夥伴 P101 吳經理（建材商）",ind:"build"}};
let ST;
function freshState(){return {view:"home",consent:null,source:"direct",session:"s-"+Math.random().toString(36).slice(2,8),events:[],dev:false,
  inp:{water:{...MODS.water.defaults},build:{...MODS.build.defaults}},asm:{water:{...MODS.water.asm},build:{...MODS.build.asm}},
  resolved:{water:{},build:{}},sim:{water:{...MODS.water.simDefaults},build:{...MODS.build.simDefaults}},asst:{water:{tasks:[],day:0,base:null},build:{tasks:[],day:0,base:null}},
  scen:null,drawer:null,leads:[]}}
/* 事件：開啟與客戶主動送出的轉換永遠記錄；其餘互動需同意 */
function track(type,data){
  const always=["page_open","consent","summary_request","line_join_click","booking_submit"];
  const ok=always.includes(type)||ST.consent==="同意記錄操作";
  ST.events.unshift({t:new Date().toTimeString().slice(0,8),type,data:data||"",ok,src:ST.source});
  if(ST.dev) renderDev();
}
function toast(t){$("#toastBox").innerHTML=`<div class="toast" role="status">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>$("#toastBox").innerHTML="",2600)}
const seedRand=i=>{const x=Math.sin(i*9301+49297)*233280;return x-Math.floor(x)};

/* =================== 產業模組：水電 =================== */
const WATER={
 key:"water",name:"水電公司",title:i=>`${i.company?esc(i.company)+" 的":"我的"}${i.sites}工地指揮台`,
 defaults:{company:"",sites:8,leads:4,workers:24,reportRate:75,abnormal:2,shortage:3,overdue:1},
 inputs:[
  {k:"sites",label:"同時施工工地數",min:1,max:20,step:1,unit:"個"},
  {k:"leads",label:"工地主任／領班人數",min:1,max:20,step:1,unit:"人"},
  {k:"workers",label:"現場施工人員數",min:1,max:200,step:1,unit:"人"},
  {k:"reportRate",label:"每日工地回報完成率",min:0,max:100,step:5,unit:"%"},
  {k:"abnormal",label:"異常工地數",min:0,max:20,step:1,unit:"個",cap:"sites"},
  {k:"shortage",label:"缺料待辦數",min:0,max:40,step:1,unit:"項"},
  {k:"overdue",label:"逾期工程數",min:0,max:20,step:1,unit:"個",cap:"sites"}],
 asm:{wage:2800,callMin:10,stopDay:0.5,shortTurn:4,idleRate:0.06,rushFee:800},
 asmLabels:{wage:["師傅日薪（NT$）",1],callMin:["每個未回報工地，老闆追問耗時（分鐘）",1],stopDay:["缺料時該工地停工（天）",0.1],shortTurn:["每月缺料發生倍數（目前待辦 × ?）",1],idleRate:["派工不順造成的閒置比例",0.01],rushFee:["急件叫料運費（NT$／次）",1]},
 model(i,res,a){
  const S=i.sites, A=Math.min(i.abnormal,S), O=Math.min(i.overdue,S), L=Math.max(1,i.leads), W=Math.max(1,i.workers);
  let reported=Math.round(S*i.reportRate/100), M=i.shortage;
  if(res.S01) reported=Math.min(S,reported+1);
  let unrep=S-reported, unrep2=unrep>0?Math.max(1,Math.floor(unrep/2)):0;
  const crew=W/S, perLead=S/L;
  let shortSites=Math.min(S,Math.ceil(M/2)), tmrSites=M>0?Math.min(shortSites,Math.ceil(M/3)):0;
  if(res.S02){ M=Math.max(0,M-Math.ceil(M/3)); tmrSites=0; shortSites=Math.min(S,Math.ceil(M/2)) }
  const Oeff=res.S03?Math.max(0,O-1):O;
  const sites=Array.from({length:S},(_,k)=>{const planned=Math.round(30+seedRand(k+S)*60); const late=k<Oeff; const lag=late?Math.round(10+seedRand(k+3)*10):Math.round(seedRand(k+7)*4);
   return {id:k+1,name:`工地 ${String(k+1).padStart(2,"0")}`,planned,actual:Math.max(0,planned-lag),late,lag,
    abnormal:k>=Oeff&&k<Oeff+A, short:k>=S-shortSites, tmr:k>=S-tmrSites, unrep:k>=S-unrep&&k<S, unrep2:k>=S-unrep2&&k<S,crew:Math.max(1,Math.round(crew+(seedRand(k)-.5)*2))}});
  sites.forEach(s=>{s.light=(s.late||s.unrep2||(s.abnormal&&s.tmr))?"red":(s.abnormal||s.short||s.unrep)?"amber":"green"});
  const avgActual=sites.reduce((x,s)=>x+s.actual,0)/S, avgPlanned=sites.reduce((x,s)=>x+s.planned,0)/S;
  const idleMan=tmrSites*crew*a.stopDay;
  const blocked=Math.min(S,tmrSites+unrep2), ready=S-blocked;
  const delayDays=Oeff?Math.round(sites.filter(s=>s.late).reduce((x,s)=>x+s.lag,0)/Oeff/4):0;
  const decAbn=Math.ceil(A/2), decShort=tmrSites>0?1:0, decLate=Oeff>0?1:0, decisions=decAbn+decShort+decLate;

const BUILD={
 key:"build",name:"營造公司",title:i=>`${i.company?esc(i.company)+" 的":"我的"}工程管理戰情室`,

  {k:"projects",label:"同時管理工程數",min:1,max:20,step:1,unit:"件"},
  {k:"contract",label:"工程總合約金額",min:500,max:200000,step:500,unit:"萬",fmt:"wan"},
  {k:"progress",label:"平均工程進度",min:0,max:100,step:1,unit:"%"},
  {k:"budgetExec",label:"預算執行比例（已花成本 ÷ 預算）",min:0,max:120,step:1,unit:"%"},
  {k:"pendingBill",label:"待請款金額（已完成未請）",min:0,max:20000,step:50,unit:"萬",fmt:"wan"},
  {k:"unsigned",label:"未核准追加減金額",min:0,max:10000,step:50,unit:"萬",fmt:"wan"},
  {k:"trouble",label:"逾期及異常工程數",min:0,max:20,step:1,unit:"件",cap:"projects"}],
 asm:{margin:0.12,duration:360,collect:0.85,pay:0.9,penalty:0.001,subShare:0.6},

 model(i,res,a){
  const P=i.projects, C=i.contract, p=i.progress/100, b=i.budgetExec/100, X=Math.min(i.trouble,P);
  let B=i.pendingBill, V=i.unsigned;
  /* 進度（獨立）：落後工程拉低進度效率 */
  let lagPct=X?6+4*Math.min(X,3):0; if(res.S01) lagPct=Math.max(0,lagPct-6);
  const planned=Math.min(1,p+(X/P)*lagPct/100), SPI=planned?p/planned:1, delayDays=Math.round((planned-p)*a.duration);
  /* 成本（獨立）：預算 = 合約 ×（1 − 目標毛利）；CPI = 依進度應花 ÷ 實際已花 */
  const budget=C*(1-a.margin), AC=budget*b, EVcost=budget*p, CPI=AC?EVcost/AC:1, EAC=CPI?budget/CPI:budget, margin=(C-EAC)/C;
  /* 現金流（獨立）：已完成產值 − 待請款 = 已請款；已收 = 已請 × 收款比例 */
  if(res.S02) V=V*0.4;
  const EV=C*p, billed=Math.max(0,EV-B); let received=billed*a.collect; if(res.S03) received=Math.min(billed,received+(billed-received)*0.5);
  const recv=billed-received, overdueRecv=recv*Math.min(0.7,0.2+(X/P)*0.5)*(res.S03?0.5:1), paid=AC*a.pay, netCash=received-paid;
  const months=Math.max(1,12*p), monthlyCost=AC/months, coverWeeks=netCash>0?netCash/(monthlyCost/4.33):0;
  /* 其他格 */
  const bids=Math.max(1,Math.ceil(P/4)), doubts=3+bids*2;
  const subTotal=budget*a.subShare, subValued=subTotal*b, subPaid=subValued*0.85, subUnpaid=subValued-subPaid, subFlag=Math.ceil(X/2);
  const defects=Math.round(P*1.5)+X*2, defectsOver=X;
  const missingReports=Math.min(P,X), openDecisions=Math.ceil(P*0.8), lateDecisions=X?1:0;
  const penaltyRisk=X?C/P*a.penalty*delayDays:0;
  const decisions=(X?1:0)+(V>0?1:0)+(overdueRecv>0?1:0)+(CPI<0.97?1:0);
  const projects=Array.from({length:P},(_,k)=>{const w=0.6+seedRand(k+P)*0.8; return {id:k+1,name:`工程 ${String.fromCharCode(65+k)}`,w}});
  const wsum=projects.reduce((x,q)=>x+q.w,0);
  projects.forEach((q,k)=>{q.contract=C*q.w/wsum; const late=k<X; q.prog=clamp(p*100+(seedRand(k+11)-.5)*20-(late?lagPct:0),0,100); q.plan=clamp(q.prog+(late?lagPct:seedRand(k)*3),0,100); q.late=late; q.light=late?"red":(q.plan-q.prog>3?"amber":"green")});
  return {P,C,p,b,X,B,V,planned,SPI,delayDays,lagPct,budget,AC,EVcost,CPI,EAC,margin,EV,billed,received,recv,overdueRecv,paid,netCash,monthlyCost,coverWeeks,bids,doubts,subTotal,subValued,subPaid,subUnpaid,subFlag,defects,defectsOver,missingReports,openDecisions,lateDecisions,penaltyRisk,decisions,projects,a};
 },

   <div class="legend"><span><span class="dot red"></span>要處理</span><span><span class="dot amber"></span>注意</span><span><span class="dot green"></span>正常</span><span>燈號依固定規則，不靠 AI</span></div></section>
  <section id="sec-scen" class="card"><h2>三個老闆最常遇到的情境</h2><p class="lede">每個情境走一遍：異常 → 原因 → 建議 → 你的決定 → 派工 → 驗果。用的是你剛才輸入的條件。</p><div class="scens" id="scenArea"></div></section>
  <section id="sec-ai" class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>AI 經營特助</h2><span class="rule-tag">規則式模擬建議・未接 AI 模型</span></div><div id="aiArea"></div></section>
  <section id="sec-sim" class="card"><h2>改善試算</h2><p class="lede">拉動改善幅度，看可能的效果。所有金額都附計算方式與假設，可自行修改假設；這是估算，不是保證收益。</p><div id="simArea"></div></section>
  <section id="sec-next" class="card"><h2>下一步</h2><p class="lede">看完覺得有用，可以選一個方式繼續。</p>
   <div class="convs"><button class="conv" data-conv="summary"><b>領取管理體檢摘要</b><span>把剛才的九宮格重點整理成一頁，可以留聯絡方式寄給你。</span></button>
   <button class="conv" data-conv="line"><b>加入 LINE 了解工程 AI 員工</b><span>加官方帳號，看更多工程老闆的使用方式。</span></button>
   <button class="conv" data-conv="booking"><b>預約專人示範</b><span>專人用你公司的情況，示範每天怎麼用。</span></button></div></section>`;
}
const fv=(f,v)=>f.fmt==="wan"?F.wan(v):`${v} ${f.unit}`;
function curModel(){const k=ST.view;return MODS[k].model(ST.inp[k],ST.resolved[k],ST.asm[k])}
function renderGrid(){
  const M=MODS[ST.view], m=curModel();
  $("#gridArea").innerHTML=`<div class="nine">${M.tiles(m).map(t=>`<button class="tile ${t.cls}" data-tile="${t.k}"><div class="t-h"><h3>${t.h}</h3>${t.cls==="red"?'<span class="pill red">要處理</span>':""}</div><div class="t-big">${t.big}<small>${t.unit}</small></div><div class="t-lines"><div>${t.lines[0]}</div><div class="opt">${t.lines[1]}</div></div></button>`).join("")}</div>`;
}
function renderScens(){
  const M=MODS[ST.view], m=curModel();
  $("#scenArea").innerHTML=Object.entries(M.scenarios).map(([id,s])=>{const done=ST.resolved[ST.view][id];return `<button class="scen ${done?"done":""}" data-scen="${id}"><span class="small muted">${id}</span><b>${s.title}</b><span class="small muted">${s.sub}</span><span class="steps">${["異常","原因","建議","決策","派工","驗果"].map(x=>`<span class="step ${done?"ok":""}">${x}</span>`).join("")}</span><span class="small" style="color:var(--blue);font-weight:700">${done?"已處理，再看一次 →":"開始體驗 →"}</span></button>`}).join("");
}
function renderAI(){
  const k=ST.view, M=MODS[k], m=curModel(), A=ST.asst[k], top=M.assistant(m);
  $("#aiArea").innerHTML=`<div><h3>今日最重要的三個問題</h3>${top.map((x,i)=>`<div class="issue"><span class="no">${i+1}</span><span><span class="t">${esc(x.t)}</span><br><span class="m">${esc(x.why)}</span><br><span class="m">建議優先處理：${esc(x.task)}</span></span><span>${x.scen?`<button class="btn ghost sm" data-scen="${x.scen}">看情境</button>`:""}</span></div>`).join("")}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-asst="dispatch" ${A.tasks.length?"disabled":""}>一鍵模擬派工</button><button class="btn ghost sm" data-asst="day" ${A.tasks.length&&A.day<3?"":"disabled"}>快轉一天</button><button class="btn ghost sm" data-asst="reset" ${A.tasks.length?"":"disabled"}>重來</button></div>
   ${A.tasks.length?`<div><h3>處理進度（第 ${A.day} 天）</h3><div class="tasks" style="margin-top:6px">${A.tasks.map(t=>{const st=A.day>=t.done?"已完成":A.day>=1?"處理中":"已派工";return `<div class="task"><span><b>${esc(t.task)}</b><br><span class="small muted">負責：${esc(t.who)}</span></span><span class="pill ${st==="已完成"?"green":st==="處理中"?"blue":"grey"}">${st}</span></div>`}).join("")}</div></div>
   <div><h3>改善結果</h3><div class="cmp" style="margin-top:6px">${A.tasks.map(t=>`<div><span>${esc(t.metric[0])}</span><b>${A.day>=t.done?`${esc(t.metric[1])} → ${esc(t.metric[2])}`:esc(t.metric[1])}</b></div>`).join("")}</div>${A.day>=3?`<p class="note" style="margin-top:8px">三天後的模擬結果。正式使用時，這些數字來自每天的回報與系統紀錄。</p>`:""}</div>`:""}`;
}
function renderSim(){
  const k=ST.view, M=MODS[k], m=curModel(), s=ST.sim[k], a=ST.asm[k], r=M.sim(m,s,a);
  $("#simArea").innerHTML=`<div class="simgrid"><div class="cfg" style="grid-template-columns:1fr">${M.simInputs.map(f=>`<label class="fld"><span class="lab">${f.label}<b id="sv-${f.k}">${s[f.k]} ${f.unit}</b></span><input type="range" data-sim="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${s[f.k]}" aria-label="${f.label}"></label>`).join("")}</div>
   <div class="res" id="simRes">${simRes(r)}</div></div>
   <details><summary class="small" style="cursor:pointer">修改計算假設</summary><div class="asm-edit" style="margin-top:8px">${Object.entries(M.asmLabels).map(([key,[lab,st]])=>`<label>${lab}<input type="text" inputmode="decimal" data-asm="${key}" value="${a[key]}"></label>`).join("")}</div></details>`;
}
function simRes(r){return r.rows.map(x=>`<div class="resrow"><span>${x[0]}<div class="asm">${esc(x[2])}</div></span><b>${x[1]}</b></div>`).join("")+(r.total!=null?`<div class="resrow"><span><b>每月可能減少的成本合計</b></span><b>${F.nt(r.total)}</b></div>`:"")+`<p class="note">估算，不是保證收益。實際效果要看導入後的回報與紀錄。</p>`}
function refresh(){ if(!MODS[ST.view]) return; const M=MODS[ST.view], i=ST.inp[ST.view];
  $("#indTitle").innerHTML=M.title(i);
  const caps=M.inputs.filter(f=>f.cap&&i[f.k]>i[f.cap]).map(f=>f.label); $("#clampNote").textContent=caps.length?`${caps.join("、")}超過${M.inputs.find(f=>f.k===M.inputs.find(x=>x.cap).cap).label}，以上限計算`:"";
  renderGrid(); renderScens(); renderAI(); renderSim(); }
function render(){
  $("#main").innerHTML=ST.view==="home"?vHome():vInd();
  if(ST.view!=="home") refresh();
  renderDrawer(); if(ST.dev) renderDev();
}

/* =================== 共用框架：情境流程（異常 → 原因 → 建議 → 決策 → 派工 → 驗果） =================== */
const STEPS=["異常","原因","建議","決策","派工","驗果"];
function scenBody(){
  const sc=ST.scen, M=MODS[sc.ind], m=MODS[sc.ind].model(ST.inp[sc.ind],{...ST.resolved[sc.ind],[sc.id]:false},ST.asm[sc.ind]), S=M.scenarios[sc.id], d=S.build(m,ST.asm[sc.ind]);
  const o=d.options.find(x=>x.id===sc.choice);
  const blocks=[
   `<div class="card" style="border-left:5px solid var(--red)"><h3>① 異常</h3><b>${esc(d.anomaly)}</b><div style="display:flex;flex-direction:column;gap:6px">${d.evidence.map(e=>`<div class="msg"><div class="who">${esc(e[0])}</div>${esc(e[1])}${e[2]?"・"+esc(e[2]):""}</div>`).join("")}</div></div>`,
   `<div class="card"><h3>② 可能原因（依規則排序）</h3><ol style="margin:0;padding-left:20px">${d.causes.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>`,
   `<div class="card"><h3>③ 建議方案</h3>${d.options.map(x=>`<button class="opt" data-opt="${x.id}" aria-pressed="${sc.choice===x.id}"><b>${esc(x.t)}</b><small>${esc(x.c)}・預期：${esc(x.eff)}</small></button>`).join("")}<span class="rule-tag" style="align-self:flex-start">規則式模擬建議</span></div>`,
   o?`<div class="card"><h3>④ 老闆決策</h3><b>你選擇：${esc(o.t)}</b><span class="small muted">決策時間與內容會留紀錄，之後可回頭看效果。</span></div>`:"",
   o&&sc.step>=4?(()=>{const t=d.dispatch(o);return `<div class="card"><h3>⑤ 派工</h3><div class="kv"><span>負責</span><span>${esc(t.who)}</span><span>工作</span><span>${esc(t.what)}</span><span>期限</span><span>${esc(t.due)}</span></div><span class="small muted">正式版會用 LINE 通知負責人，到期未完成會提醒（本版不發送）。</span></div>`})():"",
   o&&sc.step>=5?(()=>{const v=d.verify(o);return `<div class="card" style="border-left:5px solid var(--green)"><h3>⑥ 驗果</h3><p style="margin:0">${esc(v.text)}</p><div class="cmp">${v.before.map((b,i)=>`<div><span>${esc(b[0])}</span><b>${esc(String(b[1]))} → ${esc(String(v.after[i][1]))}</b></div>`).join("")}</div></div>`})():""];
  const showUpto=sc.step<=2?sc.step:sc.step;
  return `<div class="steps">${STEPS.map((x,i)=>`<span class="step ${i<sc.step?"ok":i===sc.step?"on":""}">${x}</span>`).join("")}</div>
   <div class="flowbox">${blocks.slice(0,Math.min(showUpto+1,6)).join("")}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${sc.step<2?`<button class="btn" data-next="1">下一步：${STEPS[sc.step+1]}</button>`:sc.step===2?`<button class="btn" data-next="1" ${sc.choice?"":"disabled"}>${sc.choice?"確定這個決策":"先選一個方案"}</button>`:sc.step<5?`<button class="btn" data-next="1">下一步：${STEPS[sc.step+1]}</button>`:`<button class="btn" data-scenclose="1">完成，回到九宮格</button><button class="btn ghost" data-conv="booking">想用在我的公司</button>`}</div>`;
}

/* =================== 共用框架：轉換、抽屜、開發檢視 =================== */
function summaryText(){
  const k=ST.view, M=MODS[k], m=curModel(), i=ST.inp[k];
  return `${i.company||"你的公司"}｜管理體檢摘要（模擬）\n`+M.tiles(m).filter(t=>t.k!=="ai").map(t=>`・${t.h}：${String(t.big).replace(/<[^>]+>/g,"")} ${t.unit}${t.cls==="red"?"（要處理）":""}`).join("\n")+`\n\n今日三件事：\n`+M.assistant(m).map((x,n)=>`${n+1}. ${x.t} → ${x.task}`).join("\n")+`\n\n＊依輸入條件模擬，建議為規則式模擬。`;
}
function convBody(kind){
  const consentBox=`<label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="cv-agree"> 我同意你們用這個聯絡方式和我聯繫，說明工程 AI 員工。資料保存 12 個月，可隨時要求刪除。</label>`;
  if(kind==="summary") return `<pre style="white-space:pre-wrap;font-family:var(--body);background:var(--sunk);border-radius:10px;padding:12px;margin:0;font-size:14px">${esc(summaryText())}</pre>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" data-copysum="1">複製摘要</button></div>
   <h3>想寄給自己？（選填）</h3><input type="text" id="cv-contact" placeholder="LINE ID 或 Email">${consentBox}<button class="btn" data-cvsend="summary">寄給我</button><p class="note">不留也可以，上面的摘要已經可以直接複製。</p>`;
  if(kind==="line") return `<p style="margin:0">搜尋官方帳號 ID，或用手機開啟連結加入：</p><div class="kv"><span>官方帳號 ID</span><span><b>@你的官方帳號</b>（正式版替換）</span><span>連結</span><span>https://line.me/R/ti/p/@你的官方帳號</span></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-cvsend="line">我已加入</button></div><p class="note">原型不會開啟真實 LINE。按下後只記錄一次「點選加入 LINE」事件。</p>`;
  return `<label class="fld"><span class="lab">怎麼稱呼（選填）</span><input type="text" id="cv-name" placeholder="例如：王老闆"></label><label class="fld"><span class="lab">聯絡方式</span><input type="text" id="cv-contact" placeholder="電話、LINE ID 或 Email"></label><label class="fld"><span class="lab">方便的時間</span><select id="cv-time"><option>平日上午</option><option>平日下午</option><option>平日晚上</option><option>週末</option></select></label>${consentBox}<button class="btn" data-cvsend="booking">送出預約</button>`;
}
function renderDrawer(){
  const d=ST.drawer; if(!d){$("#layer").innerHTML="";return}
  let h="",b="";
  if(d.kind==="tile"){const M=MODS[ST.view], m=curModel(), t=M.tiles(m).find(x=>x.k===d.k), det=M.detail(d.k,m); h=t.h; b=`<div class="t-big" style="font-size:34px">${t.big}<small>${t.unit}</small></div><p class="note"><b>怎麼算：</b>${det[0]}</p>${det[1]||""}`}
  if(d.kind==="scen"){const S=MODS[ST.scen.ind].scenarios[ST.scen.id]; h=`${ST.scen.id}｜${S.title}`; b=scenBody()}
  if(d.kind==="conv"){h={summary:"管理體檢摘要",line:"加入 LINE",booking:"預約專人示範"}[d.k]; b=convBody(d.k)}
  $("#layer").innerHTML=`<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-label="${esc(h)}"><div class="dr-h"><h2 style="font-size:18px">${esc(h)}</h2><button class="x" data-close="1" aria-label="關閉">×</button></div><div class="dr-b" id="drb">${b}</div></aside>`;
}
function renderDev(){
  let el=$("#devPanel"); if(!ST.dev){ if(el) el.remove(); return }
  if(!el){el=document.createElement("section");el.id="devPanel";el.className="card";el.style.margin="0 0 16px";$("#main").prepend(el)}
  el.innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><h2 style="font-size:17px">開發檢視：來源歸因與事件</h2><span class="small muted">客戶看不到這一塊</span></div>
   <label class="fld"><span class="lab">模擬來源（正式版由專屬連結碼決定）</span><select id="srcSel">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${ST.source===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
   <div class="kv"><span>session</span><span>${ST.session}</span><span>同意</span><span>${ST.consent||"尚未選擇"}</span><span>留資</span><span>${ST.leads.length} 筆（${ST.leads.map(l=>l.kind).join("、")||"—"}）</span></div>
   <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto">${ST.events.map(e=>`<div class="ev"><span>${e.t}</span><span><code>${e.type}</code> ${esc(e.data)}<br><span class="muted">來源：${SRC[e.src].label}</span></span><span class="pill ${e.ok?"green":"grey"}">${e.ok?"記錄":"不記錄"}</span></div>`).join("")||`<span class="small muted">還沒有事件。</span>`}</div>`;
}

/* =================== 事件處理 =================== */
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.in){const k=ST.view, f=MODS[k].inputs.find(x=>x.k===t.dataset.in); ST.inp[k][f.k]=Number(t.value); $("#v-"+f.k).textContent=fv(f,ST.inp[k][f.k]); refresh(); clearTimeout(track.t1); track.t1=setTimeout(()=>track("customize",`${k}:${f.k}=${t.value}`),600); return}
  if(t.id==="in-company"){ST.inp[ST.view].company=t.value.slice(0,20); $("#indTitle").innerHTML=MODS[ST.view].title(ST.inp[ST.view]); return}
  if(t.dataset.sim){const k=ST.view, f=MODS[k].simInputs.find(x=>x.k===t.dataset.sim); ST.sim[k][f.k]=Number(t.value); $("#sv-"+f.k).textContent=`${t.value} ${f.unit}`; $("#simRes").innerHTML=simRes(MODS[k].sim(curModel(),ST.sim[k],ST.asm[k])); clearTimeout(track.t2); track.t2=setTimeout(()=>track("simulator_use",`${k}:${f.k}=${t.value}`),600); return}
  if(t.dataset.asm){const k=ST.view, v=Number(t.value); if(!Number.isNaN(v)&&v>=0){ST.asm[k][t.dataset.asm]=v; renderGrid(); renderScens(); renderAI(); $("#simRes").innerHTML=simRes(MODS[k].sim(curModel(),ST.sim[k],ST.asm[k]))} return}
});
document.addEventListener("change",e=>{ if(e.target.id==="srcSel"){ST.source=e.target.value; track("source_set",ST.source); toast("已切換模擬來源")} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&ST.drawer){ST.drawer=null;renderDrawer()} });
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(t.id==="devBtn"){ST.dev=!ST.dev; t.setAttribute("aria-pressed",ST.dev); renderDev(); return}
  if(d.ind){ST.view=d.ind; render(); window.scrollTo({top:0}); track("page_open",`${d.ind}${ST.source!=="direct"?"・夥伴連結":""}`); return}
  if(d.home){ST.view="home"; ST.drawer=null; render(); window.scrollTo({top:0}); return}
  if(d.jump){const el=document.getElementById(d.jump); if(el){window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-56,behavior:"smooth"})} return}
  if(d.consent){ST.consent=d.consent; track("consent",d.consent); render(); return}
  if(d.resetinp){ST.inp[ST.view]={...MODS[ST.view].defaults}; ST.resolved[ST.view]={}; ST.asst[ST.view]={tasks:[],day:0}; render(); return}
  if(d.close){ST.drawer=null; renderDrawer(); return}
  if(d.tile){ST.drawer={kind:"tile",k:d.tile}; renderDrawer(); track("grid_open",`${ST.view}:${d.tile}`); return}
  if(d.scen){ST.scen={ind:ST.view,id:d.scen,step:0,choice:null}; ST.drawer={kind:"scen"}; renderDrawer(); track("scenario_open",`${ST.view}:${d.scen}`); return}
  if(d.opt){ST.scen.choice=d.opt; $("#drb").innerHTML=scenBody(); return}
  if(d.next){const sc=ST.scen; if(sc.step===2&&!sc.choice) return; sc.step=Math.min(5,sc.step+(sc.step===2?2:1)); $("#drb").innerHTML=scenBody(); $("#drb").scrollTop=$("#drb").scrollHeight;
    if(sc.step===4) track("scenario_decision",`${sc.ind}:${sc.id}:${sc.choice}`);
    if(sc.step===5){ST.resolved[sc.ind][sc.id]=true; track("scenario_complete",`${sc.ind}:${sc.id}`); refresh()} return}
  if(d.scenclose){ST.drawer=null; ST.scen=null; renderDrawer(); toast("九宮格已依處理結果更新"); return}
  if(d.asst){const k=ST.view, A=ST.asst[k];
    if(d.asst==="dispatch"){const m=curModel(); A.tasks=MODS[k].assistant(m).map((x,n)=>({task:x.task,who:k==="water"?["主任","行政","老闆"][n%3]:["工務","會計","老闆"][n%3],metric:x.metric,done:n+1})); A.day=0; track("assistant_dispatch",k)}
    if(d.asst==="day"){A.day=Math.min(3,A.day+1); if(A.day===3) track("assistant_result",k)}
    if(d.asst==="reset"){A.tasks=[];A.day=0}
    renderAI(); return}
  if(d.conv){ST.drawer={kind:"conv",k:d.conv}; renderDrawer(); track(d.conv==="summary"?"summary_open":d.conv==="line"?"line_open":"booking_open",ST.view); return}
  if(d.copysum){try{await navigator.clipboard.writeText(summaryText()); toast("已複製摘要")}catch(err){toast("請長按摘要文字手動複製")} track("summary_request","copy"); return}
  if(d.cvsend){const kind=d.cvsend;
    if(kind==="line"){track("line_join_click",ST.view); ST.drawer=null; renderDrawer(); toast("已記錄（模擬，未開啟 LINE）"); return}
    const contact=($("#cv-contact")?.value||"").trim(), agree=$("#cv-agree")?.checked;
    if(!contact){toast("請填聯絡方式"); return}
    if(!agree){toast("留聯絡方式需要勾選同意"); return}
    ST.leads.push({kind:kind==="summary"?"索取摘要":"預約示範",ind:ST.view,src:ST.source,consent:true});
    track(kind==="summary"?"summary_request":"booking_submit",`${ST.view}・已同意聯繫${ST.source!=="direct"?"・歸因 "+ST.source:""}`);
    ST.drawer=null; renderDrawer(); toast(kind==="summary"?"已收到，摘要會寄給你（模擬，未發送）":"已收到預約，專人會聯繫你（模擬，未發送）"); return}
});
ST=freshState(); render();
</script>
