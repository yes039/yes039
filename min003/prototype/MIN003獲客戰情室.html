function simEvent(type,f,why){
  const c=cust(simCid), now=new Date(), t=now.toTimeString().slice(0,8);
  simState.log=simState.log||[];
  let ok=true;
  if(type!=="page_open"&&type!=="feedback_submit"&&type!=="consult_click"&&simState.consent!=="同意記錄操作"){ ok=false; why="客戶沒有同意記錄操作，只提供功能，不做個別記錄" }
  if(ok){ S.E.push({id:S.eid++,cid:c.id,tpl:c.tpl,type,feature:f||"",ts:"10/28 "+t.slice(0,5),consent:simState.consent||"未選",counted:true}); autoAdvance(c,type) }
  simState.log.unshift({t,type,f,why,ok});
}
function autoAdvance(c,type){
  const before=c.stage, i=stIdx(c.stage);
  const move=(to,why)=>{ if(stIdx(to)>stIdx(c.stage)&&!["成交","未成交"].includes(c.stage)){ S.H.push({cid:c.id,ts:"10/28 "+new Date().toTimeString().slice(0,5),from:c.stage,to,by:"系統",why}); c.stage=to } };
  if(["feature_click","task_complete"].includes(type)&&i>=1) move("已體驗","有實際操作");
  if(type==="feedback_submit"&&c.feedback&&c.feedback.want==="想了解專屬版本") move("有需求","回饋選「想了解專屬版本」");
  if(type==="consult_click") move("有需求","點選需求諮詢");
  const done=has(c.id,["task_complete"]), intent=has(c.id,["consult_click"])||(c.feedback&&c.feedback.want==="想了解專屬版本");
  if(done&&intent&&!c.hot){ c.hot=true; notify("hot",c) }
  if(before!==c.stage&&c.stage==="有需求") notify("need",c);
}
function notify(rule,c){
  const r=S.R.find(x=>x.id===rule); if(!r||!r.on) return;
  const ts="10/28 "+new Date().toTimeString().slice(0,5);
  const dup=S.N.some(n=>n.rule===rule&&n.cid===(c&&c.id)&&n.ts.slice(0,5)==="10/28");
  S.N.push({id:S.nid++,ts,rule,ch:"LINE",to:rule==="hot"?"Shen":uname(c.owner),cid:c?c.id:null,status:dup?"已抑制（24 小時內通知過）":"已送出（模擬）",tries:dup?0:1});
  if(!dup) toast(`模擬通知：${RNAME[rule]}（沒有真的發送）`);
}

function attribute({company,phone,pid}){
  const p=pById(pid);

  const hit=S.C.find(c=>norm(c.company)===k1||(k2.length>=8&&normPhone(c.phone)===k2));
  if(!hit) return {ok:true,code:"new",why:`名冊沒有這家客戶，歸因成立，保護期 ${cfg().protectDays} 天`};

  if(hit.partner&&hit.attrUntil>=TODAY) return {ok:false,code:"other",hit,why:`已由其他夥伴推薦，保護期到 ${hit.attrUntil}`};

}

document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-cust],[data-close],[data-partner]"); if(!t) return; const d=t.dataset;
  if(d.view) return go(d.view);
  if(d.go) return go(d.go);
  if(d.close){drawer=null;return renderDrawer()}
  if(d.cust){drawer=d.cust;return renderDrawer()}

  if(d.asp){S.me=d.asp;drawer=null;toast(`切換為 ${me().name}`);return render()}
