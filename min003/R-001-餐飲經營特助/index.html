<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>R-001 餐飲經營特助</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 手機優先單欄，480px 內容寬；首頁 3×3 九宮格，中央深藍「經營總覽」，點卡進入全頁詳細 */
:root{
  --bg:#FFFFFF; --surface:#F3F5F8; --card:#FFFFFF; --ink:#1E2A37; --ink-2:#5B6979; --ink-3:#8794A3;
  --line:#E0E5EB; --navy:#22344A; --navy-ink:#F3F5F8; --navy-2:#AFC0D2;
  --gold:#B8860B; --gold-strong:#C99A1E; --gold-soft:#FBF3DC; --gold-ink:#7A5A06;
  --ok:#23845A; --ok-soft:#E3F3EB; --warn:#B87500; --warn-soft:#FDF1DC; --bad:#C2412D; --bad-soft:#FBE7E3;
  --bar:#5B7896; --bar-2:#C9D3DE;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171E; --surface:#18212B; --card:#1C2631; --ink:#E7ECF1; --ink-2:#A3B0BE; --ink-3:#77869A;
  --line:#2B3744; --navy:#24384F; --navy-ink:#F3F5F8; --navy-2:#A9BCD0;
  --gold:#E2B33E; --gold-strong:#E2B33E; --gold-soft:#2D2614; --gold-ink:#F0CF77;
  --ok:#4CC08A; --ok-soft:#14302A; --warn:#E8A93A; --warn-soft:#33280F; --bad:#F07560; --bad-soft:#3A1E1A;
  --bar:#7F9DBC; --bar-2:#334252; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#18212B; --card:#1C2631; --ink:#E7ECF1; --ink-2:#A3B0BE; --ink-3:#77869A;
  --line:#2B3744; --navy:#24384F; --navy-ink:#F3F5F8; --navy-2:#A9BCD0;
  --gold:#E2B33E; --gold-strong:#E2B33E; --gold-soft:#2D2614; --gold-ink:#F0CF77;
  --ok:#4CC08A; --ok-soft:#14302A; --warn:#E8A93A; --warn-soft:#33280F; --bad:#F07560; --bad-soft:#3A1E1A;
  --bar:#7F9DBC; --bar-2:#334252; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:19px;font-weight:900}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
a{color:var(--gold-ink)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.top .back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:500;flex:none}
.top .ttl{min-width:0;flex:1}
.top .ttl b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--ink-2);font-size:11.5px}
.sim{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--gold-ink);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.top .menu{border:none;background:none;padding:6px;flex:none;color:var(--ink-2);font-size:12px}

/* 30 秒摘要 */
.brief{margin-top:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.brief .row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:baseline}
.brief .k{font-size:11.5px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.brief .v{min-width:0}
.brief .v b{font-family:var(--f-num);font-size:17px}

/* 九宮格 */
.grid9{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 9px 9px;min-height:112px;display:flex;flex-direction:column;gap:2px;transition:transform .12s ease,border-color .12s}
.tile:hover{border-color:var(--ink-3)}
.tile:active{transform:scale(.97)}
.tile .t{font-size:12.5px;font-weight:700;line-height:1.25;padding-right:14px}
.tile .v{font-family:var(--f-num);font-size:21px;font-weight:700;line-height:1.15;margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink-2)}
.tile .s{font-size:11px;color:var(--ink-2);line-height:1.35}
.tile .dot{position:absolute;top:10px;right:9px;width:10px;height:10px;border-radius:50%}
.tile.hl{box-shadow:0 0 0 3px var(--gold-strong)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--bar)}
.tile.center{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tile.center .s{color:var(--navy-2)}
.tile.center .t{color:var(--gold-strong)}
.tile.center .v{font-size:20px}
.tile.center .mini{display:grid;gap:1px;font-size:11px;color:var(--navy-2);margin-top:auto}
.tile.center .mini span b{font-family:var(--f-num);font-size:14px;color:var(--navy-ink);font-weight:600}
.tile.ai{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tile .light{font-size:10.5px;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}

/* sections */
.sec{margin-top:18px;display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h small{color:var(--ink-2);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.box.soft{background:var(--surface);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--ink-2)}
.kpi .n{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--surface);color:var(--ink-2)}
.alert{border-radius:var(--r);padding:11px 13px;display:grid;gap:4px;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.alert b{font-size:13.5px}
.alert p{font-size:12.5px;color:var(--ink)}
.tbl-wrap{overflow-x:auto;margin-inline:-2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--ink-2);font-weight:700;letter-spacing:.03em}
td{font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-top:2px solid var(--ink-3)}
tr.em td{background:var(--bad-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.gold{background:var(--gold-strong);border-color:var(--gold-strong);color:#1E2A37}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.cascade{display:grid;gap:0}
.cascade .r{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.cascade .r .n{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.cascade .r.sub{padding-left:12px;color:var(--ink-2);font-size:12.5px}
.cascade .r.sub .n{font-size:14px}
.cascade .r.res{border-bottom:2px solid var(--ink);font-weight:900}
.cascade .r.res .n{font-size:18px;font-weight:700}
.cascade .r.gold{background:var(--gold-soft);padding-inline:8px;border-radius:8px;border-bottom:none;margin-block:4px}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.item .ic{width:8px;height:8px;border-radius:50%;margin-top:7px}
.item .txt{min-width:0}
.item .txt b{display:block;font-size:13.5px}
.item .txt span{font-size:12px;color:var(--ink-2)}
.item .go{color:var(--ink-3);font-size:13px;align-self:center}
.sugg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.sugg .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sugg .no{font-family:var(--f-num);font-weight:700;color:var(--gold-ink);font-size:13px}
.sugg .imp{font-size:12px;color:var(--ink-2)}
.evid{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12.5px;display:grid;gap:4px}
.evid .src{font-size:11px;color:var(--ink-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--f-num)}
.chart .lbl{fill:var(--ink);font-weight:600}
.range{width:100%}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:700}
label.f span.h{font-weight:400;color:var(--ink-2);font-size:11.5px}
select,input[type=text],input[type=number],textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
pre.code{background:var(--surface);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin:0;line-height:1.45;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
.cta{margin-top:18px;background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.cta p{color:var(--navy-2);font-size:12.5px}
.cta .btns .btn{border-color:var(--navy-2);background:transparent;color:var(--navy-ink)}
.cta .btns .btn.gold{background:var(--gold-strong);border-color:var(--gold-strong);color:#1E2A37}
.adv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.adv button{background:var(--surface);border:1px dashed var(--ink-3);border-radius:var(--r);padding:10px 8px;text-align:left;font-size:12.5px;font-weight:700;display:grid;gap:2px}
.adv button small{font-weight:400;color:var(--ink-2);font-size:11px}
.foot{margin-top:22px;font-size:11px;color:var(--ink-3);display:grid;gap:6px}
.foot .btns{justify-content:flex-start}
.callout{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--r);padding:10px 12px;font-size:12.5px;display:grid;gap:6px}
.callout b{color:var(--gold-ink)}
.gantt .lane{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:6px;font-size:11.5px;min-height:20px}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.done{text-decoration:line-through;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.tile .v{font-size:18px}.tile{padding:9px 7px}.brief .row{grid-template-columns:64px 1fr}}
</style>

<script>

    {n:'阿凱',r:'廚房兼職',t:'pt',rg:[[13,18]]},
    {n:'佳佳',r:'吧台兼職',t:'pt',rg:[[14,18]]},
    {n:'美美',r:'外場兼職',t:'pt',rg:[[11,15]],ot:1},

const RULE = {

  monthDays:26.5,wasteGap:.022
};

/* ---------- 狀態（僅存在此裝置） ---------- */
const DEFAULT_PROFILE={preset:'teppan',name:'',orders:107,ticket:0,delivery:true,staff:8};

/* ---------- 工具 ---------- */
const fmt=n=>Math.round(n).toLocaleString('zh-TW');
const $=n=>'$'+fmt(n);
const pct=(n,d=1)=>(n*100).toFixed(d)+'%';
const sgn=(n,f=fmt)=>(n>0?'+':n<0?'−':'±')+f(Math.abs(n));
const chg=(a,b)=>b?a/b-1:0;
const cls=v=>v>0.0005?'up':v<-0.0005?'down':'flat';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LIGHT_TXT={ok:'正常',warn:'注意',bad:'異常',info:'資訊'};
const worst=a=>a.includes('bad')?'bad':a.includes('warn')?'warn':'ok';
const hh=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0')};
function split3(total,shares){const s=shares.reduce((a,b)=>a+b,0);const a=Math.round(total*shares[0]/s),c=Math.round(total*shares[2]/s);return [a,total-a-c,c]}
function apportion(total,weights){const s=weights.reduce((a,b)=>a+b,0)||1;const raw=weights.map(w=>total*w/s);const fl=raw.map(Math.floor);let rem=total-fl.reduce((a,b)=>a+b,0);raw.map((r,i)=>[r-fl[i],i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(rem>0){fl[i]++;rem--}});return fl}

/* ============================================================
   計算核心：由店家設定產生一致的一天模擬資料
   ============================================================ */
function build(pf){
  const P=PRESETS[pf.preset]||PRESETS.teppan;
  const BASE_O=107,LW_O=110;
  const qm=P.qMult||1;const items0=P.items.map(a=>({n:a[0],p:a[1],c:a[2],u:a[3],role:a[4],q:a[5]*qm,lw:a[6]*qm}));
  const baseGross=items0.reduce((s,i)=>s+i.q*i.p,0);
  const baseDisc=Math.round(baseGross*.0115);
  const baseTicket=(baseGross-baseDisc)/BASE_O;
  const O=Math.max(10,Math.round(pf.orders||BASE_O));
  const T=pf.ticket>0?pf.ticket:baseTicket;
  const k=(O/BASE_O)*(T/baseTicket);
  let chan=P.chan.slice(),lwChan=P.lwChan.slice();
  if(!pf.delivery){chan=[chan[0]+chan[2]*.6,chan[1]+chan[2]*.4,0];lwChan=[lwChan[0]+lwChan[2]*.6,lwChan[1]+lwChan[2]*.4,0]}
  const orders=split3(O,chan);
  const lwO=Math.round(LW_O*O/BASE_O),lwOrders=split3(lwO,lwChan);
  const ing=P.ing,dIng=ing.now-ing.base;
  const items=items0.map(i=>{
    const qty=Math.max(0,Math.round(i.q*k)),lwq=Math.max(0,Math.round(i.lw*k));
    const ch=split3(qty,chan);
    const unitNow=i.c+i.u*dIng;
    return {...i,qty,lwq,ch,unitNow,rev:qty*i.p,lwRev:lwq*i.p,costNow:qty*unitNow,costBase:qty*i.c,ingUse:qty*i.u};
  });
  const gross=items.reduce((s,i)=>s+i.rev,0);
  const disc=Math.round(baseDisc*k);
  const chanGross=[0,1,2].map(c=>items.reduce((s,i)=>s+i.ch[c]*i.p,0));
  const chanRev=[chanGross[0]-disc,chanGross[1],chanGross[2]];
  const rev=gross-disc;
  const lwGross=items.reduce((s,i)=>s+i.lwRev,0),lwDisc=Math.round(disc*.87),lwRev=lwGross-lwDisc;
  const r=rev/(baseGross-baseDisc);
  const yRev=Math.round(rev*.9374),yO=Math.round(O*103/107);
  const target=Math.round(P.target*(O/P.defOrders)*(T/baseTicket)/100)*100;
  const food=items.reduce((s,i)=>s+i.costNow,0),foodBase=items.reduce((s,i)=>s+i.costBase,0);
  const ingKg=items.reduce((s,i)=>s+i.ingUse,0),ingImpact=food-foodBase;
  const gp=rev-food;

  /* 人員：取前 N 位；以 0.5 小時為格計算各時段成本 */
  const pool=STAFF[P.kind];const N=Math.min(pool.length,Math.max(2,pf.staff||8));
  const staff=pool.slice(0,N).map(s=>{
    const hours=s.rg.reduce((a,[f,t])=>a+(t-f),0);
    let rate,daily;
    if(s.t==='ft'){daily=s.m*RULE.ftLoad/RULE.ftDays;rate=daily/hours}else{rate=RULE.minWage*RULE.ptLoad;daily=0}
    const slots=[];// [start, cost]
    const last=s.rg[s.rg.length-1][1],ot=s.ot||0;
    s.rg.forEach(([f,t])=>{for(let x=f;x<t-1e-9;x+=.5){const isOt=s.t==='pt'&&x>=last-ot-1e-9;slots.push([x,.5*rate*(isOt?RULE.otMult:1),isOt])}});
    const cost=slots.reduce((a,b)=>a+b[1],0);
    return {...s,hours,rate,cost,slots};
  });
  const labor=staff.reduce((a,s)=>a+s.cost,0);
  const laborHours=staff.reduce((a,s)=>a+s.hours,0);

  /* 每小時訂單與營收 */
  const H=HOURS[P.kind];
  const hO=apportion(O,H.map(h=>h[1])),hLw=apportion(lwO,H.map(h=>h[2]));
  const wRev=H.map((h,i)=>hO[i]*BAND_MULT[h[3]]);const sumW=wRev.reduce((a,b)=>a+b,0)||1;
  const hRevRaw=wRev.map(w=>Math.round(rev*w/sumW));hRevRaw[hRevRaw.length-1]+=rev-hRevRaw.reduce((a,b)=>a+b,0);
  const hours=H.map((h,i)=>({h:h[0],o:hO[i],lw:hLw[i],band:h[3],rev:hRevRaw[i]}));

  /* 費用 */
  const deliRev=chanRev[2],commission=deliRev*RULE.commission;
  const pack=(orders[1]+orders[2])*RULE.packPerOrder;
  const payFee=rev*RULE.payFee;
  const fs=Math.sqrt(rev/53190); /* 固定費用以示範店為基準，依營收規模平方根縮放 */
  const fixed={rent:Math.round(4000*fs),util:Math.round(2200*fs),depr:Math.round(667*fs),misc:Math.round(800*fs),mkt:300};
  const fixedSum=Object.values(fixed).reduce((a,b)=>a+b,0);
  const op=gp-labor-commission-pack-payFee-fixedSum;

  /* 本月（模擬：10/1–10/29，26.5 個營業日） */
  const md=RULE.monthDays;
  const mRev=rev*md*1.0004;
  const mFoodTheo=(foodBase/rev+ (ingImpact/rev)*.35)*mRev;
  const mFood=mFoodTheo+mRev*RULE.wasteGap;
  const mLabor=labor*md*1.01,mComm=commission*md,mPack=pack*md,mPay=payFee*md;
  const mFixed={rent:fixed.rent*30,util:fixed.util*30,depr:fixed.depr*30,misc:fixed.misc*30,mkt:fixed.mkt*30};
  const mFixedSum=Object.values(mFixed).reduce((a,b)=>a+b,0);
  const mGp=mRev-mFood,mOp=mGp-mLabor-mComm-mPack-mPay-mFixedSum;
  const mInterest=Math.round(12000*fs);
  const mPretax=mOp-mInterest,mTax=Math.max(0,mPretax*.2),mNet=mPretax-mTax;

  /* 外送 */
  const deliItems=items.map(i=>{const pr=i.p;const com=pr*RULE.commission;return {...i,dineCm:pr-i.unitNow,deliCm:pr-i.unitNow-com,com}});
  const deliFood=items.reduce((s,i)=>s+i.ch[2]*i.unitNow,0);
  const chanFood=[0,1,2].map(c=>items.reduce((s,i)=>s+i.ch[c]*i.unitNow,0));
  const chanPack=[0,orders[1]*RULE.packPerOrder,orders[2]*RULE.packPerOrder];
  const chanCom=[0,0,commission];
  const chanCm=[0,1,2].map(c=>chanRev[c]-chanFood[c]-chanPack[c]-chanCom[c]);
  const deliCmRate=deliRev?chanCm[2]/deliRev:null;

  /* 產品：加點率、菜單工程 */
  const drink=items.find(i=>i.role==='drink'),addon=items.find(i=>i.role==='addon');
  const attach=drink.qty/O,lwAttach=drink.lwq/lwO;
  const addonRate=addon.qty/O,lwAddonRate=addon.lwq/lwO;
  const totQty=items.reduce((s,i)=>s+i.qty,0);
  const avgCm=items.reduce((s,i)=>s+i.qty*(i.p-i.unitNow),0)/totQty;
  const popTh=(1/items.length)*.7;
  items.forEach(i=>{i.cm=i.p-i.unitNow;i.cmRate=i.cm/i.p;i.pop=i.qty/totQty>=popTh;i.hiCm=i.cm>=avgCm;
    i.quad=i.pop&&i.hiCm?'明星':i.pop?'主力低毛利':i.hiCm?'潛力':'待檢討'});

  /* 會員（模擬） */
  const mem={friends:Math.round(1286*Math.sqrt(r)),newMonth:Math.round(142*Math.sqrt(r)),memberOrders:Math.round(O*.383),newToday:Math.round(O*.084),
    rep30:.34,rep30Last:.38,dormant:Math.round(214*Math.sqrt(r)),
    camp:{name:'平日晚餐飲品買一送一（LINE 券）',sent:Math.round(1200*Math.sqrt(r)),claimed:Math.round(310*Math.sqrt(r)),redeemed:Math.round(58*Math.sqrt(r))}};
  mem.memberShare=mem.memberOrders/O;mem.campRev=Math.round(mem.camp.redeemed*T*1.05);mem.campCost=Math.round(mem.camp.redeemed*drink.unitNow);

  /* 歷史 7 天 */
  const hist=[['五',1.1505],['六',1.3611],['日',1.2953],['一',null],['二',.8892],['三',.9374],['四',1]].map(([d,f])=>({d:'週'+d,r:f==null?null:Math.round(rev*f)}));
  hist[6].today=true;

  /* 離峰排班：營業中、單數 ≤ 尖峰 15% 的小時 */
  const peak=Math.max(...hours.map(h=>h.o));
  const offHours=hours.filter(h=>h.o<=peak*.15&&h.band==='O').map(h=>h.h);
  let offStaffHours=0,offPtCost=0;
  staff.forEach(s=>s.slots.forEach(([x,c])=>{if(offHours.includes(Math.floor(x))){offStaffHours+=.5;if(s.t==='pt')offPtCost+=c}}));
  const offOrders=hours.filter(h=>offHours.includes(h.h)).reduce((a,h)=>a+h.o,0);
  const otStaff=staff.filter(s=>s.ot);
  const otCost=staff.reduce((a,s)=>a+s.slots.filter(x=>x[2]).reduce((b,x)=>b+x[1]*(1-1/RULE.otMult),0),0);

  const D={P,pf,foodTarget:P.foodTarget,storeName:pf.name||P.store,label:P.label,kind:P.kind,O,orders,lwO,lwOrders,yO,items,gross,disc,rev,lwRev,yRev,target,chanRev,chanGross,
    food,foodBase,ing,ingKg,ingImpact,gp,staff,labor,laborHours,hours,deliRev,commission,pack,payFee,fixed,fixedSum,op,
    month:{rev:mRev,foodTheo:mFoodTheo,food:mFood,gp:mGp,labor:mLabor,comm:mComm,pack:mPack,pay:mPay,fixed:mFixed,fixedSum:mFixedSum,op:mOp,interest:mInterest,pretax:mPretax,tax:mTax,net:mNet},
    deliItems,chanFood,chanPack,chanCom,chanCm,deliCmRate,drink,addon,attach,lwAttach,addonRate,lwAddonRate,avgCm,mem,hist,offHours,offStaffHours,offPtCost,offOrders,otStaff,otCost};
  D.ticket=rev/O;D.lwTicket=lwRev/lwO;D.yTicket=yRev/yO;
  D.foodRate=food/rev;D.foodBaseRate=foodBase/rev;D.laborRate=labor/rev;D.gpRate=gp/rev;D.opRate=op/rev;
  D.achieve=rev/target;D.vsLw=chg(rev,lwRev);D.vsY=chg(rev,yRev);D.salesPerHour=rev/laborHours;
  D.lights=lights(D);D.sugg=suggestions(D);
  return D;
}

/* 燈號規則（同步寫在「計算邏輯說明」） */
function lights(D){
  const L={};
  L.revenue=D.achieve>=1?'ok':D.achieve>=.9?'warn':'bad';
  L.orders=D.vsLw>=-.03?'ok':D.vsLw>=-.10?'warn':'bad';
  const drop=1-D.attach/D.lwAttach;
  L.products=drop>.2?'bad':drop>.1?'warn':'ok';
  const spike=D.ing.now/D.ing.base-1;
  let f=D.foodRate<=D.foodTarget?'ok':D.foodRate<=D.foodTarget+.015?'warn':'bad';
  if(spike>=.5)f='bad';else if(spike>=.3&&f==='ok')f='warn';
  L.food=f;
  let l=D.laborRate<=RULE.laborTarget?'ok':D.laborRate<=.30?'warn':'bad';
  if(l==='ok'&&(D.otStaff.length||D.offPtCost>0))l='warn';
  L.labor=l;
  L.delivery=D.deliRev?(D.deliCmRate<RULE.deliveryMarginBad?'bad':D.deliCmRate<RULE.deliveryMarginWarn?'warn':'ok'):'info';
  L.members=D.mem.rep30>=.30?'ok':D.mem.rep30>=.25?'warn':'bad';
  const others=['revenue','orders','products','food','labor','delivery','members'].map(k=>L[k]);
  L.overview=D.op<0?'bad':worst(others);
  L.ai='info';
  return L;
}

/* 規則式「模擬建議」：每條都附可追溯的計算依據，依每月影響金額排序取前三 */
function suggestions(D){
  const md=RULE.monthDays,out=[];
  const dish=D.items.filter(i=>i.u>0).sort((a,b)=>b.u*b.qty-a.u*a.qty)[0];
  if(D.ingImpact>0){
    const keep=D.ingImpact*md;
    out.push({id:'food',area:'食材成本',route:'food',title:`${D.ing.name}進價上漲，${dish.n} 暫時調價或換配菜`,
      act:`${dish.n} 暫調 +10 元；套餐配菜改用當季便宜蔬菜，兩週後依進價再檢討`,impact:keep,
      basis:[`${D.ing.name}進價 ${D.ing.base} → ${D.ing.now} 元/${D.ing.unit}（${sgn((D.ing.now/D.ing.base-1)*100,n=>n.toFixed(0))}%）`,
        `今日用量約 ${D.ingKg.toFixed(1)} ${D.ing.unit}，食材成本因此增加 ${$(D.ingImpact)}`,
        `理論食材成本率 ${pct(D.foodBaseRate)} → ${pct(D.foodRate)}（目標 ${pct(D.foodTarget,0)}）`,
        `若持續一個月（${md} 營業日）毛利約少 ${$(keep)}`],src:'食材成本卡｜配方用量 × 進價差'});
  }
  const lost=(D.lwAttach-D.attach)*D.O*D.drink.p;
  if(lost>0){
    out.push({id:'attach',area:'產品銷售',route:'products',title:`${D.drink.n}加點率下滑，點餐時主動推薦`,
      act:`結帳前一句推薦＋「套餐加 ${Math.round(D.drink.p*.75)} 元升級飲品」，觀察一週加點率`,impact:lost*.6*md,
      basis:[`${D.drink.n}加點率 ${pct(D.attach,0)}（上週同日 ${pct(D.lwAttach,0)}）`,
        `若回到上週水準，今日可多 ${fmt((D.lwAttach-D.attach)*D.O)} 份、營收約 ${$(lost)}`,
        `飲品毛利率 ${pct(D.drink.cmRate,0)}，是全菜單最高之一`,`以回補 6 成估算，每月營收約 +${$(lost*.6*md)}`],src:'產品銷售卡｜飲品份數 ÷ 訂單數'});
  }
  if(D.offPtCost>0){
    const save=D.offPtCost*.5*22;
    out.push({id:'labor',area:'人事成本',route:'labor',title:`離峰時段在班人數偏多，平日少排 1 位兼職`,
      act:`平日 ${D.offHours.map(h=>h+'時').join('、')} 改留 1 位兼職備料，其餘改排晚餐尖峰`,impact:save,
      basis:[`離峰 ${D.offHours.length} 小時只有 ${D.offOrders} 張單`,`同時段在班合計 ${D.offStaffHours} 人時，其中兼職成本 ${$(D.offPtCost)}`,
        `減半估算，每個平日省約 ${$(D.offPtCost*.5)}，每月約 22 個平日`,`今日人事成本率 ${pct(D.laborRate)}（目標 ${pct(RULE.laborTarget,0)}）`],src:'人事成本卡｜排班 × 每小時訂單'});
  }
  if(D.deliRev>0){
    /* 價格 +10%、單量 −15%：新渠道貢獻 − 原渠道貢獻 */
    const vol=.85,newCm=D.deliRev*1.1*vol*(1-RULE.commission)-(D.chanFood[2]+D.chanPack[2])*vol;
    const up=(newCm-D.chanCm[2])*md;
    if(up>0)out.push({id:'deli',area:'外帶與外送',route:'delivery',title:`外送平台價調高 10%，反映抽成`,
      act:`外送菜單價格 +10%（多數平台允許外送價與店內價不同）`,impact:up,
      basis:[`外送營收 ${$(D.deliRev)}，平台抽成 ${pct(RULE.commission,0)} = ${$(D.commission)}`,
        `外送扣抽成、食材、包材後貢獻率 ${pct(D.deliCmRate)}（內用 ${pct(D.chanCm[0]/D.chanRev[0])}）`,
        `假設漲價後外送單量 −15%，每月渠道貢獻變化約 ${sgn(up)} 元`],src:'外帶與外送卡｜渠道貢獻'});
  }
  return out.sort((a,b)=>b.impact-a.impact).slice(0,3);
}

  ['revenue','今日營收'],['orders','訂單與客單'],['products','產品銷售'],

function countLights(){const v=Object.entries(D.lights).filter(([k])=>!['overview','ai'].includes(k)).map(x=>x[1]);

function issues(){
  const out=[];const L=D.lights;
  if(L.food!=='ok')out.push([L.food,`${D.ing.name}進價 ${sgn((D.ing.now/D.ing.base-1)*100,n=>n.toFixed(0))}%`,`今日食材多花 ${$(D.ingImpact)}`,'food']);

  if(L.revenue!=='ok')out.push([L.revenue,`營收達成 ${pct(D.achieve,0)}`,`差目標 ${$(D.target-D.rev)}`,'revenue']);
  if(L.orders!=='ok')out.push([L.orders,`營收比上週同日 ${sgn(D.vsLw*100,n=>n.toFixed(1))}%`,`單數 ${sgn(D.O-D.lwO)}、客單 ${sgn(D.ticket-D.lwTicket)}`,'orders']);
  if(L.labor!=='ok')out.push([L.labor,`離峰排班偏多${D.otStaff.length?'、有加班':''}`,`人事成本率 ${pct(D.laborRate)}`,'labor']);
  if(L.delivery==='warn'||L.delivery==='bad')out.push([L.delivery,`外送扣抽成後貢獻率 ${pct(D.deliCmRate,0)}`,`抽成 ${$(D.commission)}`,'delivery']);
  if(L.members!=='ok')out.push([L.members,`30 天回購 ${pct(D.mem.rep30,0)}`,'低於 30%','members']);
  const rank={bad:0,warn:1};return out.sort((a,b)=>rank[a[0]]-rank[b[0]]);
}

/* ---------- 圖表 ---------- */
function bars(vals,labels,opt={}){
  const W=340,H=opt.h||150,pl=30,pr=6,pt=14,pb=22;const max=Math.max(...vals.map(v=>v||0),opt.target||0,...(opt.cmp||[]).map(v=>v||0))*1.1||1;
  const n=vals.length,bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  const ticks=opt.ticks||[0,max/2,max].map(v=>Math.round(v/(opt.round||1000))*(opt.round||1000));
  ticks.forEach(t=>{if(t>max)return;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-4}" y="${y(t)+3}" text-anchor="end">${opt.tickFmt?opt.tickFmt(t):fmt(t/1000)+'k'}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw;
    if(opt.cmp&&opt.cmp[i]!=null){g+=`<rect x="${x+bw*.12}" y="${y(opt.cmp[i])}" width="${bw*.36}" height="${Math.max(0,H-pb-y(opt.cmp[i]))}" fill="var(--bar-2)" rx="2"/>`}
    if(v==null){g+=`<text x="${x+bw/2}" y="${H-pb-6}" text-anchor="middle">休</text>`}
    else{const hl=opt.hl===i;const bx=opt.cmp?x+bw*.5:x+bw*.18,bW=opt.cmp?bw*.36:bw*.64;
      g+=`<rect x="${bx}" y="${y(v)}" width="${bW}" height="${Math.max(0,H-pb-y(v))}" fill="${hl?'var(--gold-strong)':(opt.colors?opt.colors[i]:'var(--bar)')}" rx="2"/>`;
      if(opt.valLabels)g+=`<text class="lbl" x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle">${opt.valLabels(v,i)}</text>`}
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  if(opt.target){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--gold-strong)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-pr}" y="${y(opt.target)-4}" text-anchor="end" style="fill:var(--gold-ink)">目標 ${fmt(opt.target/1000)}k</text>`}
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'長條圖')}">${g}</svg>`;
}

  ${kpi('本月實際成本率（估）',pct(D.month.food/D.month.rev),'進貨 − 盤點差')}${kpi('實際 vs 理論差距',pct(RULE.wasteGap),'損耗、份量、漏記','down')}</div>

  <p class="note">只計算${ing.name}一項；其他食材以正常進價計。理論成本＝銷售份數 × 配方用量 × 進價，不含損耗。</p></div></section>

   <div class="item"><span class="ic dot warn"></span><span class="txt"><b>套餐配菜改用當季便宜蔬菜</b><span>減少${ing.name}用量，客人感受較小</span></span></div>

let laborSim=false;
function viewLabor(){
  const hrs=D.hours,open=OPEN[D.kind];const span=open[1]-open[0];
  const pctX=h=>((h-open[0])/span*100).toFixed(2)+'%';
  const simSave=D.offPtCost*.5;
  const lanes=D.staff.map(s=>`<div class="lane"><span>${esc(s.n)}<small class="note"> ${esc(s.r.replace('兼職','兼'))}</small></span><div style="position:relative;height:14px;background:var(--surface);border-radius:4px">
    ${D.offHours.map(h=>`<span style="position:absolute;left:${pctX(h)};width:calc(${pctX(h+1)} - ${pctX(h)});top:0;bottom:0;background:color-mix(in srgb,var(--warn) 18%,transparent)"></span>`).join('')}
    ${s.rg.map(([f,t])=>{let segs=[[f,t]];if(laborSim&&s.t==='pt'){segs=[];let cur=null;for(let x=f;x<t-1e-9;x+=.5){const off=D.offHours.includes(Math.floor(x));if(!off){if(cur&&Math.abs(cur[1]-x)<1e-9)cur[1]=x+.5;else{cur=[x,x+.5];segs.push(cur)}}}}
      return segs.map(([a,b])=>`<span style="position:absolute;left:${pctX(a)};width:calc(${pctX(b)} - ${pctX(a)});top:2px;bottom:2px;border-radius:3px;background:${s.t==='ft'?'var(--navy)':'var(--bar)'}"></span>`).join('')}).join('')}
    ${s.ot?`<span style="position:absolute;left:${pctX(s.rg[s.rg.length-1][1]-s.ot)};width:calc(${pctX(s.rg[s.rg.length-1][1])} - ${pctX(s.rg[s.rg.length-1][1]-s.ot)});top:2px;bottom:2px;border-radius:3px;background:var(--bad)"></span>`:''}
  </div></div>`).join('');
  const maxO=Math.max(...hrs.map(h=>h.o));
  const ordLane=`<div class="lane"><span class="note">每小時單</span><div style="position:relative;height:34px">${hrs.map(h=>`<span title="${h.h}時 ${h.o} 單" style="position:absolute;left:${pctX(h.h+.1)};width:calc(${pctX(h.h+.9)} - ${pctX(h.h+.1)});bottom:0;height:${(h.o/maxO*100).toFixed(0)}%;background:${D.offHours.includes(h.h)?'var(--warn)':'var(--bar-2)'};border-radius:2px 2px 0 0"></span>`).join('')}</div></div>
  <div class="lane"><span></span><div style="position:relative;height:14px;font-size:10px;color:var(--ink-2)" class="num">${Array.from({length:Math.floor(span/2)+1},(_,i)=>open[0]+i*2).map(h=>`<span style="position:absolute;left:${pctX(h)};transform:translateX(-50%)">${h}</span>`).join('')}</div></div>`;
  return `${header('人事成本',dateLine())}
  <section class="sec"><div class="sec-h"><h2>人事成本率 ${pct(D.laborRate)}</h2>${lightPill('labor')}</div>
  <div class="kpis">${kpi('今日人事成本',$(D.labor),`目標 ≤ ${pct(RULE.laborTarget,0)}`)}${kpi('每工時營收',$(D.salesPerHour),`${D.laborHours} 工時`)}
  ${kpi('正職（日攤）',$(D.staff.filter(s=>s.t==='ft').reduce((a,s)=>a+s.cost,0)),`${D.staff.filter(s=>s.t==='ft').length} 人，月薪 ×${RULE.ftLoad} ÷ ${RULE.ftDays} 天`)}${kpi('兼職',$(D.staff.filter(s=>s.t==='pt').reduce((a,s)=>a+s.cost,0)),`時薪 ${RULE.minWage} 元＋雇主負擔`)}</div>
  ${D.offPtCost>0?`<div class="alert warn"><b>離峰 ${D.offHours.map(h=>h+':00').join('、')} 只有 ${D.offOrders} 張單，在班 ${D.offStaffHours} 人時</b><p>其中兼職人力成本 ${$(D.offPtCost)}。正職的離峰時段多半在備料，兼職可改排到尖峰或縮短。</p></div>`:''}
  ${D.otStaff.length?`<div class="alert warn"><b>${D.otStaff.map(s=>s.n).join('、')} 今天超時 ${D.otStaff.reduce((a,s)=>a+s.ot,0)} 小時</b><p>加班費多付約 ${$(D.otCost)}（前 2 小時 ×${RULE.otMult}）。請確認是否為打烊清潔拖延。</p></div>`:''}</section>
  <section class="sec"><div class="sec-h"><h3>今日排班 × 來客</h3><div class="seg" role="group" aria-label="排班試算"><button aria-pressed="${!laborSim}" data-lsim="0">實際</button><button aria-pressed="${laborSim}" data-lsim="1">試算調整</button></div></div>
  <div class="box gantt" style="display:grid;gap:5px">${lanes}${ordLane}
  <div class="legend"><span><i style="background:var(--navy)"></i>正職</span><span><i style="background:var(--bar)"></i>兼職</span><span><i style="background:var(--bad)"></i>超時</span><span><i style="background:var(--warn)"></i>離峰</span></div>
  ${laborSim?`<div class="callout"><b>試算：兼職離峰時段不排班</b><span>每天約省 ${$(D.offPtCost)}（保守以一半 ${$(simSave)} 估），人事成本率 ${pct(D.laborRate)} → ${pct((D.labor-simSave)/D.rev)}。實際排班仍需考量備料與勞基法最低工時。</span></div>`:''}
  <p class="note">本原型不預設早、中、晚班；排班直接看每個人的上下班時間。若店家有固定班別，可在進階「營業時段分析」自訂。</p></div></section>
  <div class="btns"><button class="btn sm pri" data-addtodo="labor">把排班調整加入待辦</button></div>`;
}

function segments(){
  const P=SEG_PRESETS[D.kind];
  if(S.seg==='custom')return S.custom.map((c,i)=>[`時段 ${i+1}`,c[0],c[1]]);
  return P[S.seg]||P.two;
}
const PERIOD={day:{lab:'日',days:1,cal:1,f:{B:1,L:1,O:1,D:1}},week:{lab:'週',days:6,cal:7,f:{B:6.2,L:6.3,O:6.0,D:6.6}},month:{lab:'月',days:26,cal:30,f:{B:26.8,L:27.2,O:26,D:28.6}}};
function segCalc(){
  const segs=segments(),per=PERIOD[S.period];
  const inSeg=x=>segs.findIndex(s=>x>=s[1]-1e-9&&x<s[2]-1e-9);
  const rows=segs.map(s=>({name:s[0],from:s[1],to:s[2],rev:0,o:0,lwO:0,food:0,labor:0,attr:0,tgt:0}));
  const un={name:'未歸屬時段',rev:0,o:0,lwO:0,food:0,labor:0,attr:0,tgt:0};
  const foodRate=D.foodRate,deliShare=D.deliRev/D.rev,takeShare=D.orders[1]/D.O,deliOShare=D.orders[2]/D.O;
  const lwW=h=>h.lw*BAND_MULT[h.band];const lwTot=D.hours.reduce((a,h)=>a+lwW(h),0);
  D.hours.forEach(h=>{const f=per.f[h.band];const idx=inSeg(h.h+.01);const R=idx>=0?rows[idx]:un;
    const rv=h.rev*f,o=h.o*f;R.rev+=rv;R.o+=o;R.lwO+=h.lw*f;R.food+=rv*foodRate;
    R.attr+=rv*deliShare*RULE.commission+o*(takeShare+deliOShare)*RULE.packPerOrder+rv*RULE.payFee;R.tgt+=D.target*(lwW(h)/lwTot)*f});
  D.staff.forEach(s=>s.slots.forEach(([x,c])=>{const idx=inSeg(x);(idx>=0?rows[idx]:un).labor+=c*per.days}));
  const all=[...rows];if(un.rev>0||un.labor>0)all.push(un);
  all.forEach(r=>{r.cm=r.rev-r.food-r.labor-r.attr;r.cmTgt=r.tgt*(1-D.foodTarget)-r.labor-r.attr*(r.tgt/(r.rev||1));});
  const common={rent:D.fixed.rent*per.cal,util:D.fixed.util*per.cal,depr:D.fixed.depr*per.cal,misc:D.fixed.misc*per.cal,mkt:D.fixed.mkt*per.cal};
  const commonSum=Object.values(common).reduce((a,b)=>a+b,0);
  const cmSum=all.reduce((a,r)=>a+r.cm,0);
  return {segs,rows:all,common,commonSum,cmSum,op:cmSum-commonSum,per};
}

  {id:'S01',t:'老闆看今日戰況',d:'打開首頁 30 秒摘要與中央「經營總覽」，看營收、毛利、營業利益的差別。',go:'overview',done:'overview'},
  {id:'S02',t:'找出業績掉在哪',d:'從「訂單與客單」拆解營收差距，再到「產品銷售」找到加點率下滑。',go:'orders',done:'products'},
  {id:'S03',t:'食材成本異常',d:'「食材成本」看關鍵食材漲價影響哪些產品，拖動進價試算毛利。',go:'food',done:'food-sim'},
  {id:'S04',t:'人事成本與排班',d:'「人事成本」對照排班與每小時單數，切到「試算調整」看能省多少。',go:'labor',done:'labor-sim'},
  {id:'S05',t:'AI 經營特助提出建議',d:'看三項模擬建議，選「查看依據」、「加入待辦」或「稍後處理」。',go:'ai',done:'ai-action'}];
function markScen(key){const s=SCEN.find(x=>x.done===key);if(s&&!S.scen[s.id]){S.scen[s.id]=true;track('scenario_complete',{scenario:s.id});save()}}
function viewGuide(){
  return `${header('體驗導覽','五個情境，約 3 分鐘')}
  <section class="sec"><div class="list">${SCEN.map(s=>`<button class="item" data-scen="${s.id}"><span class="ic dot ${S.scen[s.id]?'ok':'info'}"></span><span class="txt"><b>${s.id}｜${s.t}</b><span>${s.d}</span></span><span class="go">${S.scen[s.id]?'已完成':'開始 →'}</span></button>`).join('')}</div>
  <p class="note">完成後可到「換成我的餐廳」想像自己的店，或留下 30 秒需求。</p></section>`;
}
function viewGlossary(){
  return `${header('名詞與算法','本原型的計算規則')}
  <section class="sec"><div class="box" style="display:grid;gap:6px;font-size:13px">
  <span><b>營收</b>＝顧客實付（扣折扣，不扣外送抽成）</span><span><b>理論食材成本</b>＝Σ 銷售份數 × 配方成本（含今日關鍵食材進價）</span>
  <span><b>毛利</b>＝營收 − 食材成本</span><span><b>人事成本</b>＝正職月薪 × ${RULE.ftLoad} ÷ ${RULE.ftDays} 天 ＋ 兼職時數 × ${RULE.minWage} × ${RULE.ptLoad}（超時 ×${RULE.otMult}）</span>
  <span><b>營業利益</b>＝毛利 − 人事 − 外送抽成 − 包材 − 金流 − 租金 − 水電瓦斯 − 折舊 − 雜支行銷</span>
  <span><b>實際淨利</b>＝營業利益 − 利息 − 所得稅等，月結後確定；每日畫面不顯示</span>
  <span><b>時段貢獻利益</b>＝時段營業額 − 食材 − 直接人事 − 可歸屬費用；共同費用不分攤</span></div>
  <div class="box"><h3>燈號規則</h3><div class="tbl-wrap"><table><thead><tr><th>卡片</th><th>綠</th><th>黃</th><th>紅</th></tr></thead><tbody>
  <tr><td>今日營收</td><td>達成 ≥100%</td><td>90–100%</td><td>&lt;90%</td></tr>
  <tr><td>訂單與客單</td><td>比上週 ≥−3%</td><td>−3~−10%</td><td>&lt;−10%</td></tr>
  <tr><td>產品銷售</td><td>加點率降 ≤10%</td><td>10–20%</td><td>&gt;20%</td></tr>
  <tr><td>食材成本</td><td>≤ 店型目標＊</td><td>超標 ≤1.5 點，或關鍵食材漲 ≥30%</td><td>超標 &gt;1.5 點，或漲 ≥50%</td></tr>
  <tr><td>人事成本</td><td>≤25%</td><td>25–30% 或有超時／離峰過多</td><td>&gt;30%</td></tr>
  <tr><td>外帶與外送</td><td>外送貢獻 ≥35%</td><td>25–35%</td><td>&lt;25%</td></tr>
  <tr><td>會員與回購</td><td>回購 ≥30%</td><td>25–30%</td><td>&lt;25%</td></tr>
  <tr><td>經營總覽</td><td colspan="3" style="text-align:left">取其他卡最差燈號；營業利益為負直接紅燈</td></tr></tbody></table></div><p class="note">＊食材成本率目標：鐵板熱炒 32%、小吃麵店 33%、咖啡廳 30%、便當店 38%（模擬預設，正式版由店家設定）。</p></div></section>`;
}
function viewDevlog(){
  return `${header('整合事件紀錄','MIN-003 介面預覽｜未送出')}
  <section class="sec"><div class="kpis">${kpi('模板識別碼',TEMPLATE_ID,PROTO_VER)}${kpi('推薦夥伴',esc(REF),'網址 ?ref= 參數')}</div>
  <p class="note">以下是這台裝置上記錄的體驗事件（最多 200 筆）。正式版會送到 MIN-003 追蹤後端；本原型只存在本機。</p>
  <pre class="code">${esc(S.events.slice(-30).reverse().map(e=>JSON.stringify(e)).join('\n'))||'（尚無事件）'}</pre></section>`;
}

/* ============================================================
   路由與互動
   ============================================================ */
const VIEWS={home:viewHome,revenue:viewRevenue,orders:viewOrders,products:viewProducts,food:viewFood,overview:viewOverview,labor:viewLabor,delivery:viewDelivery,members:viewMembers,ai:viewAI,
  todo:viewTodo,timeslot:viewTimeslot,amoeba:viewAmoeba,multistore:viewMultistore,mystore:viewMystore,contact:viewContact,guide:viewGuide,glossary:viewGlossary,devlog:viewDevlog};
let current='home';
function route(){const h=(location.hash||'').slice(1);return VIEWS[h]?h:'home'}
function render(keepScroll){
  current=route();
  const y=window.scrollY;
  app.innerHTML=VIEWS[current]();
  if(!keepScroll)window.scrollTo(0,0);else window.scrollTo(0,y);
  if(current==='products'||current==='overview')markScen(current);
}
function go(v){const tgt=v==='home'?'':'#'+v;const cur=location.hash==='#'?'':location.hash;if(cur===tgt)render();else location.hash=tgt}
window.addEventListener('hashchange',()=>{const v=route();if(TITLES[v])track('card_open',{card:v});render()});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function addTodo(text,from,sid){if(sid&&S.todos.find(t=>t.sid===sid))return toast('已在待辦中');S.todos.push({text,from,sid,ts:new Date().toISOString(),done:false});track('todo_add',{from,sid});save();toast('已加入明天待辦')}
const QUICK_TODO={
  food:()=>[`${D.ing.name}：${D.items.filter(i=>i.u>0).sort((a,b)=>b.u*b.qty-a.u*a.qty)[0].n} 暫調價，詢第二家報價`,'食材成本','food'],
  labor:()=>[`平日離峰 ${D.offHours.map(h=>h+'時').join('、')} 少排 1 位兼職`,'人事成本','labor'],
  members:()=>[`設計沉睡會員喚回券（${fmt(D.mem.dormant)} 人）`,'會員與回購','members']};

app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-done]');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);if(b.dataset.go==='contact'||b.dataset.go==='mystore')track('cta_click',{target:b.dataset.go,from:current});return}
  if(b.dataset.scen){const s=SCEN.find(x=>x.id===b.dataset.scen);track('scenario_start',{scenario:s.id});toast(`${s.id}：${s.t}`);go(s.go);return}
  if(b.dataset.sort){prodSort=b.dataset.sort;render(true);return}
  if(b.dataset.ov){S.ovPeriod=b.dataset.ov;save();render(true);return}
  if(b.dataset.lsim){laborSim=b.dataset.lsim==='1';if(laborSim)markScen('labor-sim');render(true);return}
  if(b.dataset.seg){S.seg=b.dataset.seg;save();render(true);return}
  if(b.dataset.period){S.period=b.dataset.period;save();render(true);return}
  if(b.dataset.addtodo){const [t,f,sid]=QUICK_TODO[b.dataset.addtodo]();addTodo(t,f,sid);render(true);return}
  if(b.dataset.ev){const el=document.getElementById('ev-'+b.dataset.ev);el.hidden=!el.hidden;b.textContent=el.hidden?'查看依據':'收起依據';track('ai_action',{action:'view_basis',sid:b.dataset.ev});markScen('ai-action');return}
  if(b.dataset.todo){const s=D.sugg.find(x=>x.id===b.dataset.todo);S.later=S.later.filter(x=>x!==s.id);addTodo(s.act,'AI 經營特助・'+s.area,s.id);track('ai_action',{action:'add_todo',sid:s.id});markScen('ai-action');render(true);return}
  if(b.dataset.later){if(!S.later.includes(b.dataset.later))S.later.push(b.dataset.later);track('ai_action',{action:'later',sid:b.dataset.later});markScen('ai-action');save();toast('已設為稍後處理');render(true);return}
  if(b.dataset.preset){myPreset=b.dataset.preset;const PP=PRESETS[myPreset];[['mfOrders',PP.defOrders,' 單'],['mfStaff',PP.defStaff,' 人']].forEach(([id,v,u])=>{document.getElementById(id).value=v;document.getElementById(id+'V').textContent=v+u});document.getElementById('mfTicket').value=0;document.getElementById('mfTicketV').textContent='店型預設';document.querySelectorAll('[data-preset]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(b.dataset.pain){const p=b.dataset.pain;fb.pains=fb.pains.includes(p)?fb.pains.filter(x=>x!==p):[...fb.pains,p];b.setAttribute('aria-pressed',fb.pains.includes(p));return}
  if(b.dataset.stores){fb.stores=b.dataset.stores;document.querySelectorAll('[data-stores]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(b.dataset.pos){fb.pos=b.dataset.pos;document.querySelectorAll('[data-pos]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  switch(b.id){
    case 'resetBtn':document.getElementById('resetConfirm').hidden=false;return;
    case 'resetNo':document.getElementById('resetConfirm').hidden=true;return;
    case 'resetYes':{const ev=S.events;S=freshState();S.events=ev;track('reset',{});D=build(S.profile);foodSimPrice=null;laborSim=false;deliMarkup=0;fb={pains:[],stores:'',pos:'',contact:'',name:'',consent:false};save();toast('已重設為預設示範店');render();return}
    case 'mfDefault':S.profile={...DEFAULT_PROFILE};D=build(S.profile);save();track('mystore_apply',{preset:'teppan',default:true});toast('已回到示範店');go('home');return;
    case 'csAdd':{const last=S.custom[S.custom.length-1];S.custom.push([Math.min(last[1],OPEN[D.kind][1]-1),Math.min(last[1]+3,OPEN[D.kind][1])]);save();render(true);return}
    case 'csDel':S.custom.pop();save();render(true);return;
    case 'fbAgain':S.feedback=null;save();render();return;
  }
});
app.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='ingRange'){foodSimPrice=+t.value;markScen('food-sim');render(true);document.getElementById('ingRange')?.focus();return}
  if(t.id==='mkRange'){deliMarkup=+t.value;render(true);document.getElementById('mkRange')?.focus();return}
  if(t.id==='mfOrders')document.getElementById('mfOrdersV').textContent=t.value+' 單';
  if(t.id==='mfTicket')document.getElementById('mfTicketV').textContent=+t.value?t.value+' 元':'店型預設';
  if(t.id==='mfStaff')document.getElementById('mfStaffV').textContent=t.value+' 人';
  if(t.id==='fbName')fb.name=t.value;
  if(t.id==='fbContact')fb.contact=t.value;
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.done!=null){S.todos[+t.dataset.done].done=t.checked;save();render(true);return}
  if(t.id==='allocChk'){S.alloc=t.checked;save();render(true);return}
  if(t.id==='fbConsent'){fb.consent=t.checked;return}
  if(t.dataset.cs){const [i,j]=t.dataset.cs.split(',').map(Number);S.custom[i][j]=+t.value;if(S.custom[i][1]<=S.custom[i][0])S.custom[i][1]=Math.min(S.custom[i][0]+.5,OPEN[D.kind][1]);save();render(true)}
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='myForm'){
    S.profile={preset:myPreset,name:document.getElementById('mfName').value.trim(),orders:+document.getElementById('mfOrders').value,ticket:+document.getElementById('mfTicket').value,staff:+document.getElementById('mfStaff').value,delivery:document.getElementById('mfDeli').checked};
    if(S.seg==='custom')S.seg='two';
    if(S.todos.length||S.later.length){S.todos=[];S.later=[]}/* 待辦屬於前一家店的模擬情境，換店型後清空 */
    D=build(S.profile);foodSimPrice=null;save();track('mystore_apply',{...S.profile,name:S.profile.name?'(set)':''});toast('已換成你的店型（模擬），待辦已清空');go('home');
  }
  if(e.target.id==='fbForm'){
    const err=document.getElementById('fbErr');
    if(!fb.pains.length){err.textContent='請至少選一個想解決的問題。';err.hidden=false;return}
    if(fb.contact&&!fb.consent){err.textContent='留下聯絡方式時，請勾選同意聯繫。';err.hidden=false;return}
    S.feedback={...fb,ts:new Date().toISOString()};track('feedback_submit',{pains:fb.pains.length,stores:fb.stores,pos:fb.pos,has_contact:!!fb.contact});save();render();
  }
});

/* 啟動 */
track('page_view',{landing:route(),ref:REF});
render();
</script>
</body></html>
