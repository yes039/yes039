<title>R-001 餐飲經營特助 G2.1-009</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 手機優先單欄 480px；首頁 3×3 九宮格＋中央深藍經營總覽；每個異常有一張六步驟決策單 */
:root{
  --bg:#FFFFFF; --surface:#F3F5F8; --card:#FFFFFF; --ink:#1E2A37; --ink-2:#5B6979; --ink-3:#8794A3;
  --line:#E0E5EB; --navy:#22344A; --navy-ink:#F3F5F8; --navy-2:#AFC0D2;
  --gold:#B8860B; --gold-strong:#C99A1E; --gold-soft:#FBF3DC; --gold-ink:#7A5A06;
  --ok:#23845A; --ok-soft:#E3F3EB; --warn:#B87500; --warn-soft:#FDF1DC; --bad:#C2412D; --bad-soft:#FBE7E3;
  --bar:#5B7896; --bar-2:#C9D3DE; --violet:#6A4FB3; --violet-soft:#EEE9F9;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171E; --surface:#18212B; --card:#1C2631; --ink:#E7ECF1; --ink-2:#A3B0BE; --ink-3:#77869A;
  --line:#2B3744; --navy:#24384F; --navy-ink:#F3F5F8; --navy-2:#A9BCD0;
  --gold:#E2B33E; --gold-strong:#E2B33E; --gold-soft:#2D2614; --gold-ink:#F0CF77;
  --ok:#4CC08A; --ok-soft:#14302A; --warn:#E8A93A; --warn-soft:#33280F; --bad:#F07560; --bad-soft:#3A1E1A;
  --bar:#7F9DBC; --bar-2:#334252; --violet:#A994F0; --violet-soft:#2A2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171E; --surface:#18212B; --card:#1C2631; --ink:#E7ECF1; --ink-2:#A3B0BE; --ink-3:#77869A;
  --line:#2B3744; --navy:#24384F; --navy-ink:#F3F5F8; --navy-2:#A9BCD0;
  --gold:#E2B33E; --gold-strong:#E2B33E; --gold-soft:#2D2614; --gold-ink:#F0CF77;
  --ok:#4CC08A; --ok-soft:#14302A; --warn:#E8A93A; --warn-soft:#33280F; --bad:#F07560; --bad-soft:#3A1E1A;
  --bar:#7F9DBC; --bar-2:#334252; --violet:#A994F0; --violet-soft:#2A2340; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:19px;font-weight:900}
h3{font-size:15px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px}
a{color:var(--gold-ink)}
code{font-size:11.5px;background:var(--surface);padding:0 4px;border-radius:4px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.top .back{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:500;flex:none}
.top .ttl{min-width:0;flex:1}
.top .ttl b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{display:block;color:var(--ink-2);font-size:11.5px}
.sim{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;color:var(--gold-ink);background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.top .menu{border:none;background:none;padding:6px;flex:none;color:var(--ink-2);font-size:12px}
.brief{margin-top:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.brief .row{display:grid;grid-template-columns:76px 1fr;gap:8px;align-items:baseline}
.brief .k{font-size:11.5px;color:var(--ink-2);font-weight:700;letter-spacing:.04em}
.brief .v{min-width:0}
.brief .v b{font-family:var(--f-num);font-size:17px}
.banner{margin-top:12px;border-radius:var(--r);padding:10px 12px;background:var(--violet-soft);color:var(--ink);font-size:12.5px;display:grid;gap:6px}
.grid9{margin-top:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{position:relative;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 9px 9px;min-height:112px;display:flex;flex-direction:column;gap:2px;transition:transform .12s ease,border-color .12s}
.tile:hover{border-color:var(--ink-3)}
.tile:active{transform:scale(.97)}
.tile .t{font-size:12.5px;font-weight:700;line-height:1.25;padding-right:14px}
.tile .v{font-family:var(--f-num);font-size:21px;font-weight:700;line-height:1.15;margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .v small{font-size:12px;font-weight:600;color:var(--ink-2)}
.tile .s{font-size:11px;color:var(--ink-2);line-height:1.35}
.tile .dot{position:absolute;top:10px;right:9px;width:10px;height:10px;border-radius:50%}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--bar)}
.tile.center{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.tile.center .s{color:var(--navy-2)}
.tile.center .t{color:var(--gold-strong)}
.tile.center .mini{display:grid;gap:1px;font-size:11px;color:var(--navy-2);margin-top:auto}
.tile.center .mini span b{font-family:var(--f-num);font-size:14px;color:var(--navy-ink);font-weight:600}
.tile.ai{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:1px}
.sec{margin-top:18px;display:grid;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec-h small{color:var(--ink-2);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.box.soft{background:var(--surface);border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:10px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--ink-2)}
.kpi .n{font-family:var(--f-num);font-size:22px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .d{font-size:11.5px}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--surface);color:var(--ink-2)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:4px;vertical-align:1px;white-space:nowrap;border:1px solid}
.tag.rule{color:var(--bar);border-color:var(--bar)} .tag.calc{color:var(--gold-ink);border-color:var(--gold)} .tag.data{color:var(--ok);border-color:var(--ok)} .tag.ai{color:var(--violet);border-color:var(--violet)} .tag.sim{color:var(--ink-3);border-color:var(--ink-3)}
.alert{border-radius:var(--r);padding:11px 13px;display:grid;gap:4px;border:1px solid}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.alert.info{background:var(--surface);border-color:var(--line)}
.alert b{font-size:13.5px}
.alert p{font-size:12.5px;color:var(--ink)}
.tbl-wrap{overflow-x:auto;margin-inline:-2px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;color:var(--ink-2);font-weight:700;letter-spacing:.03em}
td{font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;text-align:left;min-width:110px}
tr.tot td{font-weight:700;border-top:2px solid var(--ink-3)}
tr.em td{background:var(--bad-soft)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 13px;font-size:13px;font-weight:700;min-height:36px}
.btn.pri{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.gold{background:var(--gold-strong);border-color:var(--gold-strong);color:#1E2A37}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:12px;min-height:30px}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:none;border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:700;color:var(--ink-2);min-height:30px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.note{font-size:11.5px;color:var(--ink-2);line-height:1.5}
.cascade{display:grid}
.cascade .r{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
.cascade .r .n{font-family:var(--f-num);font-size:15px;font-variant-numeric:tabular-nums}
.cascade .r.sub{padding-left:12px;color:var(--ink-2);font-size:12.5px}
.cascade .r.sub .n{font-size:14px}
.cascade .r.res{border-bottom:2px solid var(--ink);font-weight:900}
.cascade .r.res .n{font-size:18px;font-weight:700}
.cascade .r.gold{background:var(--gold-soft);padding-inline:8px;border-radius:8px;border-bottom:none;margin-block:4px}
.mi{border:none;background:none;color:var(--ink-3);font-size:11px;padding:0 3px;text-decoration:underline dotted;font-weight:400}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left;width:100%}
.item .ic{width:8px;height:8px;border-radius:50%;margin-top:7px}
.item .txt{min-width:0}
.item .txt b{display:block;font-size:13.5px}
.item .txt span{font-size:12px;color:var(--ink-2)}
.item .go{color:var(--ink-3);font-size:12px;align-self:center;text-align:right}
.sugg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.sugg .hd{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.sugg .no{font-family:var(--f-num);font-weight:700;color:var(--gold-ink);font-size:13px}
.evid{background:var(--surface);border-radius:10px;padding:10px 12px;font-size:12.5px;display:grid;gap:5px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-size:10px;font-family:var(--f-num)}
.chart .lbl{fill:var(--ink);font-weight:600}
.range{width:100%}
.f{display:grid;gap:5px;font-size:12.5px;font-weight:700}
.f .h{font-weight:400;color:var(--ink-2);font-size:11.5px}
select,input[type=text],input[type=number]{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;min-height:38px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
pre.code{background:var(--surface);border-radius:10px;padding:10px;font-size:11px;overflow-x:auto;margin:0;line-height:1.45;color:var(--ink)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center}
.cta{margin-top:18px;background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.cta p{color:var(--navy-2);font-size:12.5px}
.ctas{display:grid;gap:8px}
.ctas button{display:grid;grid-template-columns:1fr auto;align-items:center;text-align:left;border:1px solid var(--navy-2);background:transparent;color:var(--navy-ink);border-radius:10px;padding:10px 12px;font-weight:700;font-size:13.5px}
.ctas button small{display:block;font-weight:400;color:var(--navy-2);font-size:11.5px}
.ctas button.gold{background:var(--gold-strong);border-color:var(--gold-strong);color:#1E2A37}
.ctas button.gold small{color:#4A3F1A}
.adv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.adv button{background:var(--surface);border:1px dashed var(--ink-3);border-radius:var(--r);padding:10px 8px;text-align:left;font-size:12.5px;font-weight:700;display:grid;gap:2px}
.adv button small{font-weight:400;color:var(--ink-2);font-size:11px}
.foot{margin-top:22px;font-size:11px;color:var(--ink-3);display:grid;gap:6px}
.callout{background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:var(--r);padding:10px 12px;font-size:12.5px;display:grid;gap:6px}
.callout b{color:var(--gold-ink)}
.gantt .lane{display:grid;grid-template-columns:70px 1fr;align-items:center;gap:6px;font-size:11.5px;min-height:20px}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check input{width:18px;height:18px;flex:none;margin-top:2px}
.done{text-decoration:line-through;color:var(--ink-3)}
.stepper{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.stepper button{border:none;background:var(--surface);border-radius:8px;padding:6px 2px;font-size:10.5px;font-weight:700;color:var(--ink-3);display:grid;gap:1px;justify-items:center;line-height:1.2}
.stepper button b{font-family:var(--f-num);font-size:14px}
.stepper button.done{background:var(--ok-soft);color:var(--ok);text-decoration:none}
.stepper button.cur{background:var(--navy);color:var(--navy-ink)}
.stepper button:disabled{cursor:default}
.opt{display:grid;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--card);text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.opt .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt ul{margin:0;padding-left:18px;font-size:11.5px;color:var(--ink-2)}
.verdict{border-radius:var(--r);padding:14px;display:grid;gap:4px;text-align:center}
.verdict.pass{background:var(--ok-soft);color:var(--ok)} .verdict.partial{background:var(--warn-soft);color:var(--warn)} .verdict.fail{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-size:18px}
.wz-prog{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px}
.wz-prog i{height:5px;border-radius:3px;background:var(--line)}
.wz-prog i.on{background:var(--gold-strong)}
.ptype{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ptype button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px;display:grid;gap:4px;min-height:96px;align-content:start}
.ptype button b{font-size:15px}
.ptype button small{font-size:11.5px;color:var(--ink-2);line-height:1.4}
.ptype button[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy)}
.plans{display:grid;gap:10px}
.plan{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;background:var(--card)}
.plan.hl{border-color:var(--gold-strong);box-shadow:0 0 0 1px var(--gold-strong)}
.plan ul{margin:0;padding-left:18px;font-size:12.5px;display:grid;gap:3px}
.plan .price{font-size:12px;color:var(--ink-2)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 24px rgba(0,0,0,.18);border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:480px;margin:0 auto;display:grid;gap:10px}
.total{background:var(--navy);color:var(--navy-ink);border-radius:var(--r);padding:14px;display:grid;gap:6px}
.total .note{color:var(--navy-2)}
/* G2.1 體驗動線 */
.demo-tag{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.demo-tag b{color:var(--ink);font-size:13.5px}
.mine-bar{margin-top:12px;border-radius:var(--r);padding:12px 14px;background:var(--violet-soft);display:grid;gap:8px}
.mine-bar b{font-size:15px}
.main-cta{margin-top:12px;display:grid;gap:6px;text-align:center}
.main-cta .btn{width:100%;padding:15px 16px;font-size:16.5px;border-radius:14px;box-shadow:0 4px 14px color-mix(in srgb,var(--gold-strong) 35%,transparent)}
.main-cta .note{font-size:12px}
.consent{margin-top:12px;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:8px}
.consent b{font-size:13.5px}
.consent p{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.more{margin-top:18px;border-top:1px solid var(--line);padding-top:4px}
.more>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-size:14px;font-weight:700;color:var(--ink)}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:'展開';font-size:12px;font-weight:400;color:var(--ink-2)}
.more[open]>summary::after{content:'收合'}
.more>summary:focus-visible{outline:2px solid var(--gold-strong);outline-offset:2px;border-radius:6px}
.link-list{display:grid;gap:8px}
.link-list .item{align-items:center;color:var(--ink);background:var(--card)}
.link-list .item .txt b{color:var(--ink)}
.link-list .item .txt span{color:var(--ink-2)}
.link-list .item .ic{margin-top:0}
.link-list .item .go{font-size:16px;color:var(--ink-2)}
.setup{margin-top:12px;border:2px solid var(--gold-strong);border-radius:var(--r);padding:14px;display:grid;gap:12px;background:var(--card)}
.setup .stepname{font-size:11.5px;color:var(--gold-ink);font-weight:700;letter-spacing:.04em}
.numrow{display:grid;gap:4px}
.numrow .top2{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:700}
.numrow .top2 span.num{font-size:20px}

function selfTest(){
  const out=[],t=(name,ok,detail='')=>out.push({name,pass:!!ok,detail}),keep={seg:S.seg,period:S.period};
  for(const id of Object.keys(PRESETS))for(const deli of [true,false]){
    const X=build({...DEFAULT_PROFILE,preset:id,delivery:deli}),tag=`${PRESETS[id].label}${deli?'':'（無外送）'}`;
    const money=[X.rev,X.food,X.gp,X.labor,X.commission,X.pack,X.pay,X.fixedSum,X.op,...X.chanRev,...X.chanFood,...X.chanCm,X.month.op,X.month.net];
    t(`${tag}：所有金額為整數`,money.every(Number.isInteger));
    t(`${tag}：品項營收 − 折扣 ＝ 營收`,X.gross-X.disc===X.rev,`${X.gross}−${X.disc}≠${X.rev}`);
    t(`${tag}：渠道營收合計 ＝ 營收`,sum(X.chanRev)===X.rev);
    t(`${tag}：毛利 ＝ 營收 − 食材`,X.gp===X.rev-X.food);
    t(`${tag}：營業利益 ＝ 毛利 − 各項費用`,X.op===X.gp-X.labor-X.commission-X.pack-X.pay-X.fixedSum);
    t(`${tag}：渠道貢獻合計 − 報廢 − 人事 − 固定 ＝ 營業利益`,sum(X.chanCm)-X.wasteFood-X.labor-X.fixedSum===X.op);
    t(`${tag}：每小時營收、單數合計一致`,sum(X.hours.map(h=>h.rev))===X.rev&&sum(X.hours.map(h=>h.o))===X.O);
    t(`${tag}：月損益恆等式`,X.month.op===X.month.gp-X.month.labor-X.month.comm-X.month.pack-X.month.pay-X.month.fixedSum&&X.month.net===X.month.pretax-X.month.tax);
    t(`${tag}：比率四捨五入到 0.1%`,[X.foodRate,X.laborRate,X.gpRate,X.opRate,X.deliCmRate,X.attach].every(v=>Math.abs(v*1000-R(v*1000))<1e-9));
    for(const seg of ['all','two','three']){S.seg=seg;S.period='day';const c=segCalc(X);t(`${tag}：時段核算（${seg}）＝ 營業利益`,c.op===X.op,`${c.op} vs ${X.op}`)}
  }
  S.seg=keep.seg;S.period=keep.period;
  const G=build({...DEFAULT_PROFILE});
  t('黃金值：示範小館品項營收 53,810（手算）',G.gross===53810);t('黃金值：內用＋外帶品項營收 38,530（手算）',G.gross-G.deliRev===38530);t('黃金值：折扣 443＝38,530 × 1.15%（外送不適用店內券）',G.disc===443);t('黃金值：營收 53,367＝53,810 − 443',G.rev===53367);
  t('黃金值：正常進價售出食材 16,985（手算）',G.soldFoodBase===16985);t('黃金值：高麗菜影響 663＝25.49 公斤 × 26 元',G.ingImpact===663);
  t('黃金值：外送抽成 15,280 × 32% ＝ 4,890',G.deliRev===15280&&G.commission===4890);
  t('外送判斷：示範小館貢獻率 33% < 35% → 注意',G.deliCmRate<.35&&G.lights.delivery==='warn');
  t('燈號與畫面一致：比率先四捨五入再判斷',G.foodRate===r3(G.food/G.rev));
  return out;
}

/* ---------- 圖表 ---------- */
function bars(vals,labels,opt={}){
  const W=340,H=opt.h||150,pl=36,pr=6,pt=14,pb=22;
  const max=Math.max(...vals.map(v=>v||0),opt.target||0,...(opt.cmp||[]).map(v=>v||0),...(opt.ticks||[]))*1.12||1;
  const n=vals.length,bw=(W-pl-pr)/n,y=v=>pt+(H-pt-pb)*(1-v/max);let g='';
  const ticks=opt.ticks||[0,max/2.24,max/1.12].map(v=>R(v/(opt.round||1000))*(opt.round||1000));
  ticks.forEach(t=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(t)+3}" text-anchor="end">${opt.tickFmt?opt.tickFmt(t):fmt(t/1000)+'k'}</text>`});
  vals.forEach((v,i)=>{const x=pl+i*bw;
    if(opt.cmp&&opt.cmp[i]!=null)g+=`<rect x="${x+bw*.12}" y="${y(opt.cmp[i])}" width="${bw*.36}" height="${Math.max(0,H-pb-y(opt.cmp[i]))}" fill="var(--bar-2)" rx="2"/>`;
    if(v==null)g+=`<text x="${x+bw/2}" y="${H-pb-6}" text-anchor="middle">休</text>`;
    else{const bx=opt.cmp?x+bw*.5:x+bw*.18,bW=opt.cmp?bw*.36:bw*.64;g+=`<rect x="${bx}" y="${y(v)}" width="${bW}" height="${Math.max(0,H-pb-y(v))}" fill="${opt.hl===i?'var(--gold-strong)':'var(--bar)'}" rx="2"/>`;
      if(opt.valLabels)g+=`<text class="lbl" x="${x+bw/2}" y="${y(v)-4}" text-anchor="middle">${opt.valLabels(v,i)}</text>`}
    g+=`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle">${labels[i]}</text>`});
  if(opt.target>0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(opt.target)}" y2="${y(opt.target)}" stroke="var(--gold-strong)" stroke-width="1.5" stroke-dasharray="4 3"/><text x="${W-pr}" y="${y(opt.target)-4}" text-anchor="end" style="fill:var(--gold-ink)">目標 ${opt.tickFmt?opt.tickFmt(opt.target):fmt(opt.target/1000)+'k'}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'長條圖')}">${g}</svg>`;
}
function niceTicks(mx){const st=mx>60?20:mx>30?10:5,o=[];for(let v=0;v<=mx;v+=st)o.push(v);return o}

function mbars(daily,v){const f=VFMT[v.fmt],isP=v.fmt.startsWith('pct'),mx=Math.max(...daily,v.target,v.before)||1;

function simulate(c,opt){
  const noise=[-.12,.06,-.04,.1,.02,-.06,.08],ramp=[.5,.75,.9,1,1,1,1];
  const rs=ramp.map((rp,i)=>Math.max(0,Math.min(1.2,opt.realize*rp*(1+noise[i])))),avgR=sum(rs.slice(3))/4;/* 驗收看第 4–7 天（上手後的穩定期） */

  const ok=v.dir==='ge'?after>=v.target:after<=v.target,half=v.before+(v.target-v.before)*.5,part=v.dir==='ge'?after>=half:after<=half;
  return {daily,after,gain,verdict:ok?'pass':part?'partial':'fail',avgR};
}

function segments(X){const P=X.P;if(S.seg==='custom')return S.custom.map((c,i)=>[`時段 ${i+1}`,c[0],c[1]]);if(S.seg==='all')return [['全日',P.open[0],P.open[1]]];return P.seg[S.seg]||P.seg.two}

function segCalc(X=D){
  const segs=segments(X),per=periodOf(X),f=per.days,n=segs.length+1;/* 最後一格＝未歸屬時段 */
  const idxOf=x=>{const i=segs.findIndex(s=>x>=s[1]-1e-9&&x<s[2]-1e-9);return i<0?n-1:i};
  const revB=Array(n).fill(0),oB=Array(n).fill(0),lwB=Array(n).fill(0),tgtW=Array(n).fill(0),laborW=Array(n).fill(0);
  X.hours.forEach(h=>{const i=idxOf(h.h+.01);revB[i]+=h.rev;oB[i]+=h.o;lwB[i]+=h.lw;tgtW[i]+=h.lw*X.P.band[h.band]});
  X.staff.forEach(s=>s.slots.forEach(z=>{laborW[idxOf(z.x)]+=z.cost}));
  const foodB=apportion(X.soldFood,revB),laborB=apportion(X.labor,laborW),commB=apportion(X.commission,revB.map(v=>v*X.deliRev/X.rev)),packB=apportion(X.pack,oB),payB=apportion(X.pay,revB),tgtB=apportion(X.target,tgtW);
  const rows=[];for(let i=0;i<n;i++){if(i===n-1&&!revB[i]&&!laborB[i])continue;
    const r={name:i<segs.length?segs[i][0]:'未歸屬時段',from:i<segs.length?segs[i][1]:null,to:i<segs.length?segs[i][2]:null,rev:revB[i]*f,o:oB[i]*f,lwO:lwB[i]*f,food:foodB[i]*f,labor:laborB[i]*f,attr:(commB[i]+packB[i]+payB[i])*f,tgt:tgtB[i]*f};

    :{waste:X.wasteFood*f,rent:R(X.fixedM.rent*per.cal/X.P.openDays),util:R(X.fixedM.util*per.cal/X.P.openDays),depr:R(X.fixedM.depr*per.cal/X.P.openDays),misc:R((X.fixedM.misc+X.fixedM.mkt)*per.cal/X.P.openDays)};

  return {segs,rows,common,commonSum,cmSum,op:cmSum-commonSum,per};
}

  const stage=has('booking_submit')?'預約洽談':(has('consult_click')||has('feedback_submit'))?'有需求':(has('feature_click')||has('task_complete'))?'已體驗':has('page_open')?'只開啟':'—';
  const recent=mine.filter(e=>Date.now()-Date.parse(e.ts)<7*864e5),hot=recent.some(e=>e.type==='task_complete')&&recent.some(e=>e.type==='consult_click');
  let attr;
  if(l.kind==='partner')attr=lead?`歸因成立：${l.partner} ${l.partnerName}（保護期 90 天；本 session 先前的匿名事件補歸到新客戶）`:`尚未成立：只開啟或試用不算推薦。客戶需透過夥伴連結留下聯絡方式並同意，才成立歸因。`;
  else if(l.kind==='customer')attr=`客戶連結：事件記在 ${l.customer}（${l.company}）名下，不涉及推薦歸因`;

  else attr='直接開啟：匿名訪客，不歸因';
  return {l,stage,hot,attr,lead}}

const ALIAS={glossary:'formulas',contact:'booking'};
function route(){let h=(location.hash||'').slice(1);h=ALIAS[h]||h;if(/^case-[a-z]+$/.test(h))return h;return VIEWS[h]?h:'home'}
let current='home';
function render(keep){current=route();const y=window.scrollY;
  app.innerHTML=current.startsWith('case-')?viewCase(current.slice(5)):VIEWS[current]();window.scrollTo(0,keep?y:0);
  if(current==='overview')markScen('S01');if(current==='products')markScen('S02');
}
function go(v){const tgt=v==='home'?'':'#'+v,cur=location.hash==='#'?'':location.hash;if(cur===tgt)render();else location.hash=tgt}
window.addEventListener('hashchange',()=>{const v=route();if(v!=='home')MIN.track('open:'+v);render()});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function addTodo(text,from,sid){if(S.todos.some(t=>t.sid===sid&&t.text===text))return;S.todos.push({text,from,sid,ts:new Date().toISOString(),done:false});save()}
function setCase(id,patch){S.cases[ckey(id)]={...cstate(id),...patch};save()}
function rebuild(){S.profile=S.showing==='mine'&&S.mine?S.mine:{...DEFAULT_PROFILE};D=build(S.profile)}
function selectText(id){const el=document.getElementById(id);if(!el)return;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.consent){MIN.consent(b.dataset.consent);toast(b.dataset.consent==='full'?'已同意記錄操作':'已選擇只看不記錄');render(true);return}
  if(!app.contains(b))return;
  if(b.dataset.metric){const id=b.dataset.metric;go('formulas');setTimeout(()=>{const el=document.getElementById('m-'+id);if(el){el.scrollIntoView({block:'center'});el.style.outline='2px solid var(--gold-strong)'}},60);return}
  if(b.dataset.cta){MIN.consult('cta_'+b.dataset.cta,{from:current});go(b.dataset.cta);return}
  if(b.dataset.go){if(b.dataset.go==='mystore'){wz=null;MIN.track('wizard:start')}go(b.dataset.go);return}
  if(b.dataset.scen){const s=SCEN.find(x=>x.id===b.dataset.scen);toast(`${s.id}：${s.t}`);if(s.go==='mystore')wz=null;go(s.go);return}
  if(b.dataset.sort){prodSort=b.dataset.sort;render(true);return}
  if(b.dataset.ov){S.ovPeriod=b.dataset.ov;save();render(true);return}
  if(b.dataset.lsim){laborSim=b.dataset.lsim==='1';if(laborSim){markScen('S04');MIN.track('labor:sim')}render(true);return}
  if(b.dataset.seg){S.seg=b.dataset.seg;save();render(true);return}
  if(b.dataset.period){S.period=b.dataset.period;save();render(true);return}
  if(b.dataset.ev){const el=document.getElementById('ev-'+b.dataset.ev);el.hidden=!el.hidden;b.textContent=el.hidden?'查看依據':'收起依據';markScen('S05');MIN.task('查看 AI 建議依據');return}
  if(b.dataset.todo){const c=getCase(b.dataset.todo);S.later=S.later.filter(x=>x!==c.id);addTodo(`處理「${c.short}」：打開決策單選方案`,'AI 經營特助',c.id);markScen('S05');MIN.track('ai:todo');toast('已加入明天待辦');render(true);return}
  if(b.dataset.later){if(!S.later.includes(b.dataset.later))S.later.push(b.dataset.later);markScen('S05');MIN.track('ai:later');save();toast('已設為稍後處理');render(true);return}
  /* 決策單 */
  if(current.startsWith('case-')){const cid=current.slice(5),c=getCase(cid),st=cstate(cid);
    if(b.dataset.cview!=null){setCase(cid,{view:+b.dataset.cview});render(true);return}
    if(b.dataset.cnext){const n=+b.dataset.cnext;setCase(cid,{stage:Math.max(st.stage,n),view:n});MIN.track(`case:${cid}:${n+1}`);render(true);return}
    if(b.dataset.cpick){setCase(cid,{pick:b.dataset.cpick});render(true);return}
    if(b.id==='cDecide'){const o=c.options.find(x=>x.id===b.dataset.pick);setCase(cid,{opt:o.id,decidedAt:new Date().toISOString(),stage:4,view:4,tasks:{},sim:null,closed:false,skipped:false});
      o.tasks.forEach(t=>addTodo(t,'決策單・'+c.short,cid));MIN.track(`case:${cid}:decide`,{opt:o.id});toast('已採用，執行事項加入待辦');render(true);return}
    if(b.id==='cSkip'){setCase(cid,{skipped:true});MIN.track(`case:${cid}:skip`);toast('已記錄暫不處理');render(true);return}
    if(b.id==='cSim'){const o=c.options.find(x=>x.id===st.opt),done=o.tasks.filter((_,i)=>st.tasks[i]).length;const sm={...simulate(c,o),assumed:done<o.tasks.length,done,total:o.tasks.length,doneTasks:o.tasks.filter((_,i)=>st.tasks[i])};setCase(cid,{sim:sm,stage:5,view:5});MIN.track(`case:${cid}:verify`,{verdict:sm.verdict});render(true);return}
    if(b.id==='cClose'){const guided=!!(S.guide&&S.guide.caseId===cid&&!S.guide.done&&isMine());setCase(cid,{closed:true});{const o=c.options.find(x=>x.id===st.opt),okT=o.tasks.filter((_,i)=>st.tasks[i]);S.todos.forEach(t=>{if(t.sid===cid&&okT.includes(t.text))t.done=true})}markScen('S03');MIN.task('完成一張決策單到數據驗收',{case:cid,verdict:st.sim&&st.sim.verdict,guided});
      if(guided){S.guide.done=true;save();MIN.track('guide:done');go('result');return}save();toast('已結案');render(true);return}
    if(b.id==='cRetry'){setCase(cid,{stage:2,view:2,opt:null,pick:null,sim:null,closed:false,tasks:{}});render(true);return}
  }
  /* 換成我的店（同頁四步） */
  if(b.dataset.wpreset){if(wz.preset!==b.dataset.wpreset){wz.preset=b.dataset.wpreset;wz.orders=0;wz.ticket=0;wz.staff=0}render(true);return}
  if(b.id==='wzBack'){wz.step--;render(true);return}
  if(b.id==='wzCancel'){wz=null;go('home');return}
  if(b.id==='wzNext'){MIN.track('wizard:step'+(wz.step+1));
    if(wz.step<3){wz.step++;render(true);return}
    const secs=Math.max(1,R((Date.now()-wz.t0)/1000));
    S.mine={preset:wz.preset,name:wz.name.trim(),orders:wz.orders,ticket:wz.ticket,staff:wz.staff,delivery:wz.delivery,custom:true,seconds:secs};
    S.showing='mine';S.todos=[];S.later=[];Object.keys(S.cases).forEach(k=>{if(k.startsWith('mine:'))delete S.cases[k]});foodSimPrice=null;laborSim=false;rebuild();
    const gc=pickGuideCase();S.guide=gc?{caseId:gc.id,done:false}:null;
    save();markScen('S06');MIN.task('產生我的九宮格',{seconds:secs,preset:wz.preset});wz=null;toast(`這是你的餐廳經營模擬（${secs} 秒）`);go('home');return}
  if(b.id==='toDemo'){S.showing='demo';rebuild();save();MIN.track('view:demo');go('home');return}
  if(b.id==='toMine'){S.showing='mine';rebuild();save();MIN.track('view:mine');go('home');return}
  if(b.id==='guideStart'){const id=b.dataset.case;S.guide={caseId:id,done:false};setCase(id,{stage:0,view:0});save();MIN.track('guide:start',{case:id});go('case-'+id);return}
  if(b.dataset.bk){const g=b.dataset.bk;if(g==='need')b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');else document.querySelectorAll(`[data-bk="${g}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));return}
  if(b.id==='lineCopy'){MIN.track('line:copy');try{navigator.clipboard.writeText('@min003demo').then(()=>toast('已複製 ID'),()=>{selectText('lineId');toast('請長按選取 ID')})}catch(err){selectText('lineId');toast('請長按選取 ID')}return}
  if(b.dataset.entry!=null){S.token=b.dataset.entry||null;S.session='s_'+rnd(8).toLowerCase();MIN._push('page_open',null,{landing:'devlog',sim_entry:true});save();toast(S.token?`以連結碼 ${S.token} 開啟（新 session）`:'直接開啟（新 session）');render(true);return}
  switch(b.id){
    default:if(b.dataset.dellead!=null){const L=S.leads[+b.dataset.dellead];if(L){S.leads.splice(+b.dataset.dellead,1);S.events=S.events.filter(e=>!(e.session_id===L.session_id&&(e.type==='feedback_submit'||e.type==='booking_submit')&&e.feature===L.cta));save();toast('已刪除這筆模擬資料');render(true)}return}
  }
  switch(b.id){
    case 'wipeBtn':document.getElementById('wipeConfirm').hidden=false;return;
    case 'wipeNo':document.getElementById('wipeConfirm').hidden=true;return;
    case 'wipeYes':{try{localStorage.removeItem(STORE_KEY)}catch(e){}S=freshState();rebuild();wz=null;foodSimPrice=null;laborSim=false;deliMarkup=0;toast('已清除這台手機上的資料');go('home');return}
    case 'resetBtn':document.getElementById('resetConfirm').hidden=false;return;
    case 'resetNo':document.getElementById('resetConfirm').hidden=true;return;
    case 'resetYes':{const keep={events:S.events,consent:S.consent,session:S.session,token:S.token,leads:S.leads,showing:'demo',mine:null,guide:null};S=Object.assign(freshState(),keep);rebuild();foodSimPrice=null;laborSim=false;deliMarkup=0;wz=null;save();toast('已重設為預設示範店');go('home');return}
    case 'csAdd':{const last=S.custom[S.custom.length-1],P=D.P;S.custom.push([Math.min(last[1],P.open[1]-1),Math.min(last[1]+3,P.open[1])]);save();render(true);return}
    case 'csDel':S.custom.pop();save();render(true);return;
  }
});
const valTracked={};
app.addEventListener('input',e=>{const t=e.target;
  if(t.id==='ingRange'){foodSimPrice=+t.value;MIN.track('food:sim');render(true);document.getElementById('ingRange')?.focus();return}
  if(t.id==='mkRange'){deliMarkup=+t.value;MIN.track('delivery:sim');render(true);document.getElementById('mkRange')?.focus();return}
  const vmap={vFood:'food',vTicket:'ticket',vOrders:'orders',vHours:'hours'};
  if(vmap[t.id]){S.value[vmap[t.id]]=+t.value;save();markScen('S07');if(!valTracked[t.id]){valTracked[t.id]=1;MIN.track('value:'+vmap[t.id])}render(true);document.getElementById(t.id)?.focus();return}
  const wmap={wzO:['orders',' 單'],wzT:['ticket',' 元'],wzS:['staff',' 人']};
  if(wmap[t.id]&&wz){const [k,u]=wmap[t.id];wz[k]=+t.value;const lab=document.getElementById(t.id+'V');if(lab)lab.textContent=t.value+u;return}
  if(t.id==='wzName'&&wz){wz.name=t.value;return}
});
app.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.done!=null){S.todos[+t.dataset.done].done=t.checked;save();render(true);return}
  if(t.dataset.ctask!=null){const cid=current.slice(5),st=cstate(cid);setCase(cid,{tasks:{...st.tasks,[t.dataset.ctask]:t.checked}});render(true);return}
  if(t.id==='allocChk'){S.alloc=t.checked;save();render(true);return}
  if(t.id==='wzDeli'){wz.delivery=t.checked;return}
  if(t.dataset.cs){const [i,j]=t.dataset.cs.split(',').map(Number);S.custom[i][j]=+t.value;if(S.custom[i][1]<=S.custom[i][0])S.custom[i][1]=Math.min(S.custom[i][0]+.5,D.P.open[1]);save();render(true)}
});
app.addEventListener('submit',e=>{e.preventDefault();const f=e.target,cta=f.dataset.lead;if(!cta)return;
  const v=id=>((document.getElementById(`lf-${cta}-${id}`)||{}).value||'').trim(),ok=document.getElementById(`lf-${cta}-ok`).checked,err=document.getElementById(`lf-${cta}-err`),contact=v('contact');
  if(!contact){err.textContent=cta==='booking'?'預約需要聯絡方式，商務專人才能和你約時間。':'請留下 LINE ID 或 Email，摘要才寄得到。';err.hidden=false;return}
  if(!ok){err.textContent='留下聯絡方式時，請勾選同意聯繫。';err.hidden=false;return}
  const picks=g=>[...f.querySelectorAll(`[data-bk="${g}"][aria-pressed="true"]`)].map(x=>x.dataset.v);
  const payload={cta,template_id:TEMPLATE_ID,product:PRODUCT,ver:VER,session_id:S.session,token:S.token,submitted_at:new Date().toISOString(),
    profile_preset:D.id,store_profile:{preset:D.id,orders_per_day:D.O,ticket:D.T,staff:D.staff.length,delivery:D.deli,custom:isMine()},
    want_custom:cta==='report'?'領取體檢摘要':'預約專人診斷',top_issues:openCases().slice(0,3).map(c=>c.id),
    booking:cta==='booking'?{way:picks('way'),time:picks('time'),need:picks('need')}:undefined,
    contact:{name:v('name')||null,value:contact,consent:ok},
    journey:{scenarios_done:Object.keys(S.scen).filter(k=>S.scen[k]),cases_closed:Object.values(S.cases).filter(x=>x.closed).length},
    delivery:{mode:SUBMIT_MODE,sent:false,note:'G2.1-009 驗收版：只存在本機，未送出至 MIN-003 商機中心'},
    crm_preview:{stage:cta==='booking'?'預約洽談':'有需求',notify:'NOT_SENT_PROTOTYPE'}};
  MIN.submit(cta==='booking'?'booking_submit':'feedback_submit',payload);markScen('S08');toast('已存在這台手機（模擬，未送出）');render(true);
});

/* 啟動 */
MIN.pageOpen();
render();
</script>
