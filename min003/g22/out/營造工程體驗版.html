<title>營造工程體驗版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: top bar with six views, nine-grid first; boss view sits in a phone frame on wide screens; detail opens in a side drawer (bottom sheet on phones) */
:root{
  --bg:#eef1f4; --surface:#ffffff; --sunk:#f5f7f9; --ink:#1c2632; --muted:#5a6776; --line:#d6dde5;
  --vest:#f4b400; --vest-soft:#fff3cc; --vest-ink:#1c2632;
  --blue:#1d5ea6; --blue-soft:#e3eefb;
  --red:#c0352b; --red-soft:#fbe4e2; --amber:#a86200; --amber-soft:#fcefd6; --green:#2b7a4b; --green-soft:#e1f2e8; --grey:#8b96a3; --grey-soft:#eceff2;
  --line-green:#06c755;
  --display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e5eaf0; --muted:#98a5b3; --line:#2a3440;
  --vest:#f4b400; --vest-soft:#3a3010; --vest-ink:#1c2632; --blue:#82b3ec; --blue-soft:#1d2d42;
  --red:#f07b72; --red-soft:#3a1c1a; --amber:#e6a94f; --amber-soft:#352812; --green:#6cc290; --green-soft:#183025; --grey:#7d8a98; --grey-soft:#222b35;
  --line-green:#2fd27a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --sunk:#141b22; --ink:#e5eaf0; --muted:#98a5b3; --line:#2a3440;
  --vest:#f4b400; --vest-soft:#3a3010; --vest-ink:#1c2632; --blue:#82b3ec; --blue-soft:#1d2d42;
  --red:#f07b72; --red-soft:#3a1c1a; --amber:#e6a94f; --amber-soft:#352812; --green:#6cc290; --green-soft:#183025; --grey:#7d8a98; --grey-soft:#222b35;
  --line-green:#2fd27a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
h1{font-family:var(--display);font-weight:400;font-size:22px;margin:0;white-space:nowrap}
h1 .tape{background:var(--vest);color:var(--vest-ink);padding:0 .25em;border-radius:4px}
.demo{font-size:12px;color:var(--amber);background:var(--amber-soft);border-radius:999px;padding:2px 10px;white-space:nowrap}
nav.views{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 320px;min-width:0}
.vbtn{flex:0 0 auto;border:0;background:none;color:var(--muted);font:inherit;font-weight:500;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.vbtn[aria-current="page"]{background:var(--ink);color:var(--surface)}
main .wrap{padding-block:18px 64px}
h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0}
h3{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.lede{color:var(--muted);font-size:14px;margin:0 0 14px;max-width:62ch}
button{font:inherit}
.btn{border:0;border-radius:9px;padding:7px 14px;font-weight:700;cursor:pointer;background:var(--vest);color:var(--vest-ink);white-space:nowrap}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=text],textarea,select{border:1.5px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:9px;padding:7px 10px;font:inherit;min-width:0;width:100%}
textarea{resize:vertical;min-height:70px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;white-space:nowrap}
.pill.red{background:var(--red-soft);color:var(--red)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.grey{background:var(--grey-soft);color:var(--grey)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
.dot.red{background:var(--red)} .dot.amber{background:var(--amber)} .dot.green{background:var(--green)} .dot.grey{background:transparent;border:2px dashed var(--grey)}
.src{border:0;background:none;color:var(--blue);cursor:pointer;padding:0;font-size:13px;text-decoration:underline;text-underline-offset:2px}
.prov{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
.prov.ai{background:var(--blue-soft);color:var(--blue)} .prov.human{background:var(--green-soft);color:var(--green)} .prov.rule{background:var(--grey-soft);color:var(--muted)}

/* boss view */
.bosslay{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.bosslay{grid-template-columns:1fr}.phone-notes{display:none}}
.phone{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:16px 14px 18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(20,30,40,.08)}
@media (max-width:860px){.phone{border-radius:var(--r);box-shadow:none}}
.ph-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ph-head b{font-family:var(--display);font-weight:400;font-size:19px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:8px 10px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:center}
.item{border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:flex;flex-direction:column;gap:6px;border-left-width:4px}
.item.red{border-left-color:var(--red)} .item.amber{border-left-color:var(--amber)} .item.grey{border-left-color:var(--grey)}
.item-t{font-weight:700}
.item-m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.handle{display:flex;gap:6px}
.lights{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.light{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:var(--ink)}
.light b{font-family:var(--display);font-weight:400;font-size:18px}
.light small{font-size:11px;color:var(--muted)}
.phone-notes{display:flex;flex-direction:column;gap:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.note p{margin:6px 0 0;font-size:14px;color:var(--muted)}
.empty-s{font-size:13px;color:var(--muted);padding:4px 2px}

/* overview */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer} tr.r:hover td{background:var(--sunk)}
tr.r.unrep td{color:var(--muted)}
td.num{font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--grey-soft);border-radius:3px;overflow:hidden;margin-top:4px;width:80px}
.bar i{display:block;height:100%;background:var(--blue)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
@media (max-width:640px){.drawer{top:auto;left:0;width:100%;max-height:86%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding-left:env(safe-area-inset-left,0px)}}
.dr-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-b{overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px}
.x{border:0;background:var(--sunk);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px;line-height:1}
.msg{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:14px}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.fields{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.fld{display:grid;grid-template-columns:88px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.fld:last-child{border-bottom:0}
.fld span:first-child{color:var(--muted);font-size:13px}
.fld .edit-row{grid-column:1/-1;display:flex;gap:6px}
.hist{font-size:13px;color:var(--muted);margin:0;padding-left:18px}

/* report (LINE mock) */
.replay{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.replay{grid-template-columns:1fr}}
.chat{background:#8fa8c4;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
:root[data-theme="dark"] .chat{background:#2a3a4d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chat{background:#2a3a4d}}
.chat-h{background:var(--surface);padding:10px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.chat-b{padding:12px;display:flex;flex-direction:column;gap:10px;min-height:300px;max-height:460px;overflow-y:auto}
.bub{max-width:85%;border-radius:16px;padding:8px 12px;font-size:14px;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:#c6f3a8;color:#1c2632}
.bub.bot{align-self:flex-start;background:var(--surface);color:var(--ink)}
.ccard{align-self:flex-start;background:var(--surface);color:var(--ink);border-radius:14px;padding:10px 12px;width:88%;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ccard .row2{display:grid;grid-template-columns:52px 1fr;gap:6px}
.ccard .row2 span:first-child{color:var(--muted)}
.chat-in{background:var(--surface);padding:10px;display:flex;flex-direction:column;gap:8px}
.menu4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.menu4 button{border:1px solid var(--line);background:var(--sunk);color:var(--ink);border-radius:8px;padding:6px 2px;font-size:12px;cursor:pointer}
.sendrow{display:flex;gap:6px;align-items:flex-end}
.sendrow textarea{min-height:44px}
.sendbtn{background:var(--line-green);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}

/* issues */
.isslay{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.isslay{grid-template-columns:1fr}}
.ilist{display:flex;flex-direction:column;gap:8px}
.ilist .item{cursor:pointer;background:var(--surface)}
.ilist .item[aria-current="true"]{outline:2px solid var(--blue)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.flow{display:flex;gap:4px;flex-wrap:wrap}
.flow button{border:1.5px solid var(--line);background:var(--sunk);color:var(--muted);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.flow button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.log{display:flex;flex-direction:column;gap:6px;font-size:14px}
.log div{background:var(--sunk);border-radius:8px;padding:6px 10px}
.log time{color:var(--muted);font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}
.warnline{font-size:13px;color:var(--red)}

/* nine grid */
.nine{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;color:var(--ink);cursor:pointer;min-width:0;overflow:hidden;border-top:6px solid var(--grey)}
.tile.red{border-top-color:var(--red)} .tile.amber{border-top-color:var(--amber)} .tile.green{border-top-color:var(--green)} .tile.grey{border-top-style:dashed;background:var(--sunk)}
.tile:hover{border-color:var(--ink)}
.t-top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.t-id{font-family:var(--display);font-size:30px;line-height:1}
.t-name{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-prog{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:700}
.t-prog .bar{flex:1;width:auto;margin:0;height:8px;border-radius:4px}
.t-lines{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:0}
.t-lines div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-lines .k{color:var(--muted)}
.t-badges{display:flex;gap:4px;flex-wrap:wrap}
.hub{background:var(--ink);color:var(--surface);border:0;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hub h2{font-size:18px;color:var(--surface)}
.hub .hk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hub .hk div{background:rgba(255,255,255,.08);border-radius:8px;padding:6px 8px}
.hub .hk span{display:block;font-size:11px;opacity:.75}
.hub .hk b{font-size:20px;font-variant-numeric:tabular-nums}
.hub .hk b.alert{color:var(--vest)}
.hub .btn{align-self:stretch}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
@media (max-width:640px){
 .nine{gap:6px}
 .tile{padding:8px 8px 7px;gap:5px;border-top-width:5px}
 .t-id{font-size:22px} .t-name,.t-lines .opt,.hub .btn,.hub .sub{display:none}
 .t-prog{font-size:13px;gap:5px} .t-prog .bar{height:6px}
 .t-lines{font-size:11px}
 .t-top .pill{font-size:10px;padding:0 6px}
 .hub{padding:8px;gap:6px} .hub h2{font-size:14px}
 .hub .hk{grid-template-columns:1fr;gap:3px} .hub .hk div{padding:2px 6px} .hub .hk span{font-size:10px} .hub .hk b{font-size:14px}
}

/* summary */
.sumcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 14px;max-width:640px;display:flex;flex-direction:column;gap:14px}
.sumcard h4{margin:0;font-size:15px}
.sumcard ol,.sumcard ul{margin:4px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.sumcard .foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:760px){.six{gap:6px}}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink);cursor:pointer;min-width:0;border-top:6px solid var(--grey)}
.blk:hover{border-color:var(--ink)}
.blk.red{border-top-color:var(--red)} .blk.amber{border-top-color:var(--amber)} .blk.green{border-top-color:var(--green)}
.blk.decide{background:var(--ink);color:var(--surface);border-color:var(--ink);border-top-color:var(--vest)}
.blk.decide .muted,.blk.decide h3{color:var(--surface);opacity:.75}
.b-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.b-big{font-family:var(--display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.b-big small{font-family:var(--body);font-size:13px;margin-left:4px}
.b-lines{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.b-lines div{display:flex;gap:6px;align-items:center;min-width:0}
.b-lines .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.b-more{font-size:12px;color:var(--blue);margin-top:auto}
.blk.decide .b-more{color:var(--vest)}
.pv{display:grid;grid-template-columns:28px 1fr;gap:6px;align-items:center;font-size:12px}
.b-lines .pv{display:grid}
.pvbar{display:block;position:relative;height:8px;background:var(--grey-soft);border-radius:4px}
.pvbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--blue)}
.pvbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.tag{font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;background:var(--grey-soft);color:var(--muted);white-space:nowrap}
@media (max-width:900px){.b-lines .opt{display:none}}
@media (max-width:760px){
 .blk{padding:8px;gap:4px;border-top-width:5px}
 .blk h3{font-size:11px;letter-spacing:0}
 .b-big{font-size:22px}
 .b-big small{display:block;font-size:10px;margin:2px 0 0}
 .b-lines,.b-more{display:none}
 .lede{font-size:13px}
}
@media (max-width:640px){
 .gridlede{display:none}
 .six{aspect-ratio:9/16;grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
 .blk{overflow:hidden;gap:6px}
 .blk h3{font-size:12px}
 .b-big{font-size:24px}
 .b-lines{display:flex;font-size:11px;gap:5px}
 .b-lines .opt,.b-lines .tag{display:none}
 .b-lines .pill{font-size:10px;padding:0 6px}
 .pv{grid-template-columns:14px 1fr;gap:4px;font-size:11px}
 .pvbar{height:6px}
 .b-more{display:block;font-size:11px}
}
.row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-left-width:4px}
.row.red{border-left-color:var(--red)} .row.amber{border-left-color:var(--amber)} .row.green{border-left-color:var(--green)} .row.grey{border-left-color:var(--grey)}
.row .t{font-weight:700}
.row .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dnote{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px;margin:0}
.tb{overflow-x:auto}
.tb table{min-width:420px;font-size:13px}
.tb th{padding:6px 8px;background:none}
.tb td{padding:7px 8px}
td.r,th.r{text-align:right}


/* ===== G2.2 體驗層：模式標示、換成我的公司、情境／特助／試算／下一步（類別一律 x 開頭，避免和原 Demo 衝突） ===== */
:root{--violet:#5b4bb7;--violet-soft:#ece9fb;--mine:#1d5ea6;--mine-soft:#e3eefb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--violet:#a99cf0;--violet-soft:#27223f;--mine:#82b3ec;--mine-soft:#1d2d42}}
:root[data-theme="dark"]{--violet:#a99cf0;--violet-soft:#27223f;--mine:#82b3ec;--mine-soft:#1d2d42}

const CN={一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,兩:2};
function parse(t){
  const p={raw:t}; const sm=t.match(/([甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉])\s*案/); p.p=sm&&proj(sm[1])?sm[1]:null;
  const w=t.match(/(晴|陰|雨)/); if(w) p.weather=w[1];
  const crews=[...t.matchAll(/([一-龥]{2,4}?)(\d+)\s*人/g)].map(m=>m[1].replace(/^(天|晴天|陰天|雨天|昨天|今天)/,"")+" "+m[2]); if(crews.length) p.crew=crews.join("、");
  const eq=t.match(/(吊車|挖土機|怪手|泵浦車|堆高機)[一二三四五六七八九十\d]台/)||t.match(/(吊車|挖土機|怪手|泵浦車|堆高機)(?!司機)/); if(eq) p.equip=eq[0];
  const tm=t.match(/明天([^，。,]+)/); if(tm) p.tomorrow=tm[1];
  if(/決議/.test(t)) {p.kind="會議決議"; p.action=t.replace(/^.*?決議[：:]?/,"")}
  else if(/改善|已經全部|補好/.test(t)) {p.kind="改善完成"}
  else if(/鬆脫|停用|缺失|沒有拉|未設|漏|裂|倒/.test(t)) {p.kind="異常缺失"; p.issue=t.replace(/^[甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉]\s*案/,"").split(/[，。]/).slice(0,2).join("，")}
  else {p.kind="工程日報"; const parts=t.split(/[，,。]/).filter(x=>!/晴|陰|雨|\d+\s*人|吊車|明天|^\S*案$/.test(x)||/吊裝|組立|澆置|綁紮|砌/.test(x)); p.done=(parts.find(x=>/吊裝|組立|澆置|綁紮|砌|施作|完成|收尾/.test(x))||parts[0]||"（未寫）").replace(/^[甲乙丙丁戊己庚辛壬癸子丑寅卯辰巳午未申酉]案(昨天|今天)?/,"").trim()}
  return p;
}
function commit(p){
  const now="08:"+String(30+S.seq).padStart(2,"0"), mid="M-X"+S.seq, pr=proj(p.p);
  S.msgs[mid]={p:p.p,who:pr.lead,time:"10/28 "+now,kind:"文字（示範）",text:p.raw};
  if(p.kind==="工程日報"){
    S.reports[p.p]={id:"DR-1027-"+p.p,time:"10/28 "+now+"（補交）",src:mid,f:{weather:[p.weather||"",p.weather?"ai":"rule"],crew:[p.crew||"",p.crew?"ai":"rule"],done:[p.done||"",p.edited?"human":"ai"],equip:[p.equip||"—",p.equip?"ai":"rule"],tomorrow:[p.tomorrow||"",p.tomorrow?"ai":"rule"]},hist:[]};
    delete S.reminded[p.p];
  }
  if(p.kind==="異常缺失") S.issues.push({id:`Q-1028-${p.p}${S.seq}`,p:p.p,type:/鷹架|吊|警戒|開口|護欄|墜/.test(p.raw)?"工安":"品質",title:p.issue,owner:pr.lead,due:"10/30",status:"新開",src:mid,log:[],hist:["類型與期限：AI 建議，待工務確認"]});
  if(p.kind==="會議決議") S.actions.push({id:"A"+(S.actions.length+1),p:p.p||"甲",text:p.action,who:pr.lead,due:"10/31",done:false});
  if(p.kind==="改善完成"){ const q=S.issues.find(i=>i.p===p.p&&i.status!=="結案"); if(q){ q.status="待確認"; q.log.push(["10/28 "+now,pr.lead,p.raw]); q.hist.push(`狀態→待確認（主任 LINE 回報改善，10/28 ${now}）`) } }
  S.seq++;
}

/* ---------- 情境流程（異常 → 原因 → 建議 → 決策 → 派工 → 驗果） ---------- */
const STEPS=["異常","原因","建議","決策","派工","驗果"];
function scenBody(){
  const sc=XP.scen, M=MOD(), m=M.model(XP.inp,{...XP.resolved,[sc.id]:false},XP.asm), Sx=M.scenarios[sc.id], d=Sx.build(m,XP.asm);
  const o=d.options.find(x=>x.id===sc.choice), m2=o?M.model(XP.inp,{...XP.resolved,[sc.id]:o.id},XP.asm):null;
  sc.demo=!NEED[sc.id](m);
  const blocks=[
   `<div class="xcard" style="border-left:5px solid var(--red)"><h3>① 異常</h3><b>${esc(d.anomaly)}</b><div style="display:flex;flex-direction:column;gap:6px">${d.evidence.map(e=>`<div class="xmsg"><div class="xwho">${esc(e[0])}</div>${esc(e[1])}${e[2]?"・"+esc(e[2]):""}</div>`).join("")}</div></div>`,
   `<div class="xcard"><h3>② 可能原因（依規則排序）</h3><ol style="margin:0;padding-left:20px">${d.causes.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>`,
   `<div class="xcard"><h3>③ 建議方案</h3>${d.options.map(x=>`<button class="xopt" data-opt="${x.id}" aria-pressed="${sc.choice===x.id}"><b>${esc(x.t)}</b><small>${esc(x.c)}・預期：${esc(x.eff)}</small></button>`).join("")}<span class="xrule" style="align-self:flex-start">規則式模擬建議</span></div>`,
   o?`<div class="xcard"><h3>④ 老闆決策</h3><b>你選擇：${esc(o.t)}</b><span class="small muted">正式版會記下決策時間與內容，之後可回頭看效果（本版不保存）。</span></div>`:"",
   o&&sc.step>=4?(()=>{const t=d.dispatch(o);return `<div class="xcard"><h3>⑤ 派工</h3><div class="xkv"><span>負責</span><span>${esc(t.who)}</span><span>工作</span><span>${esc(t.what)}</span><span>期限</span><span>${esc(t.due)}</span></div><span class="small muted">正式版會用 LINE 通知負責人，到期未完成會提醒（本版不發送）。</span></div>`})():"",
   o&&sc.step>=5?(()=>{const v=d.verify(o,m2);return `<div class="xcard" style="border-left:5px solid var(--green)"><h3>⑥ 驗果</h3><p style="margin:0">${esc(v.text)}</p><div class="xcmp">${v.before.map((b,i)=>`<div><span>${esc(b[0])}</span><b>${esc(String(b[1]))} → ${esc(String(v.after[i][1]))}</b></div>`).join("")}</div></div>`})():""];
  return `<div class="xsteps">${STEPS.map((x,i)=>`<span class="xstep ${i<sc.step?"ok":i===sc.step?"on":""}">${x}</span>`).join("")}</div>
   ${sc.demo?`<p class="xnote" style="border-left:4px solid var(--amber)">你輸入的條件目前沒有這個問題，下面用示範數字走一遍流程，儀表板不會改變。</p>`:""}<div class="xflow">${blocks.slice(0,Math.min(sc.step+1,6)).join("")}</div>
   <div style="display:flex;gap:8px;flex-wrap:wrap">${sc.step<2?`<button class="btn" data-next="1">下一步：${STEPS[sc.step+1]}</button>`:sc.step===2?`<button class="btn" data-next="1" ${sc.choice?"":"disabled"}>${sc.choice?"確定這個決策":"先選一個方案"}</button>`:sc.step<5?`<button class="btn" data-next="1">下一步：${STEPS[sc.step+1]}</button>`:`<button class="btn" data-scenclose="1">完成，回到儀表板</button><button class="btn ghost" data-conv="booking">想用在我的公司</button>`}</div>`;
}

function drawCard(){
  const D=cardData(), W=1080, H=1700, c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const FN='"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif', font=(w,px)=>g.font=`${w} ${px}px ${FN}`;
  const COL={red:"#c8402f",amber:"#c98a12",green:"#2f8a4e",hub:"#2c5fa8"};
  const rr=(x,y,w,h,r,fill)=>{g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h); g.fillStyle=fill; g.fill()};
  const wrap=(t,x,y,maxW,lh,maxL)=>{const L=[];let line="";for(const ch of t){if(line&&g.measureText(line+ch).width>maxW){L.push(line);line=ch}else line+=ch} if(line) L.push(line);
   const out=L.slice(0,maxL); if(L.length>maxL){let l=out[maxL-1]; while(l&&g.measureText(l+"…").width>maxW) l=l.slice(0,-1); out[maxL-1]=l+"…"} out.forEach((l,n)=>g.fillText(l,x,y+n*lh)); return out.length};
  g.fillStyle="#f5f3ee"; g.fillRect(0,0,W,H);
  g.fillStyle="#1f2a44"; g.fillRect(0,0,W,210);
  g.fillStyle="#c9d3e6"; font(600,32); g.fillText(`體驗成果卡｜${D.ind}`,60,72);
  g.fillStyle="#fff"; font(800,54); wrap(D.title,60,150,W-120,60,1);
  const bw=(W-60*2-24)/2, bh=210;
  D.tiles.forEach((t,n)=>{const x=60+(n%2)*(bw+24), y=250+Math.floor(n/2)*(bh+24); rr(x,y,bw,bh,22,"#fff"); g.fillStyle=COL[t.cls]||"#555"; g.fillRect(x,y+24,8,bh-48);
   g.fillStyle="#555"; font(600,30); g.fillText(t.h,x+36,y+60); g.fillStyle=COL[t.cls]||"#222"; font(800,68); wrap(String(t.big),x+36,y+142,bw-60,70,1); g.fillStyle="#666"; font(500,28); wrap(t.unit,x+36,y+184,bw-60,30,1)});
  let y=770; g.fillStyle="#1f2a44"; font(800,36); g.fillText("今日最重要的三件事",60,y); y+=20;
  D.top.forEach((t,n)=>{y+=56; g.fillStyle="#2c5fa8"; font(800,32); g.fillText(String(n+1),60,y); g.fillStyle="#222"; font(500,30); y+=(wrap(t,104,y,W-170,42,2)-1)*42});
  y+=80; g.fillStyle="#1f2a44"; font(800,36); g.fillText("改善試算（估算）",60,y);
  D.sim.forEach(r=>{y+=54; g.fillStyle="#444"; font(500,30); wrap(r[0],60,y,W-420,40,1); g.fillStyle="#222"; font(800,32); g.textAlign="right"; g.fillText(r[1],W-60,y); g.textAlign="left"});
  y+=66; g.fillStyle="#555"; font(600,28); g.fillText(`情境體驗：完成 ${D.done}／3`,60,y);
  y+=40; g.fillStyle="#e7e3da"; g.fillRect(0,y,W,120); g.fillStyle="#666"; font(500,24);
  g.fillText("模擬體驗：數字依輸入條件產生，不是實際營運資料；建議為規則式模擬。",60,y+50);
  g.fillText(`${D.code?"體驗編號 "+D.code+"・":""}${D.date}`,60,y+86);
  /* 依內容裁切高度，避免文字換行時壓到頁尾 */
  const out=document.createElement("canvas"); out.width=W; out.height=y+120; out.getContext("2d").drawImage(c,0,0); return out;
}
function getDL(){ if(!getDL.p) getDL.p=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use("downloads")).catch(()=>null):Promise.resolve(null); return getDL.p }
function showCard(){const c=drawCard(); const img=$("#cardImg"); if(img) img.src=c.toDataURL("image/png"); showCard.c=c;
  getDL().then(dl=>{const b=$("#cardSave"); if(dl&&b) b.hidden=false})}

/* ---------- 體驗區抽屜（與原 Demo 抽屜分開） ---------- */
function xRenderDrawer(){
  const d=XP.xdrawer, L=$("#xlayer"); if(!d){L.innerHTML="";return}
  let h="",b="";
  if(d.kind==="scen"){const Sx=MOD().scenarios[XP.scen.id]; h=`${XP.scen.id}｜${Sx.title}`; b=scenBody()}
  if(d.kind==="conv"){h={card:"我的體驗成果卡",line:"LINE 官方帳號",booking:"預約真實導入示範"}[d.k]; b=convBody(d.k)}
  L.innerHTML=`<div class="scrim" data-xclose="1"></div><aside class="drawer xdrawer" role="dialog" aria-label="${esc(h)}"><div class="dr-h"><h2 style="font-size:18px">${esc(h)}</h2><button class="x" data-xclose="1" aria-label="關閉">×</button></div><div class="dr-b" id="xdrb">${b}</div></aside>`;
  if(d.kind==="conv"&&d.k==="card") showCard();
}

/* ---------- 觀察紀錄（只存在這個畫面） ---------- */
function obsText(){
  const ev=XP.events.filter(e=>e.ok).slice().reverse(), cnt=t=>ev.filter(e=>e.type===t).length;
  const first=ev[0], mine=ev.find(e=>e.type==="mode_mine"), last=ev[ev.length-1];
  const tally=type=>{const o={}; ev.filter(e=>e.type===type).forEach(e=>{const n=(e.mode==="mine"?"我的・":"Demo・")+ADAPT.label(e.data); o[n]=(o[n]||0)+1}); return Object.entries(o).map(([n,c])=>`${n}×${c}`).join("、")||"—"};
  return `體驗觀察摘要（只含同意記錄的操作；未同意時只有開啟與主動按下的意願）\n體驗編號：${XP.code||"無"}・來源：${SRC[XP.source].label}\n同意選擇：${XP.consent||"尚未選擇"}\n`+
   `開始到換成我的公司：${first&&mine?Math.round((mine.ms-first.ms)/1000)+" 秒":"—"}；體驗總時間：${first&&last?Math.round((last.ms-first.ms)/1000)+" 秒":"—"}\n`+
   `看過的畫面：${tally("view_open")}\n點開的細節：${tally("detail_open")}\n`+
   `調整條件 ${cnt("customize")} 次・改善試算 ${cnt("simulator_use")} 次・特助派工 ${cnt("assistant_dispatch")} 次・回到 Demo ${cnt("mode_demo")} 次\n`+
   `完成情境：${ev.filter(e=>e.type==="scenario_complete").map(e=>{const id=e.data; return `${id} ${MOD().scenarios[id].title}`}).join("、")||"—"}\n`+
   `成果卡：開啟 ${cnt("card_open")}・下載 ${cnt("card_save")}・複製文字 ${cnt("summary_request")}\n`+
   `意願：預約示範 ${cnt("booking_intent")}・LINE 有興趣 ${cnt("line_interest")}`;
}
function renderDev(){
  let el=$("#devPanel"); if(!XP.dev){ if(el) el.remove(); return }
  if(!el){el=document.createElement("section");el.id="devPanel";el.className="xcard";$("#xp").append(el)}
  el.innerHTML=`<div class="xrow"><h2 style="font-size:17px">觀察紀錄：來源與事件</h2><span class="small muted">只存在這個畫面，關掉就消失</span></div>
   <pre id="obsPre" style="white-space:pre-wrap;font-family:var(--body);background:var(--sunk);border-radius:10px;padding:10px;margin:0;font-size:13px">${esc(obsText())}</pre><div><button class="btn ghost sm" data-copyobs="1">複製觀察摘要</button></div>
   <label class="xfld"><span class="xlab">來源（由網址 #代碼決定，也可在這裡切換測試）</span><select id="srcSel">${Object.entries(SRC).map(([k,v])=>`<option value="${k}" ${XP.source===k?"selected":""}>${v.label}</option>`).join("")}</select></label>
   <div class="xkv"><span>session</span><span>${XP.session}</span><span>模式</span><span>${MODE==="mine"?"我的公司（模擬）":"Demo（示範）"}</span><span>同意</span><span>${XP.consent||"尚未選擇"}</span><span>意願</span><span>${XP.leads.length} 筆（${XP.leads.map(l=>l.kind).join("、")||"—"}）</span></div>
   <div style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto">${XP.events.map(e=>`<div class="xev"><span>${e.t}</span><span><code>${e.type}</code> ${esc(e.data)}<br><span class="muted">來源：${SRC[e.src].label}</span></span><span class="pill ${e.ok?"green":"grey"}">${e.ok?"記錄":"不記錄"}</span></div>`).join("")||`<span class="small muted">還沒有事件。</span>`}</div>`;
}

/* ---------- 體驗區事件 ---------- */
function jumpTo(id){const el=document.getElementById(id), hd=$("header.top"); if(el) window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-(hd?hd.offsetHeight:0)-8,behavior:"smooth"})}
document.addEventListener("input",e=>{const t=e.target;
  if(t.dataset.in){const f=MOD().inputs.find(x=>x.k===t.dataset.in); XP.inp[f.k]=Number(t.value); document.querySelectorAll("#v-"+f.k).forEach(x=>x.textContent=fv2(f,XP.inp[f.k])); clampNote(); regenMine(); clearTimeout(track.t1); track.t1=setTimeout(()=>track("customize",`${f.k}=${t.value}`),600); return}
  if(t.id==="in-company"){XP.inp.company=t.value.slice(0,20); if(MODE==="mine") modeChrome(); return}
  if(t.dataset.sim){const f=MOD().simInputs.find(x=>x.k===t.dataset.sim); XP.sim[f.k]=Number(t.value); $("#sv-"+f.k).textContent=`${t.value} ${f.unit}`; $("#simRes").innerHTML=simRes(MOD().sim(curModel(),XP.sim,XP.asm)); clearTimeout(track.t2); track.t2=setTimeout(()=>track("simulator_use",`${f.k}=${t.value}`),600); return}
  if(t.dataset.asm){const v=Number(t.value); if(!Number.isNaN(v)&&v>=0){XP.asm[t.dataset.asm]=v; if(MODE==="mine"){S=mineState(); render(); renderScens(); renderAI(); $("#simRes").innerHTML=simRes(MOD().sim(curModel(),XP.sim,XP.asm))}} return}
});
document.addEventListener("change",e=>{ if(e.target.id==="srcSel"){XP.source=e.target.value; track("source_set",XP.source); toast("已切換來源")} });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&XP.xdrawer){XP.xdrawer=null;xRenderDrawer()} });
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return; const d=t.dataset;
  if(t.id==="devBtn"){XP.dev=!XP.dev; renderDev(); if(XP.dev) $("#devPanel").scrollIntoView({block:"nearest"}); return}
  if(t.id==="xpCta"){ return MODE==="mine"?backDemo():jumpTo("sec-form") }
  if(d.xgo){ if(d.xgo==="mine") return enterMine(); if(d.xgo==="demo") return backDemo(); if(d.xgo==="form") return jumpTo("sec-form"); if(d.xgo==="cfg") return jumpTo("sec-cfg"); if(d.xgo==="top"){window.scrollTo({top:0,behavior:"smooth"});return} }
  if(d.jump) return jumpTo(d.jump);
  if(d.consent){XP.consent=d.consent; track("consent",d.consent); document.querySelectorAll(".xconsent").forEach(x=>x.remove()); return}
  if(d.resetinp){XP.inp={...MOD().defaults}; XP.resolved={}; XP.asst={tasks:[],day:0}; S=mineState(); render(); xpRender(); modeChrome(); return}
  if(d.xclose){XP.xdrawer=null; xRenderDrawer(); return}
  if(d.scen){XP.scen={id:d.scen,step:0,choice:null}; XP.xdrawer={kind:"scen"}; xRenderDrawer(); track("scenario_open",d.scen); return}
  if(d.opt){XP.scen.choice=d.opt; $("#xdrb").innerHTML=scenBody(); return}
  if(d.next){const sc=XP.scen; if(sc.step===2&&!sc.choice) return; sc.step=Math.min(5,sc.step+(sc.step===2?2:1)); $("#xdrb").innerHTML=scenBody(); $("#xdrb").scrollTop=$("#xdrb").scrollHeight;
    if(sc.step===4) track("scenario_decision",`${sc.id}:${sc.choice}`);
    if(sc.step===5){XP.resolved[sc.id]=sc.choice; track("scenario_complete",sc.id); S=mineState(); render(); renderScens(); renderAI(); $("#simRes").innerHTML=simRes(MOD().sim(curModel(),XP.sim,XP.asm))} return}
  if(d.scenclose){const demo=XP.scen.demo; XP.xdrawer=null; XP.scen=null; xRenderDrawer(); toast(demo?"示範情境完成（儀表板不變）":"儀表板已依處理結果更新"); return}
  if(d.asst){const A=XP.asst;
    if(d.asst==="dispatch"){const m=curModel(); A.tasks=MOD().assistant(m).map((x,n)=>({task:x.task,who:ADAPT.who[n%3],metric:x.metric,done:n+1})); A.day=0; track("assistant_dispatch",IND)}
    if(d.asst==="day"){A.day=Math.min(3,A.day+1); if(A.day===3) track("assistant_result",IND)}
    if(d.asst==="reset"){A.tasks=[];A.day=0}
    renderAI(); return}
  if(d.conv){XP.xdrawer={kind:"conv",k:d.conv}; xRenderDrawer(); track(d.conv==="card"?"card_open":d.conv==="line"?"line_open":"booking_open",IND); return}
  if(d.copysum){try{await navigator.clipboard.writeText(summaryText()); toast("已複製摘要")}catch(err){toast("請長按摘要文字手動複製")} track("summary_request","copy"); return}
  if(d.intent){const kind=d.intent; XP.leads.push({kind:kind==="booking"?"想預約示範":"LINE 有興趣",src:XP.source});
    track(kind==="booking"?"booking_intent":"line_interest",`${IND}${XP.source!=="direct"?"・來源 "+XP.source:""}`); t.disabled=true; $("#intentBox").innerHTML=intentMsg(kind); return}
  if(d.cardsave){const dl=await getDL(); if(!dl||!showCard.c){toast("請長按圖片儲存");return}
    const blob=await new Promise(r=>showCard.c.toBlob(r,"image/png"));
    try{await dl.save({filename:`體驗成果卡-${MOD().name.slice(0,2)}.png`,data:blob}); track("card_save",IND)}catch(err){if(err&&err.code!=="declined") toast("這個畫面不能下載，請長按圖片儲存")} return}
  if(d.copyobs){try{await navigator.clipboard.writeText(obsText()); toast("已複製觀察摘要")}catch(err){toast("請長按文字手動複製")} return}
});
function boot(){XP=freshXP(); const h=applyHash(); render(); xpRender();
  if(h==="invalid") track("invalid_code","代碼不在名單，視為直接進入");
  track("page_open",`${IND}・Demo${XP.source!=="direct"?"・來源 "+XP.source:""}`)}
boot();
</script>
