<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>夯Bar串燒 宣傳影片</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;900&family=Noto+Serif+TC:wght@900&display=block" rel="stylesheet">
<style>
  :root {
    --bg: #0d0906;
    --fire: #ff6a00;
    --gold: #ffb627;
    --red: #e8341c;
    --cream: #fff3e0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  body { font-family: "Noto Sans TC", "WenQuanYi Zen Hei", sans-serif; color: var(--cream); }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
  #media { position: absolute; inset: 0; overflow: hidden; }
  #media img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0;
    filter: contrast(1.08) saturate(1.3) sepia(.1); transform-origin: 50% 50%; }
  #shade { position: absolute; inset: 0; }
  #flash { position: absolute; inset: 0; background: #ffd9a8; opacity: 0; mix-blend-mode: screen; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; left: 0; right: 0; text-align: center; opacity: 0; white-space: nowrap;
    text-shadow: 0 6px 24px rgba(0,0,0,.85), 0 0 4px rgba(0,0,0,.9); }
  .serif { font-family: "Noto Serif TC", "WenQuanYi Zen Hei", serif; font-weight: 900; }
  .black { font-weight: 900; }
  .fire { color: var(--fire); }
  .gold { color: var(--gold); }
  .glow { text-shadow: 0 0 30px rgba(255,106,0,.85), 0 0 80px rgba(255,60,0,.55), 0 6px 24px rgba(0,0,0,.8); }
  .pill { display: inline-block; padding: 14px 44px; border-radius: 80px; background: rgba(13,9,6,.72); border: 3px solid rgba(255,182,39,.6); text-shadow: none; }

  #end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 250px; opacity: 0; }
  #e-logo { display: flex; align-items: baseline; gap: 10px; }
  #e-logo .h { font-size: 300px; color: var(--fire); }
  #e-logo .b { font-size: 170px; font-weight: 900; }
  #e-kushi { font-size: 120px; letter-spacing: 40px; margin-right: -40px; color: var(--gold); margin-top: -10px; }
  .card { width: 900px; margin-top: 50px; border: 3px solid rgba(255,182,39,.55); border-radius: 36px; background: rgba(20,12,8,.78); padding: 50px 56px; text-align: left; }
  .row { display: flex; align-items: center; gap: 34px; padding: 22px 0; }
  .row + .row { border-top: 2px dashed rgba(255,243,224,.18); }
  .ico { flex: none; width: 96px; height: 96px; border-radius: 50%; background: var(--fire); display: flex; align-items: center; justify-content: center; }
  .ico svg { width: 54px; height: 54px; fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { font-size: 34px; color: var(--gold); letter-spacing: 6px; }
  .val { font-size: 64px; font-weight: 900; letter-spacing: 2px; line-height: 1.2; }
  .val.addr { font-size: 54px; }
  #e-cta { margin-top: 60px; font-size: 76px; letter-spacing: 14px; color: var(--cream); padding: 22px 70px; border-radius: 80px; background: linear-gradient(90deg, var(--red), var(--fire)); }
  #end > * { will-change: transform, opacity; }
</style>
</head>
<body>
<div id="stage">
  <div id="media"></div>
  <div id="shade"></div>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="texts"></div>
  <div id="end">
    <div id="e-logo"><span class="h serif glow">夯</span><span class="b">Bar</span></div>
    <div id="e-kushi" class="serif">串燒</div>
    <div class="card" id="e-card">
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
        <div><div class="lbl">地址</div><div class="val addr">宜蘭市健康路2段135號</div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg></div>
        <div><div class="lbl">訂位專線</div><div class="val">03-936-6628</div></div>
      </div>
      <div class="row">
        <div class="ico"><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg></div>
        <div><div class="lbl">手機</div><div class="val">0960-298-898</div></div>
      </div>
    </div>
    <div id="e-cta" class="black">歡迎訂位</div>
  </div>
  <div id="flash"></div>
</div>

<script>
const DURATION = 30;
const FPS = 30;

// ---------- 鏡頭表 ----------
// video: 使用 render.mjs 從 media/<clip>.mp4 抽出的影格（window.FRAMES[clip] = 影格 URL 陣列），from = 從影片第幾秒開始
// photo: media/<file>.jpg，zoom/pan 為緩慢推近方向
const SHOTS = [
  { t: [0.0, 3.0],   video: 'grill',   from: 0,   dark: 0.55 },
  { t: [3.0, 5.4],   video: 'closeup', from: 0,   dark: 0.25 },
  { t: [5.4, 7.6],   photo: 'prep',    pan: [0, -40], zoom: [1.12, 1.0], dark: 0.3 },
  { t: [7.6, 8.3],   photo: 'rolls',    pan: [0, 0], zoom: [1.2, 1.08], dark: 0.2 },
  { t: [8.3, 9.0],   photo: 'veggies',  pan: [0, 0], zoom: [1.2, 1.08], dark: 0.2 },
  { t: [9.0, 9.7],   photo: 'tofuskin', pan: [0, 0], zoom: [1.2, 1.08], dark: 0.2 },
  { t: [9.7, 11.9],   photo: 'tongs',   pan: [40, 0],  zoom: [1.05, 1.18], dark: 0.3 },
  { t: [11.9, 14.1],  photo: 'chef',    pan: [0, 30],  zoom: [1.15, 1.05], dark: 0.3 },
  { t: [14.1, 18.6], video: 'banner',  from: 2.0, dark: 0.15 },
  { t: [18.6, 21.8], video: 'grill',   from: 3.3, dark: 0.45 },
  { t: [21.8, 25.1], photo: 'storefront', pan: [0, 0], zoom: [1.0, 1.12], dark: 0.35 },
  { t: [25.1, 30.0], photo: 'street',  pan: [0, 0],  zoom: [1.1, 1.2], dark: 0.72, blur: 10 },
];
// 切換鏡頭時的閃光
const FLASHES = [3.0, 7.6, 14.1, 18.6, 21.8, 25.1];

// ---------- 文字 ----------
// anim: slam / left / right / up / pop / punch
const TEXTS = [
  // 開場
  { t: [0.2, 2.8],  y: 520,  html: '夯', cls: 'serif glow fire', size: 480, anim: 'slam' },
  { t: [0.75, 2.8], y: 1020, html: 'Bar', cls: 'black', size: 220, anim: 'left' },
  { t: [1.1, 2.8],  y: 1290, html: '串燒', cls: 'serif gold', size: 160, anim: 'up', ls: 50 },
  { t: [1.6, 2.8],  y: 1530, html: '宜蘭市．炭火串燒酒場', cls: '', size: 46, anim: 'up', ls: 14 },
  // 炭火
  { t: [3.1, 5.3],  y: 260,  html: '炭火直烤', cls: 'serif', size: 180, anim: 'left' },
  { t: [3.5, 5.3],  y: 470,  html: '香到犯規', cls: 'serif glow fire', size: 180, anim: 'right' },
  // 備料
  { t: [5.5, 7.5],  y: 230,  html: '新鮮備料', cls: 'serif', size: 170, anim: 'punch' },
  { t: [5.8, 7.5],  y: 430,  html: '<span class="pill gold">豆干．香腸．米血．鮮蔬</span>', cls: 'black', size: 54, anim: 'up' },
  // 串串任你挑（快剪）
  { t: [7.65, 9.7], y: 230, html: '串串任你挑', cls: 'serif glow fire', size: 170, anim: 'punch' },
  { t: [7.7, 8.3],  y: 1560, html: '<span class="pill">蔥肉捲</span>', cls: 'black', size: 64, anim: 'pop' },
  { t: [8.4, 9.0],  y: 1560, html: '<span class="pill">青椒．四季豆．櫛瓜</span>', cls: 'black', size: 64, anim: 'pop' },
  { t: [9.1, 9.7],  y: 1560, html: '<span class="pill">豆皮．香腸．熱狗</span>', cls: 'black', size: 64, anim: 'pop' },
  // 手作
  { t: [9.8, 14.0], y: 230,  html: '一串一串', cls: 'serif', size: 180, anim: 'left' },
  { t: [10.2, 14.0], y: 440,  html: '現點現烤', cls: 'serif glow fire', size: 180, anim: 'right' },
  { t: [12.0, 14.0], y: 1560, html: '<span class="pill">用心顧火　每一串都到位</span>', cls: 'black', size: 56, anim: 'up' },
  // 招牌
  { t: [14.7, 18.5], y: 1500, html: '<span class="pill">這裡有酒有菜 🍻</span>', cls: 'black', size: 70, anim: 'pop' },
  // 節奏字卡
  { t: [18.7, 19.7], y: 760, html: '下班後', cls: 'serif', size: 250, anim: 'punch' },
  { t: [19.7, 20.7], y: 760, html: '來一串', cls: 'serif glow fire', size: 250, anim: 'punch' },
  { t: [20.7, 21.8], y: 760, html: '配一杯', cls: 'serif gold', size: 250, anim: 'punch' },
  // 標語
  { t: [22.1, 25.0], y: 300, html: '今晚，', cls: 'serif', size: 150, anim: 'up' },
  { t: [22.5, 25.0], y: 480, html: '夯一下！', cls: 'serif glow fire', size: 220, anim: 'pop' },
  { t: [23.1, 25.0], y: 1580, html: '<span class="pill gold">平價串燒．碳烤現做</span>', cls: 'black', size: 60, anim: 'up' },
];

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOut = p => 1 - Math.pow(1 - p, 3);
const easeIn = p => p * p * p;
const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeBack = p => { const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const $ = id => document.getElementById(id);

// ---------- 建立元素 ----------
const FRAMES = window.FRAMES || {};
const mediaEls = SHOTS.map(s => {
  const img = document.createElement('img');
  if (s.photo) img.src = `media/${s.photo}.jpg`;
  if (s.blur) img.style.filter += ` blur(${s.blur}px)`;
  $('media').appendChild(img);
  return img;
});
const textEls = TEXTS.map(d => {
  const e = document.createElement('div');
  e.className = 't ' + d.cls;
  e.innerHTML = d.html;
  e.style.top = d.y + 'px';
  e.style.fontSize = d.size + 'px';
  e.style.lineHeight = 1.15;
  if (d.ls) { e.style.letterSpacing = d.ls + 'px'; e.style.textIndent = d.ls + 'px'; }
  $('texts').appendChild(e);
  return e;
});

// ---------- 火星粒子 ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const EMBERS = Array.from({ length: 110 }, () => ({
  x: rnd() * 1080, y: rnd() * 2200, s: 1.5 + rnd() * 4.5, v: 90 + rnd() * 260,
  w: rnd() * 6.28, a: 30 + rnd() * 60, hue: 18 + rnd() * 30
}));
const ctx = $('fx').getContext('2d');

function drawFx(t, heat, glow) {
  ctx.clearRect(0, 0, 1080, 1920);
  if (glow > 0) {
    const f = (0.75 + 0.12 * Math.sin(t * 13.1) + 0.08 * Math.sin(t * 29.7 + 1)) * glow;
    const g = ctx.createRadialGradient(540, 2050, 50, 540, 2050, 1300);
    g.addColorStop(0, `rgba(255,110,20,${0.7 * f})`);
    g.addColorStop(0.35, `rgba(220,50,10,${0.3 * f})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1080, 1920);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of EMBERS) {
    const y = ((p.y - p.v * t) % 2200 + 2200) % 2200 - 140;
    const x = p.x + Math.sin(t * 1.6 + p.w) * p.a;
    const life = clamp(y / 1920);
    const al = life * (0.5 + 0.5 * Math.sin(t * 9 + p.w)) * heat;
    const r = p.s * (0.6 + life);
    const eg = ctx.createRadialGradient(x, y, 0, x, y, r * 4);
    eg.addColorStop(0, `hsla(${p.hue},100%,70%,${al})`);
    eg.addColorStop(1, `hsla(${p.hue},100%,50%,0)`);
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.arc(x, y, r * 4, 0, 6.29); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

// ---------- 文字動畫 ----------
function animText(e, d, t) {
  const [a, b] = d.t;
  if (t < a || t > b) { e.style.opacity = 0; return; }
  const out = prog(t, b - 0.2, b);
  let op = 1, tf = '';
  switch (d.anim) {
    case 'slam': { const p = prog(t, a, a + 0.4); op = Math.min(p * 3, 1); tf = `scale(${3.2 - 2.2 * easeIn(p) + out * 0.3})`; break; }
    case 'left': { const p = easeOut(prog(t, a, a + 0.3)); op = p; tf = `translateX(${(1 - p) * -700}px)`; break; }
    case 'right': { const p = easeOut(prog(t, a, a + 0.3)); op = p; tf = `translateX(${(1 - p) * 700}px)`; break; }
    case 'up': { const p = easeOut(prog(t, a, a + 0.35)); op = p; tf = `translateY(${(1 - p) * 60}px)`; break; }
    case 'pop': { const p = prog(t, a, a + 0.35); op = Math.min(p * 2.5, 1); tf = `scale(${0.3 + 0.7 * easeBack(p) + 0.03 * Math.sin((t - a) * 6) * prog(t, a + 0.4, a + 0.7)})`; break; }
    case 'punch': { const p = prog(t, a, a + 0.22); op = Math.min(p * 2, 1); tf = `scale(${1.3 - 0.3 * easeOut(p) + 0.05 * prog(t, a, b)})`; break; }
  }
  e.style.opacity = op * (1 - out);
  e.style.transform = tf;
}

// ---------- 主渲染 ----------
window.render = async function (t) {
  let cur = SHOTS.findIndex(s => t >= s.t[0] && t < s.t[1]);
  if (cur < 0) cur = SHOTS.length - 1;
  const s = SHOTS[cur];
  const lt = t - s.t[0];
  const p = prog(t, s.t[0], s.t[1]);

  mediaEls.forEach((img, i) => { img.style.opacity = i === cur ? 1 : 0; });
  const img = mediaEls[cur];
  const punch = 1 + 0.08 * (1 - easeOut(prog(lt, 0, 0.3)));
  if (s.video) {
    const list = FRAMES[s.video] || [];
    const idx = Math.min(list.length - 1, Math.round((s.from + lt) * FPS));
    if (list.length && img.getAttribute('src') !== list[idx]) img.src = list[idx];
    img.style.transform = `scale(${(1.02 + 0.04 * p) * punch})`;
  } else {
    const z = lerp(s.zoom[0], s.zoom[1], easeInOut(p));
    img.style.transform = `scale(${z * punch}) translate(${lerp(-s.pan[0], s.pan[0], p)}px, ${lerp(-s.pan[1], s.pan[1], p)}px)`;
  }
  $('shade').style.background =
    `linear-gradient(180deg, rgba(13,9,6,${Math.min(s.dark + 0.35, 0.9)}) 0%, rgba(13,9,6,${s.dark}) 35%, rgba(13,9,6,${s.dark * 0.6}) 60%, rgba(13,9,6,${Math.min(s.dark + 0.3, 0.9)}) 100%)`;

  // 開場「夯」落下時震動
  const sp = prog(t, 0.55, 0.95);
  const shake = sp > 0 && sp < 1 ? (1 - sp) * 18 : 0;
  $('stage').style.transform = `translate(${Math.sin(t * 90) * shake}px, ${Math.cos(t * 77) * shake}px)`;

  // 閃光轉場
  let fl = 0;
  for (const f of FLASHES) if (t >= f - 0.05 && t < f + 0.25) fl = Math.max(fl, t < f ? 0.6 : 0.6 * (1 - prog(t, f, f + 0.25)));
  $('flash').style.opacity = fl;

  const inEnd = t >= 25.1;
  drawFx(t, inEnd || t < 3 ? 1 : 0.55, inEnd ? 0.8 : (t < 3 ? 0.6 : 0));

  TEXTS.forEach((d, i) => animText(textEls[i], d, t));

  // 結尾資訊
  const end = $('end');
  end.style.opacity = inEnd ? 1 : 0;
  if (inEnd) {
    const set = (id, op, tf) => { $(id).style.opacity = op; $(id).style.transform = tf; };
    set('e-logo', easeOut(prog(t, 25.2, 25.5)), `scale(${0.6 + 0.4 * easeBack(prog(t, 25.2, 25.6))})`);
    set('e-kushi', easeOut(prog(t, 25.4, 25.7)), `translateY(${(1 - easeOut(prog(t, 25.4, 25.7))) * 50}px)`);
    set('e-card', easeOut(prog(t, 25.6, 26.0)), `translateY(${(1 - easeOut(prog(t, 25.6, 26.0))) * 120}px)`);
    const pulse = 1 + 0.04 * Math.sin((t - 26.4) * 6) * prog(t, 26.4, 26.6);
    set('e-cta', easeOut(prog(t, 26.1, 26.4)), `scale(${(0.7 + 0.3 * easeBack(prog(t, 26.1, 26.4))) * pulse})`);
  }

  if (s.video) await img.decode().catch(() => {});
};

// 瀏覽器直接開啟時自動預覽（影片鏡頭需經 render.mjs 抽格後才會顯示）
if (!window.__RENDERING__) {
  const start = performance.now();
  const loop = () => { window.render(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  document.fonts.ready.then(loop);
}
</script>
</body>
</html>
